[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggriculture-dynamic-agent"
version = "0.1.0"
description = "Observation-conditioned autoregressive agent for Kaggriculture"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = [
  "kaggle-environments==1.32.6",
  "numpy>=2.0",
  "orjson>=3.10",
  "safetensors>=0.5",
  "tensorboard>=2.18",
  "torch>=2.8",
  "tqdm>=4.67",
]
collect = ["kaggle>=2.2", "requests>=2.32"]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
