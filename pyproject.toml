[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggriculture-heuristic-agent"
version = "0.1.0"
description = "Deterministic 5x5 lifecycle heuristic for Kaggriculture"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["kaggle-environments>=1.32.3", "pytest>=8.3", "ruff>=0.9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
