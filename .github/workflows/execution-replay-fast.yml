name: Fast A replay validation

on:
  push:
    branches: [agent-v3]

permissions:
  contents: read

concurrency:
  group: execution-replay-fast-${{ github.sha }}
  cancel-in-progress: false

env:
  PATCH_BASE_COMMIT: f3c820e50892b1f0715470b9e5e8bb6c03f74937
  PYTHONUNBUFFERED: "1"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply candidate in runner only
        run: |
          python experiments/_validate_execution_candidate.py
          python -m py_compile agents/expansion_agent.py
          git diff --check
          git diff -- agents/expansion_agent.py
      - name: Install Kaggriculture runtime
        run: python -m pip install --upgrade kaggle-environments
      - name: Run candidate and original against same A.ipynb
        run: |
          mkdir -p validation/current validation/original
          timeout 300s python -m experiments.play_match --opponent public/A.ipynb --seed 1 --output-dir validation/current
          git worktree add --detach "$RUNNER_TEMP/pre-fix" "$PATCH_BASE_COMMIT"
          (cd "$RUNNER_TEMP/pre-fix" && timeout 300s python -m experiments.play_match --opponent "$GITHUB_WORKSPACE/public/A.ipynb" --seed 1 --output-dir "$GITHUB_WORKSPACE/validation/original")
          python - <<'PY'
          import json
          from pathlib import Path
          r = Path('validation')
          c = sorted((r/'current').glob('current_vs_A_seed1_*'))[-1]
          o = sorted((r/'original').glob('current_vs_A_seed1_*'))[-1]
          C = json.loads((c/'result.json').read_text())
          O = json.loads((o/'result.json').read_text())
          out = {
              'candidate': C['current_cash'],
              'original': O['current_cash'],
              'delta': C['current_cash'] - O['current_cash'],
              'candidate_margin': C['margin'],
              'original_margin': O['margin'],
          }
          (r/'comparison.json').write_text(json.dumps(out, indent=2))
          print(json.dumps(out, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-a-replay-${{ github.sha }}
          path: validation
          if-no-files-found: warn
