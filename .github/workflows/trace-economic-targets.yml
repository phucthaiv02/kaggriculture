name: Trace Economic Target Decisions
on:
  push:
    branches: [feat/planner-capacity-v4]
    paths: [.github/workflows/trace-economic-targets.yml]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/planner-capacity-v4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instrument planner target choices
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('agents/planner.py')
          s=p.read_text()
          old='''        if choice is None:\n            continue\n        targets[position] = choice\n        counts[choice[0]] += 1\n        baseline.add(output)\n'''
          new='''        if choice is None:\n            continue\n        try:\n            ranked = sorted(\n                [r for r in evaluate_daily_targets(market, baseline, allowed, labor, position) if r.profit > 0],\n                key=lambda r: (r.profit_per_day, r.profit), reverse=True\n            )[:3]\n            print("TARGET_TRACE", {\n                "day": day, "position": position, "choice": choice,\n                "money": farm.get("money"), "counts": dict(counts),\n                "top": [(r.choice, round(r.profit,2), round(r.profit_per_day,2), round(r.market_cash,2), round(r.capital_cost,2), round(r.labor_cost,2), r.days) for r in ranked]\n            }, flush=True)\n        except Exception as exc:\n            print("TARGET_TRACE_ERR", day, position, repr(exc), flush=True)\n        targets[position] = choice\n        counts[choice[0]] += 1\n        baseline.add(output)\n'''
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
      - name: Install engine
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7'
      - name: Restore exact opponent
        run: |
          git fetch origin tmp/benchmark-v5-seeds1-5
          mkdir -p .tmp public
          git show origin/tmp/benchmark-v5-seeds1-5:.tmp/opp.part0 > .tmp/opp.part0
          git show origin/tmp/benchmark-v5-seeds1-5:.tmp/opp.part1 > .tmp/opp.part1
          git show origin/tmp/benchmark-v5-seeds1-5:.tmp/opp.part2 > .tmp/opp.part2
          cat .tmp/opp.part0 .tmp/opp.part1 .tmp/opp.part2 | base64 -d | gzip -d > public/A.py
      - name: Trace seeds 1 3 6 9
        run: |
          python - <<'PY'
          import importlib.util
          from kaggle_environments import make
          from agents.expansion_agent import make_agent
          from experiments.play_match import configuration, END_DAY
          spec=importlib.util.spec_from_file_location('exact_opp','public/A.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          opp=getattr(mod,'agent',None) or getattr(mod,'main',None)
          if opp is None:
              funcs=[v for v in mod.__dict__.values() if callable(v) and getattr(v,'__module__',None)==mod.__name__]
              opp=funcs[0]
          for seed in (1,3,6,9):
              print('TRACE_SEED_START', seed, flush=True)
              env=make('kaggriculture', configuration=configuration(seed), debug=False)
              env.run([make_agent(END_DAY-1, seed=seed), opp])
              print('TRACE_SEED_END', seed, env.steps[-1][0].reward, env.steps[-1][1].reward, flush=True)
          PY
