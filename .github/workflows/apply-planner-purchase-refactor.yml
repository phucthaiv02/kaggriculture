name: Apply Planner Purchase Refactor

on:
  push:
    branches:
      - feat/planner-capacity-v4
    paths:
      - .github/workflows/apply-planner-purchase-refactor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/planner-capacity-v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply refactor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('agents/expansion_agent.py')
          text = path.read_text()
          old = '''            tasks = build_tasks(\n                obs,\n                targets,\n                assume_crop_seeds=True,\n                prioritize_fertilizer_drop=state["opening_active"],\n            )  # preserve same-day HARVEST -> PLANT while seed arrives mid-day\n'''
          new = '''            # Hour-0 planner purchases have already resolved by hour 1.\n            # Build execution work from inventory that actually reached the\n            # shed; never invent a seed here and make a worker wait on PLANT.\n            tasks = build_tasks(\n                obs,\n                targets,\n                prioritize_fertilizer_drop=state["opening_active"],\n            )\n'''
          assert old in text, 'hour-1 assumed-seed block changed unexpectedly'
          text = text.replace(old, new, 1)

          old = '''            plan = plans[index] if index < len(plans) else None\n            if plan is not None:\n                plan.queue.insert(0, operation)\n            worker_ops[index] = ["PASS"]\n'''
          new = '''            # A missing seed means the market order did not actually land\n            # (cash/order-cap race, etc.). Do not pin this worker behind a\n            # retrying PLANT: discard the planting attempt and its immediate\n            # crop-care tail so later WATER/HARVEST work can still execute.\n            plan = plans[index] if index < len(plans) else None\n            if plan is not None:\n                while plan.queue and plan.queue[0][0] in ("WATER", "FERTILIZE"):\n                    plan.queue.pop(0)\n            worker_ops[index] = ["PASS"]\n'''
          assert old in text, 'missing-seed retry block changed unexpectedly'
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('agents/intraday.py')
          text = path.read_text()
          start = text.index('    # If a replacement seed is affordable but not delivered yet, retain the\n')
          end = text.index('    # Already-owned inputs can be used this turn, including at hour 22.\n', start)
          replacement = '''    # `selected`/`funded_positions` above is purchase intent only. A seed\n    # that is merely affordable is not executable inventory yet: market\n    # orders settle after worker actions. Leave the worker's current queue\n    # untouched; on the next observation the actual delivered seed will be\n    # admitted by the `actual` block below. This keeps speculative PLANT out\n    # of the front of WATER/HARVEST routes.\n\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          path = Path('tests/test_agents_intraday.py')
          text = path.read_text()
          old = '''def test_harvester_waits_for_affordable_seed_instead_of_walking_away():\n    obs = make_obs(day=8, money=10)\n    plans = [WorkerPlan((4, 4), [["EAST"]])]\n    targets = {(4, 4): ("WHEAT", False)}\n    eligible, hires = schedule_open_tiles(obs, targets, plans, SHED_ACCESS)\n    assert plans[0].queue[:2] == [["PLANT", "WHEAT"], ["WATER"]]\n    assert purchase_orders(obs, eligible, list(eligible)) == [["BUY_SEED", "WHEAT", 1]]\n    assert hires == 0\n\n\ndef test_delayed_seed_never_preempts_pending_crop_protection():\n    targets = {(4, 4): ("WHEAT", False)}\n    for protective in ("WATER", "HARVEST"):\n        obs = make_obs(day=8, money=10)\n        plans = [WorkerPlan((4, 4), [["EAST"], [protective]])]\n        eligible, hires = schedule_open_tiles(obs, targets, plans, SHED_ACCESS)\n        assert plans[0].queue == [["EAST"], [protective]]\n        assert purchase_orders(obs, eligible, list(eligible)) == [["BUY_SEED", "WHEAT", 1]]\n        assert hires == 0\n'''
          new = '''def test_affordable_seed_is_bought_before_plant_is_scheduled():\n    obs = make_obs(day=8, money=10)\n    plans = [WorkerPlan((4, 4), [["EAST"]])]\n    targets = {(4, 4): ("WHEAT", False)}\n    eligible, hires = schedule_open_tiles(obs, targets, plans, SHED_ACCESS)\n    # Target selection creates purchase intent, but the queue is not allowed\n    # to pretend the seed exists before the market order has settled.\n    assert plans[0].queue == [["EAST"]]\n    assert purchase_orders(obs, eligible, list(eligible)) == [["BUY_SEED", "WHEAT", 1]]\n    assert hires == 0\n\n\ndef test_delayed_seed_never_changes_existing_protective_route():\n    targets = {(4, 4): ("WHEAT", False)}\n    for protective in ("WATER", "HARVEST"):\n        obs = make_obs(day=8, money=10)\n        plans = [WorkerPlan((4, 4), [["EAST"], [protective]])]\n        eligible, hires = schedule_open_tiles(obs, targets, plans, SHED_ACCESS)\n        assert plans[0].queue == [["EAST"], [protective]]\n        assert purchase_orders(obs, eligible, list(eligible)) == [["BUY_SEED", "WHEAT", 1]]\n        assert hires == 0\n'''
          assert old in text, 'intraday seed tests changed unexpectedly'
          text = text.replace(old, new, 1)
          path.write_text(text)

          Path('.github/workflows/apply-planner-purchase-refactor.yml').unlink()
          PY
      - name: Install engine and tests
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7' pytest
      - name: Run focused regression tests
        run: python -m pytest -q tests/test_agents_intraday.py tests/test_agents_harvest_priority.py tests/test_agents_scheduler.py tests/test_agents_farm_tasks.py tests/test_agents_planner_daily.py tests/test_agents_opening_book.py
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agents/expansion_agent.py agents/intraday.py tests/test_agents_intraday.py .github/workflows/apply-planner-purchase-refactor.yml
          git commit -m 'fix: buy planner inputs before scheduling plant'
          git push origin HEAD:feat/planner-capacity-v4
