name: Planner joint allocation smoke
on:
  push:
    branches: [feat/planner-capacity-v4]
    paths: [.github/workflows/planner-joint-smoke.yml]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install kaggle-environments==1.32.7 pytest
      - name: Baseline melon planner
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from collections import Counter
          from kaggle_environments import make
          from agents.expansion_agent import make_agent

          env = make('kaggriculture', configuration={
              'seed': 1, 'weedSpawnChance': 0.0, 'episodeSteps': 288,
          }, debug=False)
          agent = make_agent(opening_version='melon_v2')
          env.run([lambda obs: agent(obs), lambda obs: {'farmer': ['PASS'], 'market': []}])
          day_hands = {}
          for frame in env.steps:
              obs = frame[0].observation
              day_hands[obs.day] = max(day_hands.get(obs.day, 0), len(obs.farms[0].hands))
          final = env.steps[-1][0].observation.farms[0]
          kinds = Counter()
          for row in final.tiles:
              for tile in row:
                  if isinstance(tile, dict):
                      name = tile.get('animal') or tile.get('crop')
                      if name:
                          kinds[name] += 1
          result = {
              'money': final.money,
              'hand_days': sum(day_hands.get(day, 0) for day in range(6, max(day_hands)+1)),
              'kinds': dict(kinds),
          }
          print('BASELINE', result)
          with open('/tmp/planner_base.json', 'w') as f:
              json.dump(result, f)
          PY
      - name: Apply selector-preserving joint allocation
        run: |
          python - <<'PY'
          from pathlib import Path

          planner = Path('agents/planner.py')
          text = planner.read_text()
          old = '''    for position in sorted(\n        replanning, key=lambda p: (distance(p), p[1], p[0])\n    ):\n        x, y = position\n        tile = farm[\"tiles\"][y][x]\n        allowed = candidates\n        if isinstance(tile, dict) and tile.get(\"kind\") in (\"COOP\", \"PASTURE\"):\n            allowed = [\n                c\n                for c in candidates\n                if c[0][0] in ANIMALS\n                and official_game.ANIMALS[c[0][0]][\"structure\"] == tile[\"kind\"]\n            ]\n\n        allowed = [candidate for candidate in allowed if start_cost(candidate[0]) <= max(0, cash)]\n        selector = (\n            _choose_daily_mirrored\n            if planner_version == \"mirror_v2\"\n            else _choose_daily\n        )\n        choice, output = selector(\n            market, baseline, allowed, counts, labor, position\n        )\n        targets[position] = choice\n        if not choice:\n            continue\n\n        reserve_start(choice)\n        baseline.add(output, position)\n        if planner_version == \"mirror_v2\":\n            # Keep the rival's mirrored commitment in later tile decisions;\n            # each accepted target represents one producer for each player.\n            external.add(output, position)\n        counts[choice[0]] += 1\n'''
          new = '''    # Choose the best position/producer pair under the same selector and\n    # affordability rules used historically.  The old nearest-first loop gave\n    # nearby tiles first claim on cash, labor and favorable market depth before\n    # farther positions were even evaluated.  Here every remaining position\n    # proposes its locally best affordable target; only then do we commit the\n    # strongest marginal proposal and reprice the rest against the new shared\n    # baseline.  Keeping the selector call intact preserves planner-version\n    # behavior and the affordability contract tested by production regressions.\n    selector = (\n        _choose_daily_mirrored\n        if planner_version == \"mirror_v2\"\n        else _choose_daily\n    )\n    pending = set(replanning)\n    while pending:\n        proposals = []\n        for position in sorted(pending):\n            x, y = position\n            tile = farm[\"tiles\"][y][x]\n            allowed = candidates\n            if isinstance(tile, dict) and tile.get(\"kind\") in (\"COOP\", \"PASTURE\"):\n                allowed = [\n                    c\n                    for c in candidates\n                    if c[0][0] in ANIMALS\n                    and official_game.ANIMALS[c[0][0]][\"structure\"] == tile[\"kind\"]\n                ]\n            allowed = [\n                candidate for candidate in allowed\n                if start_cost(candidate[0]) <= max(0, cash)\n            ]\n            choice, output = selector(\n                market, baseline, allowed, counts, labor, position\n            )\n            if not choice:\n                continue\n\n            # Score exactly the selector's chosen target at this position.\n            # In normal operation this reproduces the selector's own economic\n            # ranking; in tests it also honors a monkeypatched selector rather\n            # than silently bypassing it.\n            chosen_candidates = [c for c in allowed if c[0] == choice]\n            scored = evaluate_daily_targets(\n                market, baseline, chosen_candidates, labor, position,\n                mirror_opponent=planner_version == \"mirror_v2\",\n            )\n            if not scored:\n                continue\n            result = scored[0]\n            if planner_version == \"mirror_v2\":\n                rank = (\n                    result.profit_per_day, result.profit,\n                    -counts[choice[0]], choice,\n                )\n            else:\n                rank = (\n                    result.profit_per_day\n                    / (1.0 + TARGET_CONCENTRATION_PENALTY * counts[choice[0]]),\n                    result.profit_per_day, result.profit,\n                    -counts[choice[0]], choice,\n                )\n            proposals.append((\n                rank, -distance(position), -position[1], -position[0],\n                position, choice, output,\n            ))\n\n        if not proposals:\n            for position in pending:\n                targets[position] = None\n            break\n\n        *_, position, choice, output = max(\n            proposals, key=lambda item: item[:-3]\n        )\n        targets[position] = choice\n        reserve_start(choice)\n        baseline.add(output, position)\n        if planner_version == \"mirror_v2\":\n            # Keep the rival's mirrored commitment in later tile decisions;\n            # each accepted target represents one producer for each player.\n            external.add(output, position)\n        counts[choice[0]] += 1\n        pending.remove(position)\n'''
          if old not in text:
              raise SystemExit('planner allocation loop not found')
          planner.write_text(text.replace(old, new))

          tests = Path('tests/test_agents_planner.py')
          text = tests.read_text()
          old_test = '''    assert seen_external == [0, 4]\n'''
          new_test = '''    # Joint allocation evaluates every pending position before committing\n    # one, so both first-round proposals see the same zero external baseline.\n    # After the first commitment, the remaining proposal must see that rival\n    # production in the shared market forecast.\n    assert seen_external == [0, 0, 4]\n'''
          if old_test not in text:
              raise SystemExit('mirror expectation not found')
          text = text.replace(old_test, new_test)
          text += '''\n\ndef test_plan_targets_ranks_positions_before_committing_cash(monkeypatch):\n    from agents import planner\n    from agents.forecast import Production\n\n    near, far = (4, 4), (0, 0)\n\n    def choose(_market, baseline, candidates, _counts, _labor, position):\n        if not candidates:\n            return None, None\n        output = Production()\n        committed = sum(sum(values.values()) for values in baseline.sales.values())\n        if position == far and committed == 0:\n            output.sales[4][\"MELON\"] = 20\n            return (\"MELON\", False), output\n        output.sales[4][\"WHEAT\"] = 1\n        return (\"WHEAT\", False), output\n\n    monkeypatch.setattr(planner, \"_choose_daily\", choose)\n    targets = {}\n    plan_targets(make_obs(day=0, money=10000), targets, [near, far], end_day=29)\n    assert targets[far] == (\"MELON\", False)\n    assert targets[near] == (\"WHEAT\", False)\n'''
          tests.write_text(text)
          PY
      - name: Planner regressions
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_agents_planner.py \
            tests/test_agents_affordable_production.py \
            tests/test_agents_labor.py \
            tests/test_agents_forecast.py \
            tests/test_agents_capacity_guard.py \
            tests/test_agents_intraday.py \
            tests/test_agents_melon_opening.py \
            tests/test_survival_debt_regression.py
      - name: Candidate melon planner
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from collections import Counter
          from kaggle_environments import make
          from agents.expansion_agent import make_agent

          with open('/tmp/planner_base.json') as f:
              base = json.load(f)
          env = make('kaggriculture', configuration={
              'seed': 1, 'weedSpawnChance': 0.0, 'episodeSteps': 288,
          }, debug=False)
          agent = make_agent(opening_version='melon_v2')
          env.run([lambda obs: agent(obs), lambda obs: {'farmer': ['PASS'], 'market': []}])
          day_hands = {}
          for frame in env.steps:
              obs = frame[0].observation
              day_hands[obs.day] = max(day_hands.get(obs.day, 0), len(obs.farms[0].hands))
          final = env.steps[-1][0].observation.farms[0]
          kinds = Counter()
          for row in final.tiles:
              for tile in row:
                  if isinstance(tile, dict):
                      name = tile.get('animal') or tile.get('crop')
                      if name:
                          kinds[name] += 1
          cand = {
              'money': final.money,
              'hand_days': sum(day_hands.get(day, 0) for day in range(6, max(day_hands)+1)),
              'kinds': dict(kinds),
          }
          print('BASELINE', base)
          print('CANDIDATE', cand)
          print('money_delta=', cand['money'] - base['money'], 'hand_day_delta=', cand['hand_days'] - base['hand_days'])
          assert cand['money'] > base['money'], (base, cand)
          PY
      - name: Commit planner optimization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agents/planner.py tests/test_agents_planner.py
          git commit -m 'optimize: jointly rank planner positions'
          git push
