name: Planner two-ply smoke
on:
  push:
    branches: [feat/planner-capacity-v4]
    paths: [.github/workflows/planner-joint-smoke.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install kaggle-environments==1.32.7 pytest
      - name: Prepare candidate patcher
        run: |
          cp agents/planner.py /tmp/planner.original.py
          cat > /tmp/apply_two_ply.py <<'PY'
          from pathlib import Path
          import sys

          mode = sys.argv[1]
          path = Path('agents/planner.py')
          text = path.read_text()
          old = '''    for position in sorted(\n        replanning, key=lambda p: (distance(p), p[1], p[0])\n    ):\n        x, y = position\n        tile = farm[\"tiles\"][y][x]\n        allowed = candidates\n        if isinstance(tile, dict) and tile.get(\"kind\") in (\"COOP\", \"PASTURE\"):\n            allowed = [\n                c\n                for c in candidates\n                if c[0][0] in ANIMALS\n                and official_game.ANIMALS[c[0][0]][\"structure\"] == tile[\"kind\"]\n            ]\n\n        allowed = [candidate for candidate in allowed if start_cost(candidate[0]) <= max(0, cash)]\n        selector = (\n            _choose_daily_mirrored\n            if planner_version == \"mirror_v2\"\n            else _choose_daily\n        )\n        choice, output = selector(\n            market, baseline, allowed, counts, labor, position\n        )\n        targets[position] = choice\n        if not choice:\n            continue\n\n        reserve_start(choice)\n        baseline.add(output, position)\n        if planner_version == \"mirror_v2\":\n            # Keep the rival's mirrored commitment in later tile decisions;\n            # each accepted target represents one producer for each player.\n            external.add(output, position)\n        counts[choice[0]] += 1\n'''
          new = f'''    # Reprice all pending positions before committing one.  A shallow two-ply\n    # lookahead avoids giving the nearest tile irreversible first claim on\n    # shared cash, labor and market depth.  Producer selection itself remains\n    # delegated to the existing selector, so affordability and planner-version\n    # behavior stay unchanged.\n    selector = (\n        _choose_daily_mirrored\n        if planner_version == \"mirror_v2\"\n        else _choose_daily\n    )\n    score_mode = {mode!r}\n    lookahead_width = 4\n\n    def copy_flow(flow):\n        result = Production()\n        result.add(flow)\n        return result\n\n    def branch_feed_cost(input_state, bought_state, units):\n        missing = max(0, units - input_state[\"WHEAT\"])\n        return sum(\n            market_price(\n                \"WHEAT\", wheat_stock - bought_state - i - 1,\n                obs[\"market\"].get(\"params\"),\n            )\n            for i in range(missing)\n        ), missing\n\n    def branch_start_cost(choice, input_state, seed_state, bought_state):\n        name = choice[0]\n        if name in CROPS:\n            return 0 if seed_state[name] > 0 else SEED_COST[name]\n        feed, _ = branch_feed_cost(\n            input_state, bought_state, int(should_feed_animal(name, 0))\n        )\n        return (0 if input_state[name] > 0 else ANIMAL_COST[name]) + feed\n\n    def branch_reserve(choice, cash_state, input_state, seed_state, bought_state):\n        input_state = input_state.copy()\n        seed_state = seed_state.copy()\n        name = choice[0]\n        if name in CROPS:\n            if seed_state[name] > 0:\n                seed_state[name] -= 1\n            else:\n                cash_state -= SEED_COST[name]\n        else:\n            if input_state[name] > 0:\n                input_state[name] -= 1\n            else:\n                cash_state -= ANIMAL_COST[name]\n            units = int(should_feed_animal(name, 0))\n            feed, missing = branch_feed_cost(input_state, bought_state, units)\n            cash_state -= feed\n            bought_state += missing\n            input_state[\"WHEAT\"] = max(0, input_state[\"WHEAT\"] - units)\n        return cash_state, input_state, seed_state, bought_state\n\n    def allowed_at(position, cash_state, input_state, seed_state, bought_state):\n        x, y = position\n        tile = farm[\"tiles\"][y][x]\n        allowed = candidates\n        if isinstance(tile, dict) and tile.get(\"kind\") in (\"COOP\", \"PASTURE\"):\n            allowed = [\n                candidate for candidate in candidates\n                if candidate[0][0] in ANIMALS\n                and official_game.ANIMALS[candidate[0][0]][\"structure\"] == tile[\"kind\"]\n            ]\n        return [\n            candidate for candidate in allowed\n            if branch_start_cost(\n                candidate[0], input_state, seed_state, bought_state\n            ) <= max(0, cash_state)\n        ]\n\n    def proposal_score(market_state, baseline_state, allowed, count_state, position, choice):\n        chosen = [candidate for candidate in allowed if candidate[0] == choice]\n        if not chosen:\n            return None\n        scored = evaluate_daily_targets(\n            market_state, baseline_state, chosen, labor, position,\n            mirror_opponent=planner_version == \"mirror_v2\",\n        )\n        if not scored or scored[0].profit <= 0:\n            return None\n        result = scored[0]\n        if score_mode == \"profit\":\n            return result.profit\n        if planner_version == \"mirror_v2\":\n            return result.profit_per_day\n        return result.profit_per_day / (\n            1.0 + TARGET_CONCENTRATION_PENALTY * count_state[choice[0]]\n        )\n\n    pending = set(replanning)\n    while pending:\n        proposals = []\n        for position in sorted(pending):\n            allowed = allowed_at(position, cash, inputs, seeds, wheat_bought)\n            choice, output = selector(\n                market, baseline, allowed, counts, labor, position\n            )\n            if not choice:\n                continue\n            score = proposal_score(\n                market, baseline, allowed, counts, position, choice\n            )\n            if score is None:\n                continue\n            proposals.append((score, -distance(position), position, choice, output))\n\n        if not proposals:\n            for position in pending:\n                targets[position] = None\n            break\n\n        ranked = sorted(proposals, reverse=True)\n        frontier = ranked[:lookahead_width]\n        branches = []\n        for first_score, first_distance, first_position, first_choice, first_output in frontier:\n            branch_baseline = copy_flow(baseline)\n            branch_baseline.add(first_output, first_position)\n            branch_counts = counts.copy()\n            branch_counts[first_choice[0]] += 1\n            branch_external = copy_flow(external)\n            if planner_version == \"mirror_v2\":\n                branch_external.add(first_output, first_position)\n            branch_market = copy(market)\n            branch_market.external = branch_external\n            branch_cash, branch_inputs, branch_seeds, branch_bought = branch_reserve(\n                first_choice, cash, inputs, seeds, wheat_bought\n            )\n\n            second_best = 0.0\n            for _, _, second_position, _, _ in frontier:\n                if second_position == first_position:\n                    continue\n                allowed = allowed_at(\n                    second_position, branch_cash, branch_inputs, branch_seeds, branch_bought\n                )\n                second_choice, _ = selector(\n                    branch_market, branch_baseline, allowed, branch_counts, labor, second_position\n                )\n                if not second_choice:\n                    continue\n                second_score = proposal_score(\n                    branch_market, branch_baseline, allowed, branch_counts,\n                    second_position, second_choice,\n                )\n                if second_score is not None:\n                    second_best = max(second_best, second_score)\n            branches.append((\n                first_score + second_best, first_score, first_distance,\n                first_position, first_choice, first_output,\n            ))\n\n        _, _, _, position, choice, output = max(branches)\n        targets[position] = choice\n        reserve_start(choice)\n        baseline.add(output, position)\n        if planner_version == \"mirror_v2\":\n            external.add(output, position)\n        counts[choice[0]] += 1\n        pending.remove(position)\n'''
          if old not in text:
              raise SystemExit('allocation loop not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Rate lookahead benchmark
        run: |
          cp /tmp/planner.original.py agents/planner.py
          python /tmp/apply_two_ply.py rate
          PYTHONPATH=. python - <<'PY'
          import json
          from collections import Counter
          from kaggle_environments import make
          from agents.expansion_agent import make_agent
          env = make('kaggriculture', configuration={'seed': 1, 'weedSpawnChance': 0.0, 'episodeSteps': 288}, debug=False)
          agent = make_agent(opening_version='melon_v2')
          env.run([lambda obs: agent(obs), lambda obs: {'farmer': ['PASS'], 'market': []}])
          day_hands = {}
          for frame in env.steps:
              obs = frame[0].observation
              day_hands[obs.day] = max(day_hands.get(obs.day, 0), len(obs.farms[0].hands))
          final = env.steps[-1][0].observation.farms[0]
          kinds = Counter()
          for row in final.tiles:
              for tile in row:
                  if isinstance(tile, dict):
                      name = tile.get('animal') or tile.get('crop')
                      if name: kinds[name] += 1
          result = {'money': final.money, 'hand_days': sum(day_hands.get(d, 0) for d in range(6, max(day_hands)+1)), 'kinds': dict(kinds)}
          print('RATE', result)
          with open('/tmp/rate.json', 'w') as f: json.dump(result, f)
          PY
      - name: Profit lookahead benchmark
        run: |
          cp /tmp/planner.original.py agents/planner.py
          python /tmp/apply_two_ply.py profit
          PYTHONPATH=. python - <<'PY'
          import json
          from collections import Counter
          from kaggle_environments import make
          from agents.expansion_agent import make_agent
          env = make('kaggriculture', configuration={'seed': 1, 'weedSpawnChance': 0.0, 'episodeSteps': 288}, debug=False)
          agent = make_agent(opening_version='melon_v2')
          env.run([lambda obs: agent(obs), lambda obs: {'farmer': ['PASS'], 'market': []}])
          day_hands = {}
          for frame in env.steps:
              obs = frame[0].observation
              day_hands[obs.day] = max(day_hands.get(obs.day, 0), len(obs.farms[0].hands))
          final = env.steps[-1][0].observation.farms[0]
          kinds = Counter()
          for row in final.tiles:
              for tile in row:
                  if isinstance(tile, dict):
                      name = tile.get('animal') or tile.get('crop')
                      if name: kinds[name] += 1
          result = {'money': final.money, 'hand_days': sum(day_hands.get(d, 0) for d in range(6, max(day_hands)+1)), 'kinds': dict(kinds)}
          print('PROFIT', result)
          with open('/tmp/profit.json', 'w') as f: json.dump(result, f)
          PY
      - name: Compare candidates
        run: |
          python - <<'PY'
          import json
          base = {'money': 13536.0, 'hand_days': 80}
          rate = json.load(open('/tmp/rate.json'))
          profit = json.load(open('/tmp/profit.json'))
          print('BASELINE', base)
          print('RATE', rate, 'delta', rate['money'] - base['money'], rate['hand_days'] - base['hand_days'])
          print('PROFIT', profit, 'delta', profit['money'] - base['money'], profit['hand_days'] - base['hand_days'])
          winner = max((rate['money'], 'rate'), (profit['money'], 'profit'))
          print('WINNER', winner)
          assert winner[0] > base['money'], (base, rate, profit)
          PY