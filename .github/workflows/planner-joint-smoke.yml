name: Planner value smoke
on:
  push:
    branches: [feat/planner-capacity-v4]
    paths: [.github/workflows/planner-joint-smoke.yml]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install kaggle-environments==1.32.7 pytest
      - name: Baseline melon planner
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from collections import Counter
          from kaggle_environments import make
          from agents.expansion_agent import make_agent

          env = make('kaggriculture', configuration={
              'seed': 1, 'weedSpawnChance': 0.0, 'episodeSteps': 288,
          }, debug=False)
          agent = make_agent(opening_version='melon_v2')
          env.run([lambda obs: agent(obs), lambda obs: {'farmer': ['PASS'], 'market': []}])
          day_hands = {}
          for frame in env.steps:
              obs = frame[0].observation
              day_hands[obs.day] = max(day_hands.get(obs.day, 0), len(obs.farms[0].hands))
          final = env.steps[-1][0].observation.farms[0]
          kinds = Counter()
          for row in final.tiles:
              for tile in row:
                  if isinstance(tile, dict):
                      name = tile.get('animal') or tile.get('crop')
                      if name:
                          kinds[name] += 1
          result = {
              'money': final.money,
              'hand_days': sum(day_hands.get(day, 0) for day in range(6, max(day_hands)+1)),
              'kinds': dict(kinds),
          }
          print('BASELINE', result)
          with open('/tmp/planner_base.json', 'w') as f:
              json.dump(result, f)
          PY
      - name: Apply shared-horizon planner
        run: |
          python - <<'PY'
          from pathlib import Path

          planner = Path('agents/planner.py')
          text = planner.read_text()
          old = '''def _daily_candidates(day, end_day):\n    \"\"\"Fresh targets projected only through their own comparison horizon.\"\"\"\n    for name in sorted((*CROPS, *ANIMALS)):\n        target_end = _planner_cycle_end(name, day, end_day)\n        first = _first_yield_age(name)\n        if day + first > target_end:\n            continue\n        for fertilize in ((False, True) if name in CROPS else (False,)):\n            output, cost = _rotation(name, fertilize, day, target_end)\n            yield (name, fertilize), output, cost\n'''
          new = '''def _daily_candidates(day, end_day):\n    \"\"\"Project every fresh target through one shared rolling horizon.\n\n    Producer-specific first-yield windows made profit/day easy to compare, but\n    they hid repeat harvests and replants from slower/high-value producers. A\n    common horizon makes marginal net value directly comparable while keeping\n    the existing 16-day runtime bound.\n    \"\"\"\n    target_end = _cycle_end(day, end_day)\n    for name in sorted((*CROPS, *ANIMALS)):\n        first = _first_yield_age(name)\n        if day + first > target_end:\n            continue\n        for fertilize in ((False, True) if name in CROPS else (False,)):\n            output, cost = _rotation(name, fertilize, day, target_end)\n            yield (name, fertilize), output, cost\n'''
          if old not in text:
              raise SystemExit('daily candidates block not found')
          text = text.replace(old, new)

          old_eval = '''    \"\"\"Evaluate fresh targets on per-type horizons and normalize by elapsed day.\n\n    Crops are scoped to their max-yield age. Animals use their configured fresh\n    target windows. Near season end the window is truncated to the last playable\n    day, but a target still must reach at least its first yield.\n    \"\"\"'''
          new_eval = '''    \"\"\"Evaluate fresh targets on one shared rolling comparison horizon.\n\n    All producers see the same endpoint, so net profit and profit/day induce\n    the same value ordering before the concentration tie-break. Near season end\n    the window is truncated to the last playable day.\n    \"\"\"'''
          if old_eval not in text:
              raise SystemExit('daily evaluation doc not found')
          text = text.replace(old_eval, new_eval)
          old_end = '''        end = _planner_cycle_end(name, market.day, market.end_day)'''
          new_end = '''        end = _cycle_end(market.day, market.end_day)'''
          if old_end not in text:
              raise SystemExit('per-type evaluation horizon not found')
          text = text.replace(old_end, new_end)

          old_choose = '''    \"\"\"Choose positive marginal profit/day with a light concentration haircut.\n\n    MarketForecast already prices the next unit against projected shared supply.\n    This extra haircut is deliberately small: it only makes a near-tie prefer a\n    less-concentrated producer instead of repeatedly leaning on one forecast.\n    \"\"\"'''
          new_choose = '''    \"\"\"Choose positive marginal net value on the shared planning horizon.\n\n    All candidates now span the same number of days, so profit/day preserves\n    absolute net-value ordering. The light concentration haircut only breaks\n    near-ties after forecast market slippage and labor cost.\n    \"\"\"'''
          if old_choose not in text:
              raise SystemExit('choose doc not found')
          text = text.replace(old_choose, new_choose)
          text = text.replace(
              '''    \"\"\"Choose profit/day assuming the opponent adds the same producer.\"\"\"''',
              '''    \"\"\"Choose shared-horizon net value with mirrored rival production.\"\"\"''',
          )
          text = text.replace(
              '''    Existing crops are forecast from their real age, held yield and watering\n    state, including visible opponent crops. Unsown choices are reconsidered\n    each day. Fresh choices use target-specific horizons and are ranked by\n    marginal net profit/day with a light same-producer concentration haircut;\n    shared baseline saturation and route load are updated after every accepted\n    tile.''',
              '''    Existing crops are forecast from their real age, held yield and watering\n    state, including visible opponent crops. Unsown choices are reconsidered\n    each day. Fresh choices share one rolling horizon and are ranked by marginal\n    net value with a light same-producer concentration haircut; shared baseline\n    saturation and route load are updated after every accepted tile.''',
          )
          planner.write_text(text)

          tests = Path('tests/test_agents_planner.py')
          t = tests.read_text()
          t += '''\n\ndef test_fresh_targets_share_one_comparison_horizon(monkeypatch):\n    from agents import planner\n    from agents.forecast import Production\n\n    seen = []\n\n    def rotation(name, fertilize, day, end_day, tile=None):\n        seen.append((name, end_day))\n        return Production(), 1\n\n    monkeypatch.setattr(planner, \"_rotation\", rotation)\n    list(planner._daily_candidates(7, 29))\n    assert seen\n    assert {end for _name, end in seen} == {23}\n'''
          tests.write_text(t)
          PY
      - name: Planner regressions
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_agents_planner.py \
            tests/test_agents_affordable_production.py \
            tests/test_agents_labor.py \
            tests/test_agents_forecast.py \
            tests/test_agents_capacity_guard.py \
            tests/test_agents_intraday.py \
            tests/test_agents_melon_opening.py \
            tests/test_survival_debt_regression.py
      - name: Candidate melon planner
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from collections import Counter
          from kaggle_environments import make
          from agents.expansion_agent import make_agent

          with open('/tmp/planner_base.json') as f:
              base = json.load(f)
          env = make('kaggriculture', configuration={
              'seed': 1, 'weedSpawnChance': 0.0, 'episodeSteps': 288,
          }, debug=False)
          agent = make_agent(opening_version='melon_v2')
          env.run([lambda obs: agent(obs), lambda obs: {'farmer': ['PASS'], 'market': []}])
          day_hands = {}
          for frame in env.steps:
              obs = frame[0].observation
              day_hands[obs.day] = max(day_hands.get(obs.day, 0), len(obs.farms[0].hands))
          final = env.steps[-1][0].observation.farms[0]
          kinds = Counter()
          for row in final.tiles:
              for tile in row:
                  if isinstance(tile, dict):
                      name = tile.get('animal') or tile.get('crop')
                      if name:
                          kinds[name] += 1
          cand = {
              'money': final.money,
              'hand_days': sum(day_hands.get(day, 0) for day in range(6, max(day_hands)+1)),
              'kinds': dict(kinds),
          }
          print('BASELINE', base)
          print('CANDIDATE', cand)
          print('money_delta=', cand['money'] - base['money'], 'hand_day_delta=', cand['hand_days'] - base['hand_days'])
          assert cand['money'] > base['money'], (base, cand)
          PY
      - name: Commit planner value optimization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agents/planner.py tests/test_agents_planner.py
          git commit -m 'optimize: compare planner targets on shared horizon'
          git push
