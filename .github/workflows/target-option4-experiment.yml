name: Target option 4 experiment

on:
  push:
    branches: [agent-v3]
    paths:
      - '.github/workflows/target-option4-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle-environments pytest numpy matplotlib
      - name: Compare target options 1 and 4
        run: |
          mkdir -p ci-target4
          python - <<'PY'
          import json
          from pathlib import Path
          from experiments.play_match import run

          rows = []
          for seed in (1, 2):
              for option in (1, 4):
                  result = run(
                      opponent='public/A.ipynb',
                      seed=seed,
                      output_dir=Path('ci-target4'),
                      target_option=option,
                  )
                  rows.append({
                      'seed': seed,
                      'option': option,
                      'cash': result['current_cash'],
                      'opponent_cash': result['opponent_cash'],
                      'margin': result['margin'],
                      'statuses': result['statuses'],
                  })
          summary = {'runs': rows}
          for seed in (1, 2):
              by = {r['option']: r for r in rows if r['seed'] == seed}
              summary[f'seed{seed}_delta_o4_minus_o1'] = by[4]['cash'] - by[1]['cash']
          summary['average_delta_o4_minus_o1'] = sum(
              summary[f'seed{seed}_delta_o4_minus_o1'] for seed in (1, 2)
          ) / 2
          Path('ci-target4/summary.json').write_text(json.dumps(summary, indent=2))
          print('TARGET4_SUMMARY=' + json.dumps(summary, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-option4-experiment
          path: ci-target4
          retention-days: 7
