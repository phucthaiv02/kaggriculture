name: Trace delayed turnover task rebuild

on:
  push:
    branches: [agent-v3-timeout-fix-v2]
    paths:
      - .github/workflows/apply-timeout-fix-v2.yml

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Trace build_tasks for delayed successor
        run: |
          python -m pip install -q 'kaggle-environments==1.32.7'
          git fetch origin agent-v3
          git checkout --detach origin/agent-v3
          python - <<'PY'
          import agents.expansion_agent as ea
          from kaggle_environments import make
          from experiments.crop_schedules import pass_agent
          from experiments.play_match import configuration

          trace=[]
          original = ea.build_tasks
          def traced(obs, targets, *args, **kwargs):
              tasks = original(obs, targets, *args, **kwargs)
              if obs['day'] == 26:
                  pos=(5,0)
                  tile=obs['farms'][obs['player']]['tiles'][0][5]
                  matches=[t for t in tasks if t.position==pos]
                  trace.append({
                      'hour':int(obs['hour']),
                      'seed':obs['private']['seeds'].get('CARROT'),
                      'target':repr(targets.get(pos)),
                      'pending':pos in obs.get('_pending_targets',()),
                      'tile':repr(tile),
                      'tasks':repr([(t.actions,dict(t.needs),t.mandatory,t.ends_cycle) for t in matches]),
                  })
              return tasks
          ea.build_tasks = traced
          agent=ea.make_agent(29, seed=1)
          env=make('kaggriculture', configuration=configuration(1), debug=False)
          env.run([agent, pass_agent])
          print('STATUS', [s.status for s in env.state])
          for row in trace:
              print('TRACE',row)
          PY
