name: Freeze daily targets across intraday reroutes

on:
  push:
    branches: [agent-v3-timeout-fix-v2]
    paths:
      - .github/workflows/apply-timeout-fix-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch, validate, replay, and push
        run: |
          python -m pip install -q 'kaggle-environments==1.32.7' pytest
          cp .ci/apply_frozen_daily_plan.py /tmp/apply_frozen_daily_plan.py
          cp .ci/validate_frozen_daily_plan.py /tmp/validate_frozen_daily_plan.py
          git fetch origin agent-v3
          EXPECTED=$(git rev-parse origin/agent-v3)
          git checkout -B frozen-daily-plan origin/agent-v3
          python /tmp/apply_frozen_daily_plan.py
          python -m py_compile agents/expansion_agent.py
          git diff --check
          PYTHONPATH=. python /tmp/validate_frozen_daily_plan.py
          python -m pytest -q tests/test_agents_farm_tasks.py tests/test_agents_planner.py
          python - <<'PY'
          from kaggle_environments import make
          from agents.expansion_agent import make_agent
          from experiments.crop_schedules import pass_agent
          from experiments.play_match import configuration
          env = make('kaggriculture', configuration=configuration(1), debug=False)
          env.run([make_agent(29, seed=1), pass_agent])
          print('STATUS', [state.status for state in env.state])
          assert all(state.status == 'DONE' for state in env.state)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+phucthaiv02@users.noreply.github.com'
          git add agents/expansion_agent.py
          git commit -m 'fix: keep daily successor targets frozen during reroute'
          git push --force-with-lease=agent-v3:${EXPECTED} origin HEAD:agent-v3
