name: Apply cached market timeout fix

on:
  push:
    branches: [agent-v3-timeout-fix-v2]
    paths:
      - .github/workflows/apply-timeout-fix-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply, verify exactness, benchmark planner, and push
        run: |
          python -m pip install -q 'kaggle-environments==1.32.7' pytest
          cp .ci/apply_batch_forecast_patch.py /tmp/apply_batch_forecast_patch.py
          git fetch origin agent-v3
          EXPECTED=$(git rev-parse origin/agent-v3)
          git checkout -B timeout-v2 origin/agent-v3
          python /tmp/apply_batch_forecast_patch.py
          python -m py_compile agents/forecast.py
          git diff --check
          python - <<'PY'
          import random, time
          from agents.forecast import MarketForecast, Production
          from agents.planner import _candidates, evaluate_targets
          from kaggle_environments.envs.kaggriculture import kaggriculture as game

          rng = random.Random(20260923)
          market = MarketForecast({p: 10000 for p in game.PRODUCTS}, [], 0, 16)

          def reference(product, stock, own_amount, rival_amount):
              cash = 0
              for unit in range(max(abs(own_amount), abs(rival_amount))):
                  quoted = []
                  if unit < abs(own_amount):
                      price = market.price(product, stock if own_amount > 0 else stock - 1)
                      quoted.append((0, own_amount, price))
                  if unit < abs(rival_amount):
                      price = market.price(product, stock if rival_amount > 0 else stock - 1)
                      quoted.append((1, rival_amount, price))
                  for player, amount, price in quoted:
                      stock += int(price > 1) if amount > 0 else -1
                      if player == 0:
                          cash += price if amount > 0 else -price
              return cash, stock

          cases = [(
              rng.choice(list(game.PRODUCTS)), rng.randrange(8500, 11500),
              rng.randrange(-20, 45), rng.randrange(-15, 35),
          ) for _ in range(5000)]
          for case in cases:
              assert market.settle_product(*case) == reference(*case), case

          repeated = cases[:300] * 80
          t0 = time.perf_counter()
          for case in repeated:
              reference(*case)
          reference_time = time.perf_counter() - t0
          for case in repeated[:300]:
              market.settle_product(*case)
          t0 = time.perf_counter()
          for case in repeated:
              market.settle_product(*case)
          cached_time = time.perf_counter() - t0
          print(f'transition reference={reference_time:.4f}s cached={cached_time:.4f}s speedup={reference_time/max(cached_time,1e-9):.1f}x')

          day, end = 18, 29
          candidates = list(_candidates(day, end))
          inventory = {p: 10000 for p in game.PRODUCTS}
          def run(clear_between):
              mf = MarketForecast(inventory, [], day, end)
              baseline = Production()
              for when in range(day, end + 1):
                  baseline.sales[when]['WHEAT'] += 8 + (when % 3)
                  baseline.sales[when]['MELON'] += 4 + (when % 2)
              started = time.perf_counter()
              for _ in range(10):
                  if clear_between:
                      mf.settle_product.cache_clear()
                  rows = evaluate_targets(mf, baseline, candidates, flows_scoped=True)
                  best = max(rows, key=lambda row: row.profit)
                  baseline.add(best.output, include_visits=False)
              return time.perf_counter() - started, mf.settle_product.cache_info()
          uncached, _ = run(True)
          cached, info = run(False)
          print(f'planner10 uncached={uncached:.4f}s cached={cached:.4f}s speedup={uncached/max(cached,1e-9):.2f}x cache={info}')
          PY
          python -m pytest -q tests/test_agents_planner.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agents/forecast.py
          git commit -m 'perf: cache exact market settlement transitions'
          git push --force-with-lease=agent-v3:${EXPECTED} origin HEAD:agent-v3
