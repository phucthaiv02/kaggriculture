name: Debug production forecast cache

on:
  push:
    branches: [agent-v3-timeout-fix-v2]
    paths:
      - .github/workflows/apply-timeout-fix-v2.yml

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Print mismatch
        run: |
          python -m pip install -q 'kaggle-environments==1.32.7'
          cp .ci/apply_production_forecast_cache.py /tmp/apply.py
          git fetch origin agent-v3
          git checkout -B debug origin/agent-v3
          python /tmp/apply.py
          python - <<'PY'
          from agents.forecast import production, _simulate_production, _cached_production_snapshot

          def signature(flow):
              return (
                  tuple((d, tuple(sorted(v.items()))) for d, v in sorted(flow.sales.items())),
                  tuple((d, tuple(sorted(v.items()))) for d, v in sorted(flow.inputs.items())),
                  tuple((d, tuple(v)) for d, v in sorted(flow.visits.items())),
              )

          case = ('WHEAT', False, 0, 29, None)
          _cached_production_snapshot.cache_clear()
          expected = _simulate_production(*case)
          actual = production(*case)
          es, ac = signature(expected), signature(actual)
          print('EXPECTED=', repr(es))
          print('ACTUAL=', repr(ac))
          print('EQUAL=', es == ac)
          print('CACHE=', _cached_production_snapshot.cache_info())
          PY
