name: Apply queued seed purchases for turnover

on:
  push:
    branches: [agent-v3-timeout-fix-v2]
    paths:
      - .github/workflows/apply-timeout-fix-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch, validate, and push
        run: |
          python -m pip install -q 'kaggle-environments==1.32.7' pytest
          git fetch origin agent-v3
          EXPECTED=$(git rev-parse origin/agent-v3)
          git checkout -B seed-queue-fix origin/agent-v3
          python - <<'PY'
          from pathlib import Path
          path = Path('agents/expansion_agent.py')
          text = path.read_text()
          old = 'if order[0] in ("BUY_ANIMAL", "BUY_PRODUCT")'
          new = 'if order[0] in ("BUY_ANIMAL", "BUY_PRODUCT", "BUY_SEED")'
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new))
          PY
          python -m py_compile agents/expansion_agent.py
          git diff --check

          # Regression: a required seed order past the ten-order market cap
          # must remain queued rather than disappear before final task build.
          python - <<'PY'
          from pathlib import Path
          text = Path('agents/expansion_agent.py').read_text()
          marker = 'full_market[MARKET_ORDER_CAP:]'
          start = text.index(marker)
          window = text[start:start+300]
          assert 'BUY_SEED' in window, window
          assert 'morning_market_queue' in text
          print('seed purchases are preserved in the morning market overflow queue')
          PY

          python -m pytest -q tests/test_agents_farm_tasks.py tests/test_agents_planting_deadline.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+phucthaiv02@users.noreply.github.com'
          git add agents/expansion_agent.py
          git commit -m 'fix: preserve replacement seed orders across market cap'
          git push --force-with-lease=agent-v3:${EXPECTED} origin HEAD:agent-v3
