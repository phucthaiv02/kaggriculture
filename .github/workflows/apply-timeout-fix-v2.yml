name: Reproduce day26 turnover task

on:
  push:
    branches: [agent-v3-timeout-fix-v2]
    paths:
      - .github/workflows/apply-timeout-fix-v2.yml

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproduce pure task build
        run: |
          python -m pip install -q 'kaggle-environments==1.32.7'
          git fetch origin agent-v3
          git checkout --detach origin/agent-v3
          python - <<'PY'
          import base64,gzip,json
          from agents.farm_tasks import build_tasks
          from agents.fertilizer import FertilizerPlan
          PAYLOAD=''
          obs=json.loads(gzip.decompress(base64.b64decode(PAYLOAD)))
          obs['_planning_end_day']=29
          obs['_pending_targets']=set()
          target=('CARROT',FertilizerPlan(((2,),)))
          tasks=build_tasks(obs,{(5,0):target},include_physical=True)
          for t in tasks:
              if t.position==(5,0):
                  print('TASK',t.actions,dict(t.needs),t.mandatory,t.ends_cycle)
          PY
