name: Benchmark paid-hand planner liquidity
on:
  push:
    branches: [feat/planner-capacity-v4]
    paths: [.github/workflows/planner-paid-hands-candidate.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q kaggle-environments==1.32.7 pytest
      - name: Apply paid-hand liquidity candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          labor_path = Path('agents/labor.py')
          text = labor_path.read_text()
          old = '''    def __init__(self, shed_access=((4, 4), (5, 4), (4, 5), (5, 5))):\n        self.shed_access = shed_access\n        self.daily_cost = lru_cache(maxsize=4096)(self._daily_cost)\n\n    def _daily_cost(self, tasks):\n        remaining = list(tasks)\n        workers = 0\n        while remaining:\n            if workers > MAX_HANDS:\n                return float('inf')\n            # Start at the shed access nearest the next service cluster.\n            first = min(remaining, key=lambda t: min(abs(t[0]-s[0])+abs(t[1]-s[1]) for s in self.shed_access))\n            start = min(self.shed_access, key=lambda s: abs(first[0]-s[0])+abs(first[1]-s[1]))\n            current, used, supplies, goods = start, 0, set(), False\n            assigned = 0\n            while remaining:\n                possible = []\n                for index, (x, y, count, inputs, output) in enumerate(remaining):\n                    travel = abs(current[0]-x) + abs(current[1]-y)\n                    pickups = len(set(inputs) - supplies)\n                    # Pickups are batched at the route's initial shed visit.\n                    back = min(abs(x-s[0])+abs(y-s[1]) for s in self.shed_access) if goods or output else 0\n                    projected = used + travel + count + pickups\n                    if projected + back + int(goods or output) <= HAND_BUDGET:\n                        possible.append((travel, projected, index))\n                if not possible:\n                    break\n                _, used, index = min(possible)\n                x, y, _, inputs, output = remaining.pop(index)\n                supplies.update(inputs)\n                goods = goods or output\n                current = (x, y)\n                assigned += 1\n            if not assigned:\n                return float('inf')\n            workers += 1\n        return sum(game._hire_cost(n) for n in range(max(0, workers - 1)))\n\n    def cost(self, visits):\n        total = 0\n        for entries in visits.values():\n            merged = {}\n            for position, count, inputs, goods in entries:\n                if position is None:\n                    position = self.shed_access[0]\n                row = merged.setdefault(position, [0, set(), False])\n                row[0] += count\n                row[1].update(inputs)\n                row[2] |= goods\n            tasks = tuple(sorted((x, y, n, tuple(sorted(inputs)), goods)\n                                 for (x, y), (n, inputs, goods) in merged.items()))\n            total += self.daily_cost(tasks)\n        return total\n'''
          new = '''    def __init__(self, shed_access=((4, 4), (5, 4), (4, 5), (5, 5))):\n        self.shed_access = shed_access\n        self.daily_workers = lru_cache(maxsize=4096)(self._daily_workers)\n        self.daily_cost = lru_cache(maxsize=4096)(self._daily_cost)\n\n    def _daily_workers(self, tasks):\n        remaining = list(tasks)\n        workers = 0\n        while remaining:\n            if workers > MAX_HANDS:\n                return float('inf')\n            # Start at the shed access nearest the next service cluster.\n            first = min(remaining, key=lambda t: min(abs(t[0]-s[0])+abs(t[1]-s[1]) for s in self.shed_access))\n            start = min(self.shed_access, key=lambda s: abs(first[0]-s[0])+abs(first[1]-s[1]))\n            current, used, supplies, goods = start, 0, set(), False\n            assigned = 0\n            while remaining:\n                possible = []\n                for index, (x, y, count, inputs, output) in enumerate(remaining):\n                    travel = abs(current[0]-x) + abs(current[1]-y)\n                    pickups = len(set(inputs) - supplies)\n                    # Pickups are batched at the route's initial shed visit.\n                    back = min(abs(x-s[0])+abs(y-s[1]) for s in self.shed_access) if goods or output else 0\n                    projected = used + travel + count + pickups\n                    if projected + back + int(goods or output) <= HAND_BUDGET:\n                        possible.append((travel, projected, index))\n                if not possible:\n                    break\n                _, used, index = min(possible)\n                x, y, _, inputs, output = remaining.pop(index)\n                supplies.update(inputs)\n                goods = goods or output\n                current = (x, y)\n                assigned += 1\n            if not assigned:\n                return float('inf')\n            workers += 1\n        return workers\n\n    def _daily_cost(self, tasks):\n        workers = self.daily_workers(tasks)\n        if workers == float('inf'):\n            return float('inf')\n        return sum(game._hire_cost(n) for n in range(max(0, workers - 1)))\n\n    def _tasks(self, entries):\n        merged = {}\n        for position, count, inputs, goods in entries:\n            if position is None:\n                position = self.shed_access[0]\n            row = merged.setdefault(position, [0, set(), False])\n            row[0] += count\n            row[1].update(inputs)\n            row[2] |= goods\n        return tuple(sorted((x, y, n, tuple(sorted(inputs)), goods)\n                            for (x, y), (n, inputs, goods) in merged.items()))\n\n    def workers_for_day(self, entries):\n        return self.daily_workers(self._tasks(entries))\n\n    def cost(self, visits):\n        total = 0\n        for entries in visits.values():\n            total += self.daily_cost(self._tasks(entries))\n        return total\n'''
          if old not in text:
              raise SystemExit('labor block not found')
          labor_path.write_text(text.replace(old, new))

          planner_path = Path('agents/planner.py')
          text = planner_path.read_text()
          old = '''    def day_labor_cost(flow, position=None):\n        entries = list(baseline.visits.get(day, ()))\n        if flow is not None:\n            entries.extend(\n                (position if p is None else p, count, needs, goods)\n                for p, count, needs, goods in flow.visits.get(day, ())\n            )\n        return labor.cost({day: entries})\n\n    # Fresh production must leave enough real cash for the workers needed\n    # to execute today's standing workload. Future labor stays in the ROI\n    # calculation; it is not charged against today's liquidity.\n    standing_labor_cost = day_labor_cost(None)\n    if standing_labor_cost != float("inf"):\n        cash -= standing_labor_cost\n    else:\n        cash = -1\n'''
          new = '''    paid_hires = int(farm.get("hires_today", len(farm.get("hands", ()))))\n    installed_workers = 1 + len(farm.get("hands", ()))\n\n    def day_labor_cash(flow, position=None):\n        entries = list(baseline.visits.get(day, ()))\n        if flow is not None:\n            entries.extend(\n                (position if p is None else p, count, needs, goods)\n                for p, count, needs, goods in flow.visits.get(day, ())\n            )\n        required_workers = labor.workers_for_day(entries)\n        if required_workers == float("inf"):\n            return float("inf")\n        extra_hands = max(0, required_workers - installed_workers)\n        return sum(\n            official_game._hire_cost(paid_hires + offset)\n            for offset in range(extra_hands)\n        )\n\n    # Hands already present on an intraday replan were paid for earlier today.\n    # Liquidity therefore reserves only *additional* hires; economic ROI still\n    # uses LaborForecast's full labor cost in evaluate_daily_targets.\n    standing_labor_cost = day_labor_cash(None)\n    if standing_labor_cost != float("inf"):\n        cash -= standing_labor_cost\n    else:\n        cash = -1\n'''
          if old not in text:
              raise SystemExit('planner labor helper not found')
          text = text.replace(old, new)
          text = text.replace('baseline_day_cost = day_labor_cost(None)', 'baseline_day_cost = day_labor_cash(None)')
          text = text.replace('labor_with_candidate = day_labor_cost(candidate[1], position)', 'labor_with_candidate = day_labor_cash(candidate[1], position)')
          text = text.replace('before_labor = day_labor_cost(None)', 'before_labor = day_labor_cash(None)')
          text = text.replace('after_labor = day_labor_cost(output, position)', 'after_labor = day_labor_cash(output, position)')
          if 'day_labor_cost(' in text:
              raise SystemExit('stale day_labor_cost reference')
          planner_path.write_text(text)
          PY
      - name: Add intraday paid-hand regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_planner_liquidity.py')
          text = path.read_text()
          text = text.replace(
              '''    def marginal_cost(self, *_args, **_kwargs):\n        return 3\n''',
              '''    def marginal_cost(self, *_args, **_kwargs):\n        return 3\n\n    def workers_for_day(self, entries):\n        return 2 if list(entries) else 1\n'''
          )
          text += '''\n\ndef test_intraday_existing_hand_is_not_charged_twice(monkeypatch):\n    install_isolated_candidate(monkeypatch)\n    seed = planner.SEED_COST["WHEAT"]\n    obs = make_obs(seed)\n    obs["hour"] = 8\n    obs["farms"][0]["hands"] = [[4, 4]]\n    obs["farms"][0]["hires_today"] = 1\n    targets = {}\n    planner.plan_targets(obs, targets, [(0, 0)], end_day=29)\n    assert targets[(0, 0)] == ("WHEAT", False)\n'''
          path.write_text(text)
          PY
      - name: Benchmark candidate
        run: |
          PYTHONPATH=. python - <<'PY'
          from collections import Counter
          from kaggle_environments import make
          from agents.expansion_agent import make_agent

          env = make('kaggriculture', configuration={'seed': 1, 'weedSpawnChance': 0.0, 'episodeSteps': 288}, debug=False)
          agent = make_agent(opening_version='melon_v2')
          env.run([lambda obs: agent(obs), lambda obs: {'farmer': ['PASS'], 'market': []}])
          day_hands = {}
          for frame in env.steps:
              obs = frame[0].observation
              day_hands[obs.day] = max(day_hands.get(obs.day, 0), len(obs.farms[0].hands))
          final = env.steps[-1][0].observation.farms[0]
          kinds = Counter()
          for row in final.tiles:
              for tile in row:
                  if isinstance(tile, dict):
                      name = tile.get('animal') or tile.get('crop')
                      if name:
                          kinds[name] += 1
          result = {
              'money': final.money,
              'hand_days': sum(day_hands.get(d, 0) for d in range(6, max(day_hands) + 1)),
              'kinds': dict(kinds),
          }
          print('BASELINE', {'money': 15525.0, 'hand_days': 75})
          print('CANDIDATE', result)
          print('DELTA', result['money'] - 15525.0, result['hand_days'] - 75)
          assert result['money'] > 15525.0 or (result['money'] == 15525.0 and result['hand_days'] < 75), result
          PY
      - name: Focused regressions
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_planner_liquidity.py \
            tests/test_agents_planner.py \
            tests/test_agents_labor.py \
            tests/test_agents_affordable_production.py \
            tests/test_agents_capacity_guard.py \
            tests/test_survival_debt_regression.py
