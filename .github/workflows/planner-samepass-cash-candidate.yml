name: Benchmark planner same-pass shed cash
on:
  push:
    branches: [feat/planner-capacity-v4]
    paths: [.github/workflows/planner-samepass-cash-candidate.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install kaggle-environments==1.32.7 pytest
      - name: Apply same-pass shed-cash candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('agents/planner.py')
          text = path.read_text()
          old = '''    cash = farm["money"]\n    wheat_bought = 0\n'''
          new = '''    def same_pass_sale_revenue():\n        # These shed outputs are never planner inputs and the execution agent\n        # sells them before BUY/HIRE orders in the same market pass. Do not\n        # count carried goods, WHEAT feed, or FERTILIZER task inventory.\n        inventory = dict(obs["market"]["inventory"])\n        params = obs["market"].get("params")\n        revenue = 0\n        for item in ("CARROT", "MELON", "TOMATO", "STRAWBERRY", "EGG", "MILK", "WOOL"):\n            for _ in range(int(obs["private"]["shed"].get(item, 0))):\n                stock = inventory.get(item, 0)\n                price = market_price(item, stock, params)\n                revenue += price\n                inventory[item] = stock + int(price > 1)\n        return revenue\n\n    cash = farm["money"] + same_pass_sale_revenue()\n    wheat_bought = 0\n'''
          if old not in text:
              raise SystemExit('cash assignment not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Benchmark candidate
        run: |
          PYTHONPATH=. python - <<'PY'
          from collections import Counter
          from kaggle_environments import make
          from agents.expansion_agent import make_agent

          env = make('kaggriculture', configuration={'seed': 1, 'weedSpawnChance': 0.0, 'episodeSteps': 288}, debug=False)
          agent = make_agent(opening_version='melon_v2')
          env.run([lambda obs: agent(obs), lambda obs: {'farmer': ['PASS'], 'market': []}])
          day_hands = {}
          for frame in env.steps:
              obs = frame[0].observation
              day_hands[obs.day] = max(day_hands.get(obs.day, 0), len(obs.farms[0].hands))
          final = env.steps[-1][0].observation.farms[0]
          kinds = Counter()
          for row in final.tiles:
              for tile in row:
                  if isinstance(tile, dict):
                      name = tile.get('animal') or tile.get('crop')
                      if name:
                          kinds[name] += 1
          result = {
              'money': final.money,
              'hand_days': sum(day_hands.get(d, 0) for d in range(6, max(day_hands) + 1)),
              'kinds': dict(kinds),
          }
          print('BASELINE', {'money': 15525.0, 'hand_days': 75})
          print('CANDIDATE', result)
          print('DELTA', result['money'] - 15525.0, result['hand_days'] - 75)
          assert result['money'] > 15525.0, result
          PY
      - name: Focused regressions
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_planner_liquidity.py \
            tests/test_agents_planner.py \
            tests/test_agents_affordable_production.py \
            tests/test_agents_labor.py \
            tests/test_agents_capacity_guard.py \
            tests/test_survival_debt_regression.py
