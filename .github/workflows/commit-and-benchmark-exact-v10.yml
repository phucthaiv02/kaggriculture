name: Commit Lifecycle Scheduler and Benchmark Exact Opponent
on:
  push:
    branches: [feat/planner-capacity-v4]
    paths: [.github/workflows/commit-and-benchmark-exact-v10.yml]
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/planner-capacity-v4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply lifecycle scheduler
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('agents/farm_tasks.py')
          s=p.read_text()
          old='''            early_exit = (\n                crop not in ONGOING_CROPS and name != crop and tile.get("yield_units", 0) > 0\n            )\n'''
          new='''            # Target changes wait until the current one-time crop reaches\n            # its verified max-yield age. Early harvest sacrifices yield; a\n            # late harvest enters decay.\n            early_exit = False\n'''
          assert old in s
          p.write_text(s.replace(old,new,1))

          p=Path('agents/scheduler.py')
          s=p.read_text()
          old='''    ordered = sorted(\n        tasks,\n        key=lambda task: (\n            not task.urgent,\n            not (task.urgent and any(action and action[0] == "WATER" for action in _mandatory_actions(task))),\n            not task.animal_harvest,\n'''
          new='''    def hard_crop_harvest(task):\n        return (\n            task.ends_cycle\n            and any(action and action[0] == "HARVEST" for action in _mandatory_actions(task))\n        )\n\n    ordered = sorted(\n        tasks,\n        key=lambda task: (\n            not hard_crop_harvest(task),\n            not task.urgent,\n            not (task.urgent and any(action and action[0] == "WATER" for action in _mandatory_actions(task))),\n            not task.animal_harvest,\n'''
          assert old in s
          s=s.replace(old,new,1)
          old2='''                priority = lambda queued: (\n                    not queued.urgent,\n                    not (queued.urgent and any(action and action[0] == "WATER" for action in _mandatory_actions(queued))),\n                    not queued.animal_harvest,\n'''
          new2='''                priority = lambda queued: (\n                    not hard_crop_harvest(queued),\n                    not queued.urgent,\n                    not (queued.urgent and any(action and action[0] == "WATER" for action in _mandatory_actions(queued))),\n                    not queued.animal_harvest,\n'''
          assert old2 in s
          p.write_text(s.replace(old2,new2,1))

          p=Path('agents/expansion_agent.py')
          s=p.read_text()
          marker='''    def _schedule_late_placements(obs, farm, day, hour):\n'''
          insert='''    def _replan_all_from_actual(obs, farm, day, hour):\n        """Rebuild every unfinished route from live worker positions at hour 2."""\n        if hour != 2:\n            return\n        tasks = build_tasks(\n            obs, targets, prioritize_fertilizer_drop=state["opening_active"]\n        )\n        state["deferred_expansion_positions"] = {\n            position for position in state["deferred_expansion_positions"]\n            if not isinstance(farm["tiles"][position[1]][position[0]], dict)\n        }\n        tasks = [\n            task for task in tasks\n            if task.position not in state["deferred_expansion_positions"]\n        ]\n        actual_hands = tuple(map(tuple, farm["hands"]))\n        remaining = 24 - hour\n        plans, admitted, unassigned, protective_debt = _capacity_safe_queues(\n            tasks, tuple(farm["farmer"]), len(actual_hands), actual_hands,\n            _open_shed_access(farm), pending_hand_budget=remaining,\n            existing_hand_budget=remaining,\n        )\n        state["plans"] = plans\n        state["reserved"] = reserved_items(admitted)\n        state["protective_debt_positions"] = {task.position for task in protective_debt}\n        state["scheduled_placements"] = {\n            task.position for task in admitted\n            if any(action[0] in ("PLANT", "PLACE") for action in task.actions)\n        }\n        state["unverified_hand_indices"] = set()\n\n'''
          assert marker in s
          s=s.replace(marker,insert+marker,1)
          call='''        if state["unverified_hand_indices"]:\n            _validate_predicted_hands(farm, hour)\n'''
          repl='''        if state["unverified_hand_indices"]:\n            _validate_predicted_hands(farm, hour)\n        _replan_all_from_actual(obs, farm, day, hour)\n'''
          assert call in s
          p.write_text(s.replace(call,repl,1))

          p=Path('tests/test_agents_farm_tasks.py')
          s=p.read_text()
          old='''def test_wheat_conversion_builds_pasture_immediately_after_harvest_without_inputs():\n    obs = make_obs(\n        day=1,\n        tiles={(0, 0): plant("WHEAT", planted_day=0, day=1, yield_units=1)},\n        shed={},\n    )\n    task = one_task(build_tasks(obs, {(0, 0): ("COW", False)}))\n    assert task.actions == [["WATER"], ["HARVEST"], ["BUILD_PASTURE"]]\n    assert task.ends_cycle\n    assert not task.needs\n\n\ndef test_wheat_conversion_does_not_feed_cow_on_placement_day():\n    obs = make_obs(\n        day=2,\n        tiles={(0, 0): plant("WHEAT", planted_day=0, day=2, yield_units=1)},\n        shed={"COW": 1},\n    )\n    task = one_task(build_tasks(obs, {(0, 0): ("COW", False)}))\n    assert task.actions == [\n        ["WATER"], ["HARVEST"], ["BUILD_PASTURE"], ["PLACE", "COW"]\n    ]\n    assert task.needs == {"COW": 1}\n    assert task.sells == {}\n'''
          new='''def test_wheat_conversion_waits_for_exact_max_yield_day():\n    obs = make_obs(\n        day=1,\n        tiles={(0, 0): plant("WHEAT", planted_day=0, day=1, yield_units=1)},\n        shed={},\n    )\n    assert build_tasks(obs, {(0, 0): ("COW", False)}) == []\n\n\ndef test_wheat_conversion_keeps_maintenance_before_max_yield():\n    obs = make_obs(\n        day=2,\n        tiles={(0, 0): plant("WHEAT", planted_day=0, day=2, yield_units=1)},\n        shed={"COW": 1},\n    )\n    task = one_task(build_tasks(obs, {(0, 0): ("COW", False)}))\n    assert task.actions == [["WATER"]]\n    assert not task.ends_cycle\n    assert not task.needs\n\n\ndef test_wheat_conversion_happens_on_exact_max_yield_day():\n    obs = make_obs(\n        day=4,\n        tiles={(0, 0): plant("WHEAT", planted_day=0, day=4, yield_units=4)},\n        shed={"COW": 1},\n    )\n    task = one_task(build_tasks(obs, {(0, 0): ("COW", False)}))\n    assert task.actions == [\n        ["WATER"], ["HARVEST"], ["BUILD_PASTURE"], ["PLACE", "COW"]\n    ]\n    assert task.ends_cycle\n    assert task.needs == {"COW": 1}\n'''
          assert old in s
          p.write_text(s.replace(old,new,1))

          Path('tests/test_agents_exact_crop_harvest.py').write_text('''from agents.farm_tasks import Task, build_tasks\nfrom agents.scheduler import SHED, build_queues\nfrom tests.test_agents_farm_tasks import make_obs, plant\n\ndef test_target_change_does_not_harvest_early():\n    tile = plant("WHEAT", planted_day=0, day=2, yield_units=2)\n    task = build_tasks(make_obs(day=2, tiles={(0, 0): tile}), {(0, 0): ("CARROT", False)})[0]\n    assert ["HARVEST"] not in task.actions\n\ndef test_exact_max_yield_harvest_exists():\n    tile = plant("WHEAT", planted_day=0, day=4, yield_units=4)\n    task = build_tasks(make_obs(day=4, tiles={(0, 0): tile}), {(0, 0): ("WHEAT", False)})[0]\n    assert ["HARVEST"] in task.actions\n\ndef test_due_harvest_outranks_water_when_only_one_fits():\n    harvest = Task(SHED, [["HARVEST"]], urgent=True, ends_cycle=True, deadline=120)\n    water = Task(SHED, [["WATER"]], urgent=True)\n    plans, unassigned = build_queues([water, harvest], SHED, 0, (), (SHED,), existing_hand_budget=1)\n    assert plans[0].queue == [["HARVEST"]]\n    assert unassigned == [water]\n''')
          PY
      - name: Install engine and tests
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7' pytest
      - name: Focused tests
        run: python -m pytest -q tests/test_agents_exact_crop_harvest.py tests/test_agents_capacity_guard.py tests/test_agents_scheduler.py tests/test_agents_farm_tasks.py tests/test_agents_intraday.py tests/test_agents_harvest_priority.py tests/test_agents_planner_daily.py tests/test_agents_opening_book.py
      - name: Commit lifecycle scheduler
        run: |
          rm .github/workflows/commit-and-benchmark-exact-v10.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agents tests .github/workflows/commit-and-benchmark-exact-v10.yml
          git commit -m 'fix: enforce exact crop lifecycle scheduling'
          git push origin HEAD:feat/planner-capacity-v4
      - name: Restore exact opponent
        run: |
          git fetch origin tmp/benchmark-v5-seeds1-5
          mkdir -p .tmp public
          git show origin/tmp/benchmark-v5-seeds1-5:.tmp/opp.part0 > .tmp/opp.part0
          git show origin/tmp/benchmark-v5-seeds1-5:.tmp/opp.part1 > .tmp/opp.part1
          git show origin/tmp/benchmark-v5-seeds1-5:.tmp/opp.part2 > .tmp/opp.part2
          cat .tmp/opp.part0 .tmp/opp.part1 .tmp/opp.part2 | base64 -d | gzip -d > public/A.py
          sha256sum public/A.py
      - name: Exact opponent 10 seeds
        run: |
          python - <<'PY'
          import importlib.util, json
          from kaggle_environments import make
          from agents.expansion_agent import make_agent
          from experiments.play_match import configuration, END_DAY

          spec=importlib.util.spec_from_file_location('exact_opp','public/A.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          opp = getattr(mod,'agent',None) or getattr(mod,'main',None)
          if opp is None:
              funcs=[v for v in mod.__dict__.values() if callable(v) and getattr(v,'__module__',None)==mod.__name__]
              if not funcs: raise RuntimeError('no callable opponent found')
              opp=funcs[0]
          rows=[]
          for seed in range(1,11):
              env=make('kaggriculture', configuration=configuration(seed), debug=False)
              env.run([make_agent(END_DAY-1, seed=seed), opp])
              ours=float(env.steps[-1][0].reward)
              theirs=float(env.steps[-1][1].reward)
              row={'seed':seed,'ours':ours,'opponent':theirs,'margin':ours-theirs}
              rows.append(row); print('EXACT10 '+json.dumps(row), flush=True)
          mo=sum(r['ours'] for r in rows)/len(rows)
          mt=sum(r['opponent'] for r in rows)/len(rows)
          mm=sum(r['margin'] for r in rows)/len(rows)
          wins=sum(r['margin']>0 for r in rows); ties=sum(r['margin']==0 for r in rows)
          print('EXACT10_SUMMARY '+json.dumps({'ours_mean':mo,'opponent_mean':mt,'margin_mean':mm,'wins':wins,'losses':10-wins-ties,'ties':ties}), flush=True)
          PY