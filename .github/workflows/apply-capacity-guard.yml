name: Apply Protective Capacity Guard

on:
  push:
    branches: [feat/planner-capacity-v4]
    paths: [.github/workflows/apply-capacity-guard.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/planner-capacity-v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply capacity guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('agents/expansion_agent.py')
          text = path.read_text()
          marker = '''def _affordable_hires(farm, desired, money):\n    """How many of `desired` sequential HIRE orders can really execute."""\n    affordable = 0\n    for number in range(1, desired + 1):\n        if _hire_costs(farm, number) > money:\n            break\n        affordable = number\n    return affordable\n\n\n'''
          assert marker in text
          helper = '''def _is_protective_task(task):\n    """Work that must survive capacity cuts before expansion/replacement."""\n    if task.urgent or task.animal_harvest:\n        return True\n    return any(action and action[0] == "HARVEST" for action in task.actions)\n\n\ndef _capacity_safe_queues(\n    tasks, farmer_start, hand_count, existing_hands, shed_access,\n    pending_hand_budget=22, existing_hand_budget=23,\n):\n    """Pack against the workers we can actually afford.\n\n    Try the complete workload first. If any protective work is unassigned,\n    discard expansion/replacement work for this morning and repack only\n    protective work. Only admitted tasks may reserve inventory or suppress\n    intraday rescue.\n    """\n    kwargs = dict(\n        pending_hand_budget=pending_hand_budget,\n        existing_hand_budget=existing_hand_budget,\n    )\n    plans, unassigned = build_queues(\n        tasks, farmer_start, hand_count, existing_hands, shed_access, **kwargs\n    )\n    protective_debt = [task for task in unassigned if _is_protective_task(task)]\n    active_tasks = tasks\n    if protective_debt:\n        active_tasks = [task for task in tasks if _is_protective_task(task)]\n        plans, unassigned = build_queues(\n            active_tasks, farmer_start, hand_count, existing_hands, shed_access, **kwargs\n        )\n        protective_debt = list(unassigned)\n    unassigned_ids = {id(task) for task in unassigned}\n    admitted = [task for task in active_tasks if id(task) not in unassigned_ids]\n    return plans, admitted, unassigned, protective_debt\n\n\n'''
          text = text.replace(marker, marker + helper, 1)

          old = '''        "day": -1, "hand_target": 0, "plans": [], "reserved": {},\n        "opening_active": False, "scheduled_placements": set(),\n        "unverified_hand_indices": set(),\n        "deferred_expansion_positions": set(),\n'''
          new = '''        "day": -1, "hand_target": 0, "plans": [], "reserved": {},\n        "opening_active": False, "scheduled_placements": set(),\n        "unverified_hand_indices": set(),\n        "deferred_expansion_positions": set(),\n        "protective_debt_positions": set(),\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        for position, target in targets.items():\n            if not target:\n                continue\n'''
          new = '''        ordered_positions = sorted(\n            targets,\n            key=lambda position: (\n                position not in state["protective_debt_positions"],\n                position[1], position[0],\n            ),\n        )\n        for position in ordered_positions:\n            target = targets[position]\n            if not target:\n                continue\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            plans, _unassigned = build_queues(\n                tasks,\n                tuple(farm["farmer"]),\n                hand_count,\n                existing_hands,\n                shed_access,\n                pending_hand_budget=22,\n            )\n            state["plans"], state["reserved"] = plans, reserved_items(tasks)\n'''
          new = '''            plans, admitted_tasks, _unassigned, protective_debt = _capacity_safe_queues(\n                tasks,\n                tuple(farm["farmer"]),\n                hand_count,\n                existing_hands,\n                shed_access,\n                pending_hand_budget=22,\n                existing_hand_budget=23,\n            )\n            state["plans"], state["reserved"] = plans, reserved_items(admitted_tasks)\n            state["protective_debt_positions"] = {task.position for task in protective_debt}\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            state["scheduled_placements"] = {\n                task.position\n                for task in tasks\n                if any(action[0] in ("PLANT", "PLACE") for action in task.actions)\n            }\n'''
          new = '''            state["scheduled_placements"] = {\n                task.position\n                for task in admitted_tasks\n                if any(action[0] in ("PLANT", "PLACE") for action in task.actions)\n            }\n'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          Path('tests/test_agents_capacity_guard.py').write_text('''from agents.expansion_agent import _capacity_safe_queues\nfrom agents.farm_tasks import Task\nfrom agents.scheduler import SHED\n\n\ndef test_capacity_guard_drops_expansion_before_protective_debt():\n    water_a = Task(SHED, [["WATER"]], urgent=True)\n    water_b = Task(SHED, [["WATER"]], urgent=True)\n    expansion = Task(SHED, [["PLANT", "WHEAT"], ["WATER"]])\n    plans, admitted, unassigned, debt = _capacity_safe_queues(\n        [expansion, water_a, water_b], SHED, 0, (), (SHED,),\n        pending_hand_budget=1, existing_hand_budget=1,\n    )\n    assert plans[0].queue == [["WATER"]]\n    assert len(admitted) == 1 and admitted[0] in (water_a, water_b)\n    assert len(debt) == 1 and debt[0] in (water_a, water_b)\n    assert expansion not in admitted\n\n\ndef test_capacity_guard_keeps_full_plan_when_only_discretionary_work_drops():\n    water = Task(SHED, [["WATER"]], urgent=True)\n    expansion = Task(SHED, [["PLANT", "WHEAT"], ["WATER"]])\n    plans, admitted, unassigned, debt = _capacity_safe_queues(\n        [expansion, water], SHED, 0, (), (SHED,),\n        pending_hand_budget=1, existing_hand_budget=1,\n    )\n    assert plans[0].queue == [["WATER"]]\n    assert water in admitted\n    assert expansion in unassigned\n    assert debt == []\n''')
          Path('.github/workflows/apply-capacity-guard.yml').unlink()
          PY
      - name: Install engine and tests
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7' pytest
      - name: Focused tests
        run: python -m pytest -q tests/test_agents_capacity_guard.py tests/test_agents_scheduler.py tests/test_agents_farm_tasks.py tests/test_agents_intraday.py tests/test_agents_harvest_priority.py tests/test_agents_planner_daily.py tests/test_agents_opening_book.py
      - name: Five-seed crop health and reward
        run: |
          python - <<'PY'
          import json
          from kaggle_environments import make
          from agents.expansion_agent import make_agent
          from agents.farm_tasks import build_tasks
          from experiments.crop_schedules import pass_agent
          from experiments.play_match import configuration, END_DAY
          weeds_all, pending_all, rewards = [], [], []
          for seed in (1,2,3,4,5):
              agent = make_agent(END_DAY - 1, seed=seed)
              pending = [0]
              def monitored(obs):
                  action = agent(obs)
                  if int(obs.hour) == 23:
                      cells = dict(zip(agent.__code__.co_freevars, agent.__closure__ or ()))
                      targets = cells['targets'].cell_contents
                      tasks = build_tasks(dict(obs, _planning_end_day=END_DAY - 1), targets)
                      pending[0] += sum(any(op and op[0] == 'WATER' for op in t.actions) for t in tasks)
                  return action
              env = make('kaggriculture', configuration=configuration(seed), debug=False)
              env.run([monitored, pass_agent])
              tiles = env.steps[-1][0].observation.farms[0].tiles
              weeds = sum(isinstance(t, dict) and t.get('kind') == 'WEED' for row in tiles for t in row)
              reward = float(env.steps[-1][0].reward)
              weeds_all.append(weeds); pending_all.append(pending[0]); rewards.append(reward)
              print('CAPACITY_HEALTH ' + json.dumps({'seed':seed,'weeds':weeds,'pending_h23':pending[0],'reward':reward}), flush=True)
          mean_weeds = sum(weeds_all)/5
          pending_sum = sum(pending_all)
          mean_reward = sum(rewards)/5
          print('CAPACITY_SUMMARY ' + json.dumps({'weeds':weeds_all,'mean_weeds':mean_weeds,'pending_h23':pending_all,'pending_sum':pending_sum,'rewards':rewards,'mean_reward':mean_reward}), flush=True)
          if mean_weeds > 19.6:
              raise SystemExit(f'weed regression: {mean_weeds}')
          if pending_sum >= 398:
              raise SystemExit(f'pending WATER did not improve: {pending_sum}')
          if mean_reward < 105000:
              raise SystemExit(f'reward regression too large: {mean_reward}')
          PY
      - name: Commit proven capacity guard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agents/expansion_agent.py tests/test_agents_capacity_guard.py .github/workflows/apply-capacity-guard.yml
          git commit -m 'fix: protect mandatory work from labor shortfall'
          git push origin HEAD:feat/planner-capacity-v4
