name: Apply fertilizer runtime integration

on:
  push:
    branches: [agent-v3]
    paths:
      - .github/workflows/apply-fertilizer-production-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runtime fertilizer execution and planner logging
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('agents/farm_tasks.py')
          text = path.read_text()
          old = '''A target is `(name, fertilize) | None`: `name` is a crop or animal, and\n`fertilize` is a commitment made once at planting time (see agents/\nplanner.py) because the correct WATER schedule for an ongoing crop depends\non whether it will be fertilized -- it is not a fertilize/day decision that\ncan be revisited daily (see agents/schedules.py's module docstring).\n'''
          new = '''A target is `(name, fertilizer_plan) | None`: `name` is a crop or animal.\nDynamic planner targets carry the exact fertilizer ages selected for the\ncurrent crop cycle (plus forecast-only later cycles); opening targets retain\nthe historical boolean flag.  agents/schedules.py normalizes both forms.\n'''
          if text.count(old) != 1:
              raise SystemExit(f'doc replacement count={text.count(old)}')
          text = text.replace(old, new)

          old = '''            if fertilizer_left and should_fertilize_today(crop, age, fertilize_commit):\n                fertilizer_left -= 1\n                needs["FERTILIZER"] += 1\n                actions.append(["FERTILIZE"])\n'''
          new = '''            if (should_fertilize_today(crop, age, fertilize_commit)\n                    and tile.get("fertilized_until_day", -1) < day + 2):\n                # A committed fertilizer event is a real scheduled input, not\n                # an opportunistic action conditional on current shed stock.\n                # purchase_orders funds any shortfall before this route runs.\n                if fertilizer_left > 0:\n                    fertilizer_left -= 1\n                needs["FERTILIZER"] += 1\n                actions.append(["FERTILIZE"])\n'''
          if text.count(old) != 1:
              raise SystemExit(f'fertilize task replacement count={text.count(old)}')
          text = text.replace(old, new)

          old = '''    shed = obs["private"]["shed"]\n    wheat_on_hand = (\n        shed.get("WHEAT", 0) if available_wheat is None else available_wheat\n    ) + carried_wheat\n\n    # Feed reserve remains deliberately conservative (it may cover a verified\n'''
          new = '''    shed = obs["private"]["shed"]\n    wheat_on_hand = (\n        shed.get("WHEAT", 0) if available_wheat is None else available_wheat\n    ) + carried_wheat\n\n    # Exact fertilizer demand for committed events that are due today.  This\n    # mirrors build_tasks so the market plan can fund FERTILIZE even when the\n    # shed starts the morning empty.  Opening targets use False and therefore\n    # preserve their sell-fertilizer bootstrap behavior.\n    fertilizer_demand = 0\n    effective_targets = executable_targets(obs, targets)\n    for position in active_positions:\n        target = effective_targets.get(position)\n        if not target or target[0] not in CROPS:\n            continue\n        x, y = position\n        tile = farm["tiles"][y][x]\n        if not (isinstance(tile, dict) and tile.get("kind") == "PLANT"\n                and tile.get("crop") == target[0]):\n            continue\n        age = obs["day"] - tile["planted_day"]\n        if (should_fertilize_today(tile["crop"], age, target[1])\n                and tile.get("fertilized_until_day", -1) < obs["day"] + 2):\n            fertilizer_demand += 1\n    fertilizer_needed = max(0, fertilizer_demand - shed.get("FERTILIZER", 0))\n\n    # Feed reserve remains deliberately conservative (it may cover a verified\n'''
          if text.count(old) != 1:
              raise SystemExit(f'fertilizer demand insertion count={text.count(old)}')
          text = text.replace(old, new)

          old = '''    money = farm["money"] if available_money is None else available_money\n    money -= wheat_cost(wheat_needed_now)\n\n    # Orders are processed strictly in sequence -- one order's quantity is\n'''
          new = '''    money = farm["money"] if available_money is None else available_money\n    money -= wheat_cost(wheat_needed_now)\n\n    fertilizer_inventory = obs["market"]["inventory"].get("FERTILIZER", 0)\n    fertilizer_cost = sum(\n        market_price(\n            "FERTILIZER", fertilizer_inventory - unit - 1,\n            obs["market"].get("params"),\n        )\n        for unit in range(fertilizer_needed)\n    )\n    money -= fertilizer_cost\n\n    # Orders are processed strictly in sequence -- one order's quantity is\n'''
          if text.count(old) != 1:
              raise SystemExit(f'fertilizer cost insertion count={text.count(old)}')
          text = text.replace(old, new)

          old = '''    orders = []\n    if wheat_needed:\n        orders.append(["BUY_PRODUCT", "WHEAT", wheat_needed])\n    orders += animal_orders + seed_orders\n    return orders\n'''
          new = '''    orders = []\n    if wheat_needed:\n        orders.append(["BUY_PRODUCT", "WHEAT", wheat_needed])\n    if fertilizer_needed:\n        orders.append(["BUY_PRODUCT", "FERTILIZER", fertilizer_needed])\n    orders += animal_orders + seed_orders\n    return orders\n'''
          if text.count(old) != 1:
              raise SystemExit(f'fertilizer order insertion count={text.count(old)}')
          text = text.replace(old, new)
          path.write_text(text)

          path = Path('agents/planner.py')
          text = path.read_text()
          old = '''    decision_log.append({\n        "day": day,\n        "position": list(position),\n        "selected": None if selected is None else [selected[0], plan_json(selected[1])],\n        "candidates": [\n            {\n                "target": [row.choice[0], plan_json(row.choice[1])],\n                "market_cash": row.market_cash,\n                "capital_cost": row.capital_cost,\n                "labor_cost": row.labor_cost,\n                "score": row.profit,\n                "profitable": row.profit > 0,\n                "selected": row.choice == selected,\n            }\n            for row in rows\n        ],\n    })\n'''
          new = '''    def logged_target(choice):\n        if choice is None:\n            return None\n        name, plan = choice\n        return [name, bool(plan) if name in CROPS else False]\n\n    decision_log.append({\n        "day": day,\n        "position": list(position),\n        "selected": logged_target(selected),\n        "fertilize_plan": None if selected is None else plan_json(selected[1]),\n        "reason": "no_profitable_candidate" if selected is None else "highest_score",\n        "candidates": [\n            {\n                "target": logged_target(row.choice),\n                "fertilize_plan": plan_json(row.choice[1]),\n                "market_cash": row.market_cash,\n                "capital_cost": row.capital_cost,\n                "labor_cost": row.labor_cost,\n                "score": row.profit,\n                "profitable": row.profit > 0,\n                "selected": row.choice == selected,\n            }\n            for row in rows\n        ],\n    })\n'''
          if text.count(old) != 1:
              raise SystemExit(f'planner log replacement count={text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          python -m py_compile agents/farm_tasks.py agents/planner.py agents/schedules.py agents/fertilizer.py
          git diff --check
          git diff -- agents/farm_tasks.py agents/planner.py
      - name: Commit runtime integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/farm_tasks.py agents/planner.py
          git commit -m "planner: execute and fund fertilizer events"
          git push origin HEAD:agent-v3
