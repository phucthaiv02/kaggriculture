name: Final Economic Diversification Gate
on:
  push:
    branches: [feat/planner-capacity-v4]
    paths: [.github/workflows/test-economic-concentration.yml]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/planner-capacity-v4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7' pytest
      - name: Focused tests
        run: python -m pytest -q tests/test_agents_planner_daily.py tests/test_agents_planner.py tests/test_agents_opening_book.py tests/test_agents_farm_tasks.py
      - name: Restore exact opponent
        run: |
          git fetch origin tmp/benchmark-v5-seeds1-5
          mkdir -p .tmp public
          git show origin/tmp/benchmark-v5-seeds1-5:.tmp/opp.part0 > .tmp/opp.part0
          git show origin/tmp/benchmark-v5-seeds1-5:.tmp/opp.part1 > .tmp/opp.part1
          git show origin/tmp/benchmark-v5-seeds1-5:.tmp/opp.part2 > .tmp/opp.part2
          cat .tmp/opp.part0 .tmp/opp.part1 .tmp/opp.part2 | base64 -d | gzip -d > public/A.py
      - name: Exact opponent 10 seeds
        run: |
          python - <<'PY'
          import importlib.util, json
          from kaggle_environments import make
          from agents.expansion_agent import make_agent
          from experiments.play_match import configuration, END_DAY
          spec=importlib.util.spec_from_file_location('exact_opp','public/A.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          opp=getattr(mod,'agent',None) or getattr(mod,'main',None)
          if opp is None:
              funcs=[v for v in mod.__dict__.values() if callable(v) and getattr(v,'__module__',None)==mod.__name__]
              opp=funcs[0]
          rows=[]
          for seed in range(1,11):
              env=make('kaggriculture', configuration=configuration(seed), debug=False)
              env.run([make_agent(END_DAY-1, seed=seed), opp])
              ours=float(env.steps[-1][0].reward); theirs=float(env.steps[-1][1].reward)
              row={'seed':seed,'ours':ours,'opponent':theirs,'margin':ours-theirs}
              rows.append(row); print('FINAL10 '+json.dumps(row), flush=True)
          summary={
              'ours_mean':sum(r['ours'] for r in rows)/10,
              'opponent_mean':sum(r['opponent'] for r in rows)/10,
              'margin_mean':sum(r['margin'] for r in rows)/10,
              'wins':sum(r['margin']>0 for r in rows)
          }
          print('FINAL10_SUMMARY '+json.dumps(summary), flush=True)
          if summary['ours_mean'] < 65000:
              raise SystemExit('ours_mean regression')
          if summary['margin_mean'] < -40000:
              raise SystemExit('margin regression')
          if summary['wins'] < 1:
              raise SystemExit('win-count regression')
          PY
