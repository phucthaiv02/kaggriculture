name: Finalize validated animal lifecycle fix

on:
  push:
    branches: [agent-v3]
    paths:
      - .github/workflows/finalize-animal-lifecycle.yml

permissions:
  contents: write

concurrency:
  group: finalize-animal-lifecycle
  cancel-in-progress: false

env:
  PATCH_BASE_COMMIT: f3c820e50892b1f0715470b9e5e8bb6c03f74937
  PYTHONUNBUFFERED: "1"

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent-v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild source from clean baseline and validated patch
        run: |
          git show "$PATCH_BASE_COMMIT:agents/expansion_agent.py" > agents/expansion_agent.py
          python experiments/_validate_execution_candidate.py
          python -m py_compile agents/expansion_agent.py
          git diff --check
      - name: Install test runtime
        run: python -m pip install --upgrade kaggle-environments pytest
      - name: Focused regression tests
        run: timeout 180s python -m pytest -q tests/test_agents_execution_pipeline.py tests/test_agents_farm_tasks.py
      - name: Replay gate
        run: |
          mkdir -p validation/final
          timeout 300s python -m experiments.play_match --opponent public/A.ipynb --seed 1 --output-dir validation/final
          python - <<'PY'
          import json
          from pathlib import Path
          run = sorted(Path('validation/final').glob('current_vs_A_seed1_*'))[-1]
          result = json.loads((run / 'result.json').read_text())
          print(json.dumps(result, indent=2))
          if result['statuses'] != ['DONE', 'DONE']:
              raise SystemExit(f"bad statuses: {result['statuses']}")
          if result['current_cash'] < 90065:
              raise SystemExit(f"cash regression: {result['current_cash']} < 90065")
          replay = json.loads((run / 'replay.json').read_text())
          last = replay['steps'][-1][0]['observation']
          farm = last['farms'][0]
          empty = 0
          for row in farm['tiles']:
              for tile in row:
                  if isinstance(tile, dict) and tile.get('kind') in ('PASTURE', 'COOP') and not tile.get('animal'):
                      empty += 1
          print({'empty_animal_structures': empty})
          if empty:
              raise SystemExit(f"empty animal structures remain: {empty}")
          PY
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/expansion_agent.py
          if git diff --cached --quiet; then
            echo "No source change to commit"
          else
            git commit -m "fix: complete admitted animal placements"
            git push origin HEAD:agent-v3
          fi
