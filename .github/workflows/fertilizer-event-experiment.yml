name: Fertilizer event planner

on:
  push:
    branches: [agent-v3]
    paths:
      - agents/fertilizer.py
      - agents/farm_tasks.py
      - agents/forecast.py
      - agents/planner.py
      - agents/schedules.py
      - agents/expansion_agent.py
      - tests/test_agents_fertilizer_plan.py
      - tests/test_fertilizer_event_experiment.py
      - .github/workflows/fertilizer-event-experiment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle-environments==1.32.7 pytest
      - name: Run affected regression suites
        run: |
          python -m pytest -q \
            tests/test_agents_fertilizer_plan.py \
            tests/test_fertilizer_event_experiment.py \
            tests/test_agents_planner.py \
            tests/test_agents_forecast.py \
            tests/test_agents_farm_tasks.py
      - name: Benchmark decision limit
        run: |
          python - <<'PY'
          from experiments.benchmark_agent import benchmark
          timeout = 0.75
          timings = benchmark(seed=1, opponent="self", timeout=timeout)
          worst = max(timings, key=lambda row: row[1])
          over = [row for row in timings if row[1] > timeout]
          print({"actions": len(timings), "max_seconds": worst[1], "max_day": worst[2], "max_hour": worst[3], "over_075_seconds": len(over)})
          if over:
              raise SystemExit(f"{len(over)} decisions exceeded {timeout}s")
          PY
      - name: Show experiment result
        if: always()
        run: |
          if [ -f ci-artifacts/fertilizer-event-experiment.json ]; then
            cat ci-artifacts/fertilizer-event-experiment.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fertilizer-event-planner-${{ github.sha }}
          path: ci-artifacts/fertilizer-event-experiment.json
          if-no-files-found: warn
          retention-days: 7
