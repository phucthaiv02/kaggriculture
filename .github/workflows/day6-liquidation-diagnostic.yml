name: Diagnose day-six liquidation timing
on:
  push:
    branches: [feat/planner-capacity-v4]
    paths: [.github/workflows/day6-liquidation-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install kaggle-environments==1.32.7
      - name: Trace day-six cash and land timing
        run: |
          PYTHONPATH=. python - <<'PY'
          from collections import Counter
          from kaggle_environments import make
          from agents.expansion_agent import make_agent

          env = make('kaggriculture', configuration={
              'seed': 1,
              'weedSpawnChance': 0.0,
              'episodeSteps': 192,
          }, debug=False)
          base = make_agent(opening_version='melon_v2')
          trace = []

          def agent(obs):
              action = base(obs)
              if obs.day == 6:
                  farm = obs.farms[0]
                  shed = dict(obs.private.shed)
                  carried = Counter()
                  for inv in obs.private.inventories:
                      carried.update(inv)
                  worker_ops = [action.get('farmer', ['PASS']), *action.get('hands', [])]
                  drops = [i for i, op in enumerate(worker_ops) if op and op[0] == 'DROP']
                  sales = [o for o in action.get('market', []) if o and o[0] == 'SELL']
                  land = [o for o in action.get('market', []) if o and o[0] == 'BUY_LAND']
                  trace.append({
                      'hour': obs.hour,
                      'money': farm.money,
                      'hands': len(farm.hands),
                      'shed_cash': {k: shed.get(k, 0) for k in ('FERTILIZER','CARROT','MELON','TOMATO','STRAWBERRY','EGG','MILK','WOOL') if shed.get(k, 0)},
                      'carried_cash': {k: carried.get(k, 0) for k in ('FERTILIZER','CARROT','MELON','TOMATO','STRAWBERRY','EGG','MILK','WOOL') if carried.get(k, 0)},
                      'drops': drops,
                      'sales': sales,
                      'land': land,
                      'market': action.get('market', []),
                  })
              return action

          env.run([agent, lambda obs: {'farmer': ['PASS'], 'market': []}])
          for row in trace:
              print('D6', row)

          final = env.steps[-1][0].observation.farms[0]
          active = []
          for y, line in enumerate(final.tiles):
              for x, tile in enumerate(line):
                  if isinstance(tile, dict) and (tile.get('crop') or tile.get('animal')):
                      active.append((x, y, tile.get('crop') or tile.get('animal')))
          print('FINAL', final.money, 'quadrants', list(final.unlocked_quadrants), 'active_count', len(active))
          print('NE_ACTIVE', [entry for entry in active if entry[0] >= 5 and entry[1] < 5])
          PY
