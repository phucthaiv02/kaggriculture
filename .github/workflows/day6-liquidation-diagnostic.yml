name: Diagnose day-six liquidation timing
on:
  push:
    branches: [feat/planner-capacity-v4]
    paths: [.github/workflows/day6-liquidation-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install kaggle-environments==1.32.7
      - name: Trace day-six worker cargo
        run: |
          PYTHONPATH=. python - <<'PY'
          from kaggle_environments import make
          from agents.expansion_agent import make_agent

          env = make('kaggriculture', configuration={
              'seed': 1,
              'weedSpawnChance': 0.0,
              'episodeSteps': 192,
          }, debug=False)
          base = make_agent(opening_version='melon_v2')
          cash_items = ('FERTILIZER','CARROT','MELON','TOMATO','STRAWBERRY','EGG','MILK','WOOL')

          def agent(obs):
              action = base(obs)
              if obs.day == 6 and 3 <= obs.hour <= 8:
                  farm = obs.farms[0]
                  positions = [tuple(farm.farmer), *map(tuple, farm.hands)]
                  ops = [action.get('farmer', ['PASS']), *action.get('hands', [])]
                  workers = []
                  for index, (position, inv) in enumerate(zip(positions, obs.private.inventories)):
                      cargo = {k: inv.get(k, 0) for k in cash_items if inv.get(k, 0)}
                      if cargo or (index < len(ops) and ops[index] and ops[index][0] == 'DROP'):
                          workers.append((index, position, cargo, ops[index] if index < len(ops) else None))
                  print('D6', obs.hour, 'money', farm.money, 'hands', len(farm.hands), 'workers', workers,
                        'market', action.get('market', []))
              return action

          env.run([agent, lambda obs: {'farmer': ['PASS'], 'market': []}])
          PY
