name: Apply turnover and watering fix

on:
  push:
    branches: [agent-v3-turnover-watering-fix]
    paths:
      - .github/workflows/apply-turnover-watering-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply source patches
        run: |
          python .ci/apply_schedules_patch.py
          python .ci/apply_planner_patch.py
          python .ci/apply_farm_tasks_patch.py
          python -m py_compile agents/schedules.py agents/planner.py agents/farm_tasks.py tests/test_agents_turnover_watering.py
          git diff --check
          git diff -- agents/schedules.py agents/planner.py agents/farm_tasks.py

      - name: Install runtime
        run: python -m pip install --upgrade kaggle-environments pytest

      - name: Run focused regression tests
        run: |
          pytest -q tests/test_agents_turnover_watering.py tests/test_agents_planner.py tests/test_agents_farm_tasks.py
          python .ci/validate_water_profiles.py

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-turnover-watering-fix.yml
          git rm .ci/apply_schedules_patch.py .ci/apply_planner_patch.py .ci/apply_farm_tasks_patch.py .ci/validate_water_profiles.py
          git add agents/schedules.py agents/planner.py agents/farm_tasks.py
          git commit -m "fix: plan turnover and stagger crop watering"
          git push origin HEAD:agent-v3-turnover-watering-fix
