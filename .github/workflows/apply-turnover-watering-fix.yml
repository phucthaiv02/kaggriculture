            if not cycle_finished(tile["crop"], day - tile["planted_day"], tile):
                continue
            # Preserve a conversion already scheduled by the opening.
''',
              '''        if isinstance(tile, dict) and tile.get("kind") == "PLANT":
            if not cycle_turns_over_today(tile["crop"], day - tile["planted_day"], tile):
                # Do not drop a growing crop from the persistent pending set.
                # Keeping it here lets the same position be repriced on the
                # morning its known lifecycle says it will be freed today.
                if replan_positions is not None:
                    deferred.append(position)
                continue
            # Preserve a conversion already scheduled by the opening.
''',
          )
          replace_once(
              'agents/planner.py',
              '''    pending = replanning[max_positions:] if max_positions is not None else []
''',
              '''    pending = deferred + (replanning[max_positions:] if max_positions is not None else [])
''',
          )

          replace_once(
              'agents/farm_tasks.py',
              '''from agents.schedules import (
    ONGOING_CROPS, cycle_finished, is_maintenance_day, should_care_animal,
    should_feed_animal, should_fertilize_today, animal_feed_end_age, should_harvest_animal,
)
''',
              '''from agents.schedules import (
    ONGOING_CROPS, cycle_turns_over_today, is_maintenance_day, should_care_animal,
