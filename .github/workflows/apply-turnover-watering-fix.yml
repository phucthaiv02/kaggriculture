name: Apply turnover and watering fix

on:
  push:
    branches: [agent-v3-turnover-watering-fix]
    paths:
      - .github/workflows/apply-turnover-watering-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              assert count == 1, (path, count, old[:100])
              p.write_text(text.replace(old, new, 1))

          schedules = Path('agents/schedules.py')
          text = schedules.read_text()
          marker = '\n# Last age at which a one-time crop can still be harvested or an ongoing crop\n'
          assert marker in text
          profiles = '''
# Interpreter-verified alternatives from experiments/crop_schedules.py.
# Profile 0 is the historical minimum-action calendar. Profile 1 deliberately
# shifts protective irrigation for neighboring spatial zones so same-day
# cohorts do not all create the same labor peak. Some one-time crops need one
# extra protective WATER to move the earlier visits while preserving yield.
CROP_WATER_PROFILES = {
    ("MELON", False): (
        frozenset(CROP_WATER_DAYS[("MELON", False)]),
        frozenset({0, 1, 3, 5, 6, 7, 8, 9, 10}),
    ),
    ("MELON", True): (
        frozenset(CROP_WATER_DAYS[("MELON", True)]),
        frozenset({0, 1, 3, 5, 6, 8, 9}),
    ),
    ("TOMATO", False): (
        frozenset(CROP_WATER_DAYS[("TOMATO", False)]),
        frozenset({0, 1, 3, 5, 7, 9}),
    ),
    ("TOMATO", True): (
        frozenset(CROP_WATER_DAYS[("TOMATO", True)]),
        frozenset({0, 1, 3, 5, 7, 8, 9, 10}),
    ),
    ("STRAWBERRY", False): (
        frozenset(CROP_WATER_DAYS[("STRAWBERRY", False)]),
        frozenset({0, 1, 3, 5, 6, 8, 10, 12, 14}),
    ),
    ("STRAWBERRY", True): (
        frozenset(CROP_WATER_DAYS[("STRAWBERRY", True)]),
        frozenset({0, 1, 3, 5, 7, 9, 11, 13, 15}),
    ),
}
'''
          text = text.replace(marker, '\n' + profiles + marker, 1)
          schedules.write_text(text)

          replace_once(
              'agents/schedules.py',
              '''def water_days(crop, fertilized):
    return CROP_WATER_DAYS[(crop, _cycle_uses_fertilizer(fertilized))]


def is_maintenance_day(crop, age, fertilized):
    return age in water_days(crop, fertilized)
''',
              '''def water_profiles(crop, fertilized):
    """Equivalent verified WATER calendars available to one crop cycle."""
    key = (crop, _cycle_uses_fertilizer(fertilized))
    return CROP_WATER_PROFILES.get(key, (frozenset(CROP_WATER_DAYS[key]),))


def water_days(crop, fertilized, position=None, planted_day=0):
    """Stable spatially staggered WATER calendar for this physical crop.

    Adjacent 2x2 zones share a profile so a worker can service a compact area;
    neighboring zones alternate profiles. Replanting on another calendar day
    also rotates the phase, preventing permanent hot spots on the same tiles.
    Passing position=None keeps the historical baseline (used by opening).
    """
    profiles = water_profiles(crop, fertilized)
    if position is None or len(profiles) == 1:
        return profiles[0]
    x, y = position
    zone = x // 2 + y // 2 + int(planted_day)
    return profiles[zone % len(profiles)]


def is_maintenance_day(crop, age, fertilized, position=None, planted_day=0):
    return age in water_days(crop, fertilized, position, planted_day)
''',
          )

          replace_once(
              'agents/schedules.py',
              '''def cycle_finished(crop, age, tile):
    """Return whether a crop will never yield again and its tile can be reused."""
    if crop not in ONGOING_CROPS:
        return age >= CROP_LAST_AGE[crop]
    return age >= CROP_LAST_AGE[crop] and not tile.get("yield_units", 0)
''',
              '''def cycle_finished(crop, age, tile):
    """Return whether a crop is already empty and physically reusable now."""
    if crop not in ONGOING_CROPS:
        return age >= CROP_LAST_AGE[crop]
    return age >= CROP_LAST_AGE[crop] and not tile.get("yield_units", 0)


def cycle_turns_over_today(crop, age, tile):
    """Whether today's complete plan can harvest/clear this crop and reuse it.

    Ongoing crops can still hold their final output on CROP_LAST_AGE. They are
    not ``cycle_finished`` before HARVEST, but the planner must price their
    successor now so build_tasks can schedule HARVEST -> DIG -> replacement in
    the same day instead of waiting for a WEED/empty observation tomorrow.
    """
    if crop in ONGOING_CROPS:
        return age >= CROP_LAST_AGE[crop]
    return cycle_finished(crop, age, tile)
''',
          )

          replace_once(
              'agents/planner.py',
              '''from agents.schedules import (
    CROP_FERTILIZE_DAYS, CROP_LAST_AGE, ONGOING_CROPS, cycle_finished,
)
''',
