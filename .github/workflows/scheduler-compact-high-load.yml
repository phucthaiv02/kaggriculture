name: Benchmark clustered regret packing
on:
  push:
    branches: [feat/planner-capacity-v4]
    paths: [.github/workflows/scheduler-compact-high-load.yml]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q kaggle-environments==1.32.7 pytest
      - name: Apply clustered regret candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          p = Path('agents/scheduler.py')
          s = p.read_text()
          s = s.replace(
              'def _pack_once(tasks, worker_starts, budgets, shed_access, hard_first=False):',
              'def _pack_once(tasks, worker_starts, budgets, shed_access, hard_first=False, compact=False):'
          )
          old_cost = '''                    cost = projected if time_sensitive else projected - lengths[worker]\n                    candidates.append((cost, projected, worker, insertion))'''
          new_cost = '''                    protected_timing = (\n                        task.must_liquidate or task.immediate_drop\n                        or task.refinance_feed or task.cash_priority < 2\n                    )\n                    cost = (\n                        projected - lengths[worker]\n                        if compact and not protected_timing\n                        else projected if time_sensitive\n                        else projected - lengths[worker]\n                    )\n                    candidates.append((cost, projected, worker, insertion))'''
          if old_cost not in s:
              raise SystemExit('cost block not found')
          s = s.replace(old_cost, new_cost, 1)
          marker = '\ndef _pack(tasks, worker_starts, budgets, shed_access=SHED_ACCESS):\n'
          fn = dedent('''
          
          def _pack_regret(tasks, worker_starts, budgets, shed_access):
              """Pack the most constrained task first while preserving route priority."""
              buckets = [[] for _ in worker_starts]
              remaining = list(tasks)
              while remaining:
                  ranked = []
                  for index, task in enumerate(remaining):
                      worker_choices = []
                      for worker, bucket in enumerate(buckets):
                          if task.pinned_worker is not None and worker != task.pinned_worker:
                              continue
                          choice = _insert_task(
                              bucket, task, worker_starts[worker], budgets[worker], shed_access
                          )
                          if choice is not None:
                              worker_choices.append((choice[0], choice[1], worker, choice[3]))
                      if not worker_choices:
                          continue
                      worker_choices.sort(key=lambda item: item[:3])
                      best = worker_choices[0]
                      regret = (
                          worker_choices[1][0] - best[0]
                          if len(worker_choices) > 1 else float("inf")
                      )
                      rank = (
                          len(worker_choices), -regret, _task_priority(task),
                          -len(_mandatory_actions(task)),
                          task.position[1], task.position[0], index,
                      )
                      ranked.append((rank, index, best))
                  if not ranked:
                      break
                  _, index, (_, _, worker, candidate) = min(
                      ranked, key=lambda item: item[0]
                  )
                  buckets[worker] = candidate
                  remaining.pop(index)
              return buckets, remaining
          ''')
          if marker not in s:
              raise SystemExit('pack marker not found')
          s = s.replace(marker, fn + marker, 1)
          old = '''    for buckets, unassigned in candidates:\n        repaired, remaining = _repair_single_swaps(\n            buckets, unassigned, worker_starts, budgets, shed_access\n        )\n        if len(remaining) < len(best_unassigned):\n            best_buckets, best_unassigned = repaired, remaining\n        if not best_unassigned:\n            break\n    return best_buckets, best_unassigned\n'''
          new = '''    for buckets, unassigned in candidates:\n        repaired, remaining = _repair_single_swaps(\n            buckets, unassigned, worker_starts, budgets, shed_access\n        )\n        if len(remaining) < len(best_unassigned):\n            best_buckets, best_unassigned = repaired, remaining\n        if not best_unassigned:\n            break\n\n    if best_unassigned and len(worker_starts) >= 10:\n        for hard_first in (False, True):\n            clustered, missing = _pack_once(\n                tasks, worker_starts, budgets, shed_access,\n                hard_first=hard_first, compact=True,\n            )\n            if len(missing) < len(best_unassigned):\n                best_buckets, best_unassigned = clustered, missing\n            if not best_unassigned:\n                return best_buckets, best_unassigned\n        regret_buckets, regret_unassigned = _pack_regret(\n            tasks, worker_starts, budgets, shed_access\n        )\n        if len(regret_unassigned) < len(best_unassigned):\n            best_buckets, best_unassigned = regret_buckets, regret_unassigned\n    return best_buckets, best_unassigned\n'''
          if old not in s:
              raise SystemExit('pack repair block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Candidate full-season melon
        run: |
          PYTHONPATH=. python - <<'PY'
          from kaggle_environments import make
          from agents.expansion_agent import make_agent
          env = make('kaggriculture', configuration={'seed':1,'weedSpawnChance':0.0,'episodeSteps':720}, debug=False)
          agent = make_agent(opening_version='melon_v2')
          env.run([lambda obs: agent(obs), lambda obs: {'farmer':['PASS'],'market':[]}])
          daily = {}
          for frame in env.steps:
              o = frame[0].observation
              daily[o.day] = max(daily.get(o.day,0), len(o.farms[0].hands))
          final = env.steps[-1][0].observation.farms[0]
          cand = {'money': final.money, 'max_hands': max(daily.values()), 'hand_days': sum(daily.values()), 'daily': daily}
          print('BASELINE', {'money':12674.0, 'max_hands':16, 'hand_days':140})
          print('REGRET_ONLY', {'money':14516.0, 'max_hands':16, 'hand_days':115})
          print('CANDIDATE', cand)
          print('DELTA_BASE', cand['money']-12674.0, cand['max_hands']-16, cand['hand_days']-140)
          print('DELTA_REGRET', cand['money']-14516.0, cand['max_hands']-16, cand['hand_days']-115)
          assert cand['money'] >= 12674.0 * 0.98, cand
          assert cand['max_hands'] <= 15 or cand['hand_days'] < 115, cand
          PY
      - name: Scheduler and survival regressions
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_agents_scheduler.py \
            tests/test_agents_capacity_guard.py \
            tests/test_agents_opening_cash_priority.py \
            tests/test_agents_opening_book.py \
            tests/test_survival_debt_regression.py \
            tests/test_agents_intraday.py \
            tests/test_agents_affordable_production.py \
            tests/test_agents_melon_opening.py
