name: Seed Smoke 1-5

on:
  workflow_dispatch:
  push:
    branches:
      - feat/planner-capacity-v4
    paths:
      - .github/workflows/seed-smoke.yml
      - agents/**
      - tests/**

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7' pytest
      - name: Run focused tests
        run: python -m pytest -q tests/test_agents_farm_tasks.py tests/test_agents_scheduler.py tests/test_scheduler_compaction.py tests/test_agents_intraday.py tests/test_agents_opening_book.py tests/test_agents_harvest_priority.py tests/test_agents_planner_daily.py tests/test_replay_health_regressions.py tests/test_survival_debt_regression.py
      - name: Diagnose producer health and run seeds 1 to 5 vs pass
        run: |
          python - <<'PY'
          import json
          from kaggle_environments import make
          from agents.expansion_agent import make_agent
          from experiments.crop_schedules import pass_agent
          from experiments.play_match import configuration, END_DAY

          opening_wheat = [(x, y) for y in range(5) for x in range(5)][:19]
          results = []
          for seed in (1, 2, 3, 4, 5):
              env = make('kaggriculture', configuration=configuration(seed), debug=False)
              env.run([make_agent(END_DAY - 1, seed=seed), pass_agent])

              snapshots = []
              for states in env.steps:
                  obs = states[0].observation
                  day = int(obs['day'])
                  hour = int(obs['hour'])
                  if (day, hour) not in ((4, 0), (4, 23), (5, 0)):
                      continue
                  tiles = obs['farms'][0]['tiles']
                  summary = {
                      'day': day,
                      'hour': hour,
                      'initial_wheat_alive': 0,
                      'initial_wheat_ready': 0,
                      'replanted': 0,
                      'weed': 0,
                      'other_or_empty': 0,
                      'hands': len(obs['farms'][0]['hands']),
                      'money': float(obs['farms'][0]['money']),
                  }
                  for x, y in opening_wheat:
                      tile = tiles[y][x]
                      if isinstance(tile, dict) and tile.get('kind') == 'PLANT' and tile.get('crop') == 'WHEAT':
                          if tile.get('planted_day') == 0:
                              summary['initial_wheat_alive'] += 1
                              summary['initial_wheat_ready'] += int(tile.get('yield_units', 0) > 0)
                          else:
                              summary['replanted'] += 1
                      elif isinstance(tile, dict) and tile.get('kind') == 'WEED':
                          summary['weed'] += 1
                      else:
                          summary['other_or_empty'] += 1
                  snapshots.append(summary)
              print('WHEAT_DIAG ' + json.dumps({'seed': seed, 'snapshots': snapshots}, sort_keys=True), flush=True)

              animal_losses = []
              weed_transitions = []
              for previous_states, current_states in zip(env.steps, env.steps[1:]):
                  previous = previous_states[0].observation
                  current = current_states[0].observation
                  previous_tiles = previous['farms'][0]['tiles']
                  current_tiles = current['farms'][0]['tiles']
                  for y, row in enumerate(previous_tiles):
                      for x, old in enumerate(row):
                          new = current_tiles[y][x]
                          if isinstance(old, dict) and old.get('animal'):
                              if not (isinstance(new, dict) and new.get('animal')):
                                  animal_losses.append({
                                      'day': int(current['day']), 'hour': int(current['hour']),
                                      'position': [x, y], 'animal': old.get('animal'),
                                      'placed_day': old.get('placed_day'),
                                      'consecutive_unfed': old.get('consecutive_unfed', 0),
                                  })
                          if (
                              isinstance(old, dict) and old.get('kind') == 'PLANT'
                              and isinstance(new, dict) and new.get('kind') == 'WEED'
                          ):
                              weed_transitions.append({
                                  'day': int(current['day']), 'hour': int(current['hour']),
                                  'position': [x, y], 'crop': old.get('crop'),
                                  'planted_day': old.get('planted_day'),
                                  'consecutive_unwatered': old.get('consecutive_unwatered', 0),
                              })

              # The last two engine days are liquidation/endgame. A producer can be
              # intentionally abandoned there when no additional harvest can pay back
              # its maintenance. Keep those transitions visible, but do not fail the
              # health gate on them. Mid-season deaths/weeds remain hard failures.
              economic_cutoff_day = END_DAY - 2
              economic_animal_losses = [
                  item for item in animal_losses if item['day'] < economic_cutoff_day
              ]
              economic_weed_transitions = [
                  item for item in weed_transitions if item['day'] < economic_cutoff_day
              ]

              print('HEALTH_RESULT ' + json.dumps({
                  'seed': seed,
                  'animal_losses': animal_losses,
                  'weed_transitions': weed_transitions,
                  'economic_animal_losses': economic_animal_losses,
                  'economic_weed_transitions': economic_weed_transitions,
              }, sort_keys=True), flush=True)

              final = env.steps[-1]
              row = {
                  'seed': seed,
                  'current_cash': float(final[0].reward),
                  'opponent_cash': float(final[1].reward),
                  'margin': float(final[0].reward) - float(final[1].reward),
                  'statuses': [state.status for state in final],
                  'frames': len(env.steps),
                  'animal_losses': len(animal_losses),
                  'weed_transitions': len(weed_transitions),
                  'economic_animal_losses': len(economic_animal_losses),
                  'economic_weed_transitions': len(economic_weed_transitions),
              }
              print('SEED_RESULT ' + json.dumps(row, sort_keys=True), flush=True)
              if row['statuses'] != ['DONE', 'DONE']:
                  raise RuntimeError(f"seed {seed} did not finish normally: {row['statuses']}")
              if economic_animal_losses:
                  raise RuntimeError(f"seed {seed} lost animals before endgame: {economic_animal_losses}")
              if economic_weed_transitions:
                  raise RuntimeError(f"seed {seed} produced weeds before endgame: {economic_weed_transitions}")
              results.append(row)

          avg = sum(r['current_cash'] for r in results) / len(results)
          best = max(results, key=lambda r: r['current_cash'])
          worst = min(results, key=lambda r: r['current_cash'])
          print('SEED_SUMMARY ' + json.dumps({
              'average_current_cash': avg,
              'best_seed': best['seed'],
              'best_cash': best['current_cash'],
              'worst_seed': worst['seed'],
              'worst_cash': worst['current_cash'],
          }, sort_keys=True), flush=True)
          PY
