name: Commit remaining-day worker budgets

on:
  push:
    branches: [agent-v3-turnover-watering-fix]
    paths:
      - .github/workflows/validate-remaining-day-budget.yml

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply source patch and push agent-v3
        run: |
          cp .ci/apply_remaining_budget_patch_v2.py /tmp/apply_remaining_budget_patch.py
          git fetch origin agent-v3
          git checkout -B apply-remaining-budget origin/agent-v3
          python /tmp/apply_remaining_budget_patch.py
          git checkout -- tests/test_agents_scheduler.py
          python -m py_compile agents/scheduler.py agents/expansion_agent.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/scheduler.py agents/expansion_agent.py
          git commit -m "fix: size queues to remaining day capacity"
          git push origin HEAD:agent-v3
