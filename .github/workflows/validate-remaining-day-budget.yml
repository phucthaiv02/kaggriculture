name: Commit planner timeout optimization

on:
  push:
    branches: [agent-v3-turnover-watering-fix]
    paths:
      - .github/workflows/validate-remaining-day-budget.yml

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply source patch and push agent-v3
        run: |
          cp .ci/optimize_scheduler_timeout.py /tmp/optimize_scheduler_timeout.py
          git fetch origin agent-v3
          git checkout -B optimize-planner-timeout origin/agent-v3
          python /tmp/optimize_scheduler_timeout.py
          python -m py_compile agents/scheduler.py agents/expansion_agent.py agents/forecast.py agents/planner.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/scheduler.py agents/expansion_agent.py agents/forecast.py agents/planner.py
          git commit -m "perf: bound daily planner runtime"
          git push origin HEAD:agent-v3
