name: Target selection experiment

on:
  push:
    branches: [agent-v3]
    paths:
      - '.github/workflows/target-selection-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2]
        variant: [o1, eps5, eps10, eps15, eps25]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install --upgrade kaggle-environments pytest numpy matplotlib >/dev/null
      - name: Run target selector
        env:
          SEED: ${{ matrix.seed }}
          VARIANT: ${{ matrix.variant }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from agents import planner
          from experiments.play_match import run

          seed = int(os.environ['SEED'])
          variant = os.environ['VARIANT']
          original_choose = planner._choose

          def make_fast_choose(epsilon):
              def choose(market, baseline, candidates, counts, labor=None, position=(4, 4), *, target_option=None):
                  results = planner.evaluate_targets(
                      market, baseline, candidates, labor, position, target_option=1
                  )
                  profitable = [(r.score(1), r) for r in results if r.score(1) > 0]
                  if not profitable:
                      return None, None
                  best_score = max(score for score, _ in profitable)
                  close = [(score, r) for score, r in profitable if score >= best_score - epsilon]
                  _, result = max(
                      close,
                      key=lambda item: (
                          -planner._first_yield_age(item[1].choice[0]),
                          item[0],
                          -item[1].capital_cost,
                          -counts[item[1].choice[0]],
                          item[1].choice,
                      ),
                  )
                  return result.choice, result.output
              return choose

          if variant != 'o1':
              epsilon = {'eps5': 5.0, 'eps10': 10.0, 'eps15': 15.0, 'eps25': 25.0}[variant]
              planner._choose = make_fast_choose(epsilon)

          result = run(
              opponent='public/A.ipynb',
              seed=seed,
              output_dir=Path('ci-target-selection'),
              target_option=1,
          )
          row = {
              'seed': seed,
              'variant': variant,
              'cash': result['current_cash'],
              'opponent_cash': result['opponent_cash'],
              'margin': result['margin'],
              'statuses': result['statuses'],
          }
          print('TARGET_RESULT=' + json.dumps(row, sort_keys=True))
          planner._choose = original_choose
          PY
