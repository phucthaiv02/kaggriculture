name: Target selection experiment

on:
  push:
    branches: [agent-v3]
    paths:
      - '.github/workflows/target-selection-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2]
        variant: [o1, fast005, fast01, fast02, cap005, cap01, cap02, div01, combo01]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install --upgrade kaggle-environments pytest numpy matplotlib >/dev/null
      - name: Run target selector
        env:
          SEED: ${{ matrix.seed }}
          VARIANT: ${{ matrix.variant }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from agents import planner
          from experiments.play_match import run

          seed = int(os.environ['SEED'])
          variant = os.environ['VARIANT']
          original_choose = planner._choose

          def make_close_choose(mode, pct):
              def choose(market, baseline, candidates, counts, labor=None, position=(4, 4), *, target_option=None):
                  results = planner.evaluate_targets(
                      market, baseline, candidates, labor, position, target_option=1
                  )
                  profitable = [(r.score(1), r) for r in results if r.score(1) > 0]
                  if not profitable:
                      return None, None
                  best_score = max(score for score, _ in profitable)
                  cutoff = best_score * (1.0 - pct)
                  close = [(score, r) for score, r in profitable if score >= cutoff]

                  def key(item):
                      score, r = item
                      age = planner._first_yield_age(r.choice[0])
                      count = counts[r.choice[0]]
                      if mode == 'fast':
                          return (-age, score, -r.capital_cost, -count, r.choice)
                      if mode == 'cap':
                          return (-r.capital_cost, score, -age, -count, r.choice)
                      if mode == 'div':
                          return (-count, score, -age, -r.capital_cost, r.choice)
                      if mode == 'combo':
                          # Conservative tie-break: diversify first, then faster cash,
                          # then lower capital. Economics only defines the shortlist.
                          return (-count, -age, -r.capital_cost, score, r.choice)
                      raise ValueError(mode)

                  _, result = max(close, key=key)
                  return result.choice, result.output
              return choose

          if variant != 'o1':
              spec = {
                  'fast005': ('fast', 0.005),
                  'fast01': ('fast', 0.01),
                  'fast02': ('fast', 0.02),
                  'cap005': ('cap', 0.005),
                  'cap01': ('cap', 0.01),
                  'cap02': ('cap', 0.02),
                  'div01': ('div', 0.01),
                  'combo01': ('combo', 0.01),
              }[variant]
              planner._choose = make_close_choose(*spec)

          result = run(
              opponent='public/A.ipynb',
              seed=seed,
              output_dir=Path('ci-target-selection'),
              target_option=1,
          )
          row = {
              'seed': seed,
              'variant': variant,
              'cash': result['current_cash'],
              'opponent_cash': result['opponent_cash'],
              'margin': result['margin'],
              'statuses': result['statuses'],
          }
          print('TARGET_RESULT=' + json.dumps(row, sort_keys=True))
          planner._choose = original_choose
          PY
