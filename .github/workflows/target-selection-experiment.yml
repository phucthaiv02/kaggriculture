name: Target selection experiment

on:
  push:
    branches: [agent-v3]
    paths:
      - '.github/workflows/target-selection-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 3, 5, 6]
        variant: [o1, stick1, stick5, stick10, stick25]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install --upgrade kaggle-environments pytest numpy matplotlib >/dev/null
      - name: Run target selector
        env:
          SEED: ${{ matrix.seed }}
          VARIANT: ${{ matrix.variant }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from agents import planner, expansion_agent
          from experiments.play_match import run

          seed = int(os.environ['SEED'])
          variant = os.environ['VARIANT']
          original_choose = planner._choose
          original_plan_targets = expansion_agent.plan_targets
          context = {'targets': None}

          def wrapped_plan_targets(obs, targets, *args, **kwargs):
              context['targets'] = targets
              try:
                  return original_plan_targets(obs, targets, *args, **kwargs)
              finally:
                  context['targets'] = None

          def make_sticky_choose(epsilon):
              def choose(market, baseline, candidates, counts, labor=None, position=(4, 4), *, target_option=None):
                  results = planner.evaluate_targets(
                      market, baseline, candidates, labor, position, target_option=1
                  )
                  profitable = [(r.score(1), r) for r in results if r.score(1) > 0]
                  if not profitable:
                      return None, None
                  best_score, best = max(
                      profitable,
                      key=lambda item: (item[0], -counts[item[1].choice[0]], item[1].choice),
                  )
                  targets = context['targets']
                  current = targets.get(position) if targets is not None else None
                  if current:
                      current_rows = [
                          (score, r) for score, r in profitable if r.choice == current
                      ]
                      if current_rows:
                          current_score, current_result = max(current_rows, key=lambda item: item[0])
                          if current_score >= best_score - epsilon:
                              return current_result.choice, current_result.output
                  return best.choice, best.output
              return choose

          variants = {
              'stick1': 1.0,
              'stick5': 5.0,
              'stick10': 10.0,
              'stick25': 25.0,
          }
          if variant in variants:
              expansion_agent.plan_targets = wrapped_plan_targets
              planner._choose = make_sticky_choose(variants[variant])

          result = run(
              opponent='public/A.ipynb',
              seed=seed,
              output_dir=Path('ci-target-selection'),
              target_option=1,
          )
          row = {
              'seed': seed,
              'variant': variant,
              'cash': result['current_cash'],
              'opponent_cash': result['opponent_cash'],
              'margin': result['margin'],
              'statuses': result['statuses'],
          }
          print('TARGET_RESULT=' + json.dumps(row, sort_keys=True))
          planner._choose = original_choose
          expansion_agent.plan_targets = original_plan_targets
          PY
