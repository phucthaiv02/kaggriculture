name: Target selection experiment

on:
  push:
    branches: [agent-v3]
    paths:
      - '.github/workflows/target-selection-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 3, 5, 6]
        variant: [o1, early1, early2, early3, early5d2]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install --upgrade kaggle-environments pytest numpy matplotlib >/dev/null
      - name: Run target selector
        env:
          SEED: ${{ matrix.seed }}
          VARIANT: ${{ matrix.variant }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from agents import planner
          from experiments.play_match import run

          seed = int(os.environ['SEED'])
          variant = os.environ['VARIANT']
          original_choose = planner._choose

          def make_early_choose(epsilon, min_days):
              def choose(market, baseline, candidates, counts, labor=None, position=(4, 4), *, target_option=None):
                  results = planner.evaluate_targets(
                      market, baseline, candidates, labor, position, target_option=1
                  )
                  profitable = [(r.score(1), r) for r in results if r.score(1) > 0]
                  if not profitable:
                      return None, None
                  # Reproduce O1 exactly first; only then consider a narrowly
                  # cheaper-score candidate that returns its first yield sooner.
                  best_score, best = max(
                      profitable,
                      key=lambda item: (item[0], -counts[item[1].choice[0]], item[1].choice),
                  )
                  best_age = planner._first_yield_age(best.choice[0])
                  earlier = [
                      (score, r) for score, r in profitable
                      if score >= best_score - epsilon
                      and planner._first_yield_age(r.choice[0]) <= best_age - min_days
                  ]
                  if not earlier:
                      return best.choice, best.output
                  min_age = min(planner._first_yield_age(r.choice[0]) for _, r in earlier)
                  _, result = max(
                      ((score, r) for score, r in earlier
                       if planner._first_yield_age(r.choice[0]) == min_age),
                      key=lambda item: (item[0], -counts[item[1].choice[0]], item[1].choice),
                  )
                  return result.choice, result.output
              return choose

          variants = {
              'early1': (1.0, 1),
              'early2': (2.0, 1),
              'early3': (3.0, 1),
              'early5d2': (5.0, 2),
          }
          if variant in variants:
              planner._choose = make_early_choose(*variants[variant])

          result = run(
              opponent='public/A.ipynb',
              seed=seed,
              output_dir=Path('ci-target-selection'),
              target_option=1,
          )
          row = {
              'seed': seed,
              'variant': variant,
              'cash': result['current_cash'],
              'opponent_cash': result['opponent_cash'],
              'margin': result['margin'],
              'statuses': result['statuses'],
          }
          print('TARGET_RESULT=' + json.dumps(row, sort_keys=True))
          planner._choose = original_choose
          PY
