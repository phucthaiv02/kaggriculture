name: Target selection experiment

on:
  push:
    branches: [agent-v3]
    paths:
      - '.github/workflows/target-selection-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        margin: [0.6, 0.7, 0.8, 0.9, 1.0]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install --upgrade kaggle-environments pytest numpy matplotlib >/dev/null
      - name: Locate switch margin threshold
        env:
          MARGIN: ${{ matrix.margin }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from agents import planner
          from experiments.play_match import run

          margin = float(os.environ['MARGIN'])
          planner.TARGET_SWITCH_MARGIN = margin
          result = run(
              opponent='public/A.ipynb',
              seed=12,
              output_dir=Path('ci-target-selection'),
              target_option=1,
          )
          print('TARGET_RESULT=' + json.dumps({
              'seed': 12,
              'margin_setting': margin,
              'cash': result['current_cash'],
              'opponent_cash': result['opponent_cash'],
              'margin': result['margin'],
              'statuses': result['statuses'],
          }, sort_keys=True))
          PY
