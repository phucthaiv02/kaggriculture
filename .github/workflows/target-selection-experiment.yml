name: Target selection experiment

on:
  push:
    branches: [agent-v3]
    paths:
      - '.github/workflows/target-selection-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planner-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install --upgrade kaggle-environments pytest numpy matplotlib >/dev/null
      - name: Run planner tests
        run: python -m pytest tests/test_agents_planner.py -q

  benchmark:
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install --upgrade kaggle-environments pytest numpy matplotlib >/dev/null
      - name: Run production target selector
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from experiments.play_match import run

          seed = int(os.environ['SEED'])
          result = run(
              opponent='public/A.ipynb',
              seed=seed,
              output_dir=Path('ci-target-selection'),
              target_option=1,
          )
          row = {
              'seed': seed,
              'cash': result['current_cash'],
              'opponent_cash': result['opponent_cash'],
              'margin': result['margin'],
              'statuses': result['statuses'],
          }
          print('TARGET_RESULT=' + json.dumps(row, sort_keys=True))
          PY
