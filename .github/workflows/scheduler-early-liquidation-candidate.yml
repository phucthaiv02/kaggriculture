name: Benchmark early liquidation routing
on:
  push:
    branches: [feat/planner-capacity-v4]
    paths: [.github/workflows/scheduler-early-liquidation-candidate.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install kaggle-environments==1.32.7 pytest
      - name: Apply early-liquidation candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('agents/scheduler.py')
          text = path.read_text()
          old = '''def _mandatory_queue(start, bucket, shed_access):\n    """Mandatory route including the final shed DROP for liquidation work."""\n    queue, current = _task_queue(start, bucket, shed_access)\n    if any(task.must_liquidate for task in bucket):\n        shed = nearest_shed(current, shed_access)\n        queue += route(current, shed) + [["DROP"]]\n        current = shed\n    return queue, current\n'''
          new = '''def _mandatory_queue(start, bucket, shed_access):\n    """Mandatory route with liquidation banked before unrelated tail work.\n\n    ``must_liquidate`` tasks are already priority-ordered ahead of ordinary\n    discretionary work.  Once the last such task assigned to this worker is\n    complete, return its output to the shed immediately; do not carry sale\n    proceeds through the rest of the route and delay same-day investment.\n    """\n    last_liquidation = max(\n        (index for index, task in enumerate(bucket) if task.must_liquidate),\n        default=-1,\n    )\n    if last_liquidation < 0:\n        return _task_queue(start, bucket, shed_access)\n\n    prefix = bucket[:last_liquidation + 1]\n    suffix = bucket[last_liquidation + 1:]\n    queue, current = _task_queue(start, prefix, shed_access)\n    shed = nearest_shed(current, shed_access)\n    if not queue or queue[-1][0] != "DROP":\n        queue += route(current, shed) + [["DROP"]]\n    current = shed\n\n    if suffix:\n        tail, current = _task_queue(current, suffix, shed_access)\n        queue += tail\n    return queue, current\n'''
          if old not in text:
              raise SystemExit('mandatory queue block not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Benchmark candidate and expansion timing
        run: |
          PYTHONPATH=. python - <<'PY'
          from collections import Counter
          from kaggle_environments import make
          from agents.expansion_agent import make_agent

          env = make('kaggriculture', configuration={'seed': 1, 'weedSpawnChance': 0.0, 'episodeSteps': 288}, debug=False)
          base_agent = make_agent(opening_version='melon_v2')
          land_buys = []
          def agent(obs):
              action = base_agent(obs)
              if any(order and order[0] == 'BUY_LAND' for order in action.get('market', [])):
                  land_buys.append((obs.day, obs.hour, len(obs.farms[0].hands), obs.farms[0].money))
              return action

          env.run([agent, lambda obs: {'farmer': ['PASS'], 'market': []}])
          day_hands = {}
          for frame in env.steps:
              obs = frame[0].observation
              day_hands[obs.day] = max(day_hands.get(obs.day, 0), len(obs.farms[0].hands))
          final = env.steps[-1][0].observation.farms[0]
          kinds = Counter()
          for row in final.tiles:
              for tile in row:
                  if isinstance(tile, dict):
                      name = tile.get('animal') or tile.get('crop')
                      if name:
                          kinds[name] += 1
          result = {
              'money': final.money,
              'hand_days': sum(day_hands.get(d, 0) for d in range(6, max(day_hands) + 1)),
              'kinds': dict(kinds),
              'land_buys': land_buys,
          }
          print('BASELINE', {'money': 15525.0, 'hand_days': 75})
          print('CANDIDATE', result)
          print('DELTA', result['money'] - 15525.0, result['hand_days'] - 75)
          assert (result['money'] > 15525.0 or (result['money'] == 15525.0 and result['hand_days'] < 75)), result
          PY
      - name: Focused scheduler regressions
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_agents_scheduler.py \
            tests/test_agents_capacity_guard.py \
            tests/test_agents_opening_cash_priority.py \
            tests/test_survival_debt_regression.py
