name: Route pack optimizer
on:
  push:
    branches: [feat/planner-capacity-v4]
    paths: [.github/workflows/route-pack-optimizer.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install kaggle-environments==1.32.7 pytest
      - name: Restore safe scheduler and add one-swap repair
        run: |
          git fetch --depth=1 origin dd208ce54c3bc1afeb74d1b200a74d33093e9084
          git show dd208ce54c3bc1afeb74d1b200a74d33093e9084:agents/scheduler.py > agents/scheduler.py
          git show dd208ce54c3bc1afeb74d1b200a74d33093e9084:tests/test_agents_scheduler.py > tests/test_agents_scheduler.py
          python - <<'PY'
          from pathlib import Path
          path = Path('agents/scheduler.py')
          text = path.read_text()
          old = '''def _pack(tasks, worker_starts, budgets, shed_access=SHED_ACCESS):\n    \"\"\"Pack mandatory work, retrying a harder-first layout before adding labor.\"\"\"\n    buckets, unassigned = _pack_once(\n        tasks, worker_starts, budgets, shed_access, hard_first=False\n    )\n    if not unassigned or len(worker_starts) <= 1:\n        return buckets, unassigned\n\n    compact_buckets, compact_unassigned = _pack_once(\n        tasks, worker_starts, budgets, shed_access, hard_first=True\n    )\n    if len(compact_unassigned) < len(unassigned):\n        return compact_buckets, compact_unassigned\n    return buckets, unassigned\n'''
          new = '''def _insert_task(bucket, task, start, budget, shed_access):\n    \"\"\"Best feasible insertion without changing task-priority semantics.\"\"\"\n    base = len(_mandatory_queue(start, bucket, shed_access)[0])\n    time_sensitive = (\n        task.urgent or task.animal_harvest\n        or task.deadline is not None or task.immediate_drop\n        or task.must_liquidate\n    )\n    choices = []\n    for insertion in range(len(bucket) + 1):\n        candidate = bucket[:insertion] + [task] + bucket[insertion:]\n        if any(\n            _task_priority(candidate[index]) > _task_priority(candidate[index + 1])\n            for index in range(len(candidate) - 1)\n        ):\n            continue\n        projected = len(_mandatory_queue(start, candidate, shed_access)[0])\n        if projected <= budget:\n            cost = projected if time_sensitive else projected - base\n            choices.append((cost, projected, insertion, candidate))\n    if not choices:\n        return None\n    return min(choices, key=lambda item: item[:3])\n\n\ndef _repair_single_swaps(buckets, unassigned, worker_starts, budgets, shed_access):\n    \"\"\"Backtrack one greedy assignment before requesting another hand.\n\n    A failed greedy pack can be a fragmentation artifact: the pending task may\n    fit if one already-assigned task moves to another worker.  Try exactly that\n    one-task exchange while preserving every existing priority/deadline rule.\n    This does not compact urgent work or alter an already-feasible layout.\n    \"\"\"\n    buckets = [list(bucket) for bucket in buckets]\n    remaining = list(unassigned)\n    changed = True\n    while changed and remaining:\n        changed = False\n        retry = []\n        for task in remaining:\n            direct = []\n            for worker, bucket in enumerate(buckets):\n                if task.pinned_worker is not None and worker != task.pinned_worker:\n                    continue\n                choice = _insert_task(\n                    bucket, task, worker_starts[worker], budgets[worker], shed_access\n                )\n                if choice is not None:\n                    direct.append((*choice[:3], worker, choice[3]))\n            if direct:\n                _, _, _, worker, candidate = min(direct, key=lambda item: item[:4])\n                buckets[worker] = candidate\n                changed = True\n                continue\n\n            exchanges = []\n            for source, bucket in enumerate(buckets):\n                if task.pinned_worker is not None and source != task.pinned_worker:\n                    continue\n                for victim_index, victim in enumerate(bucket):\n                    if victim.pinned_worker is not None:\n                        continue\n                    reduced = bucket[:victim_index] + bucket[victim_index + 1:]\n                    incoming = _insert_task(\n                        reduced, task, worker_starts[source], budgets[source], shed_access\n                    )\n                    if incoming is None:\n                        continue\n                    for destination, other in enumerate(buckets):\n                        if destination == source:\n                            continue\n                        moved = _insert_task(\n                            other, victim, worker_starts[destination], budgets[destination], shed_access\n                        )\n                        if moved is None:\n                            continue\n                        score = (\n                            max(incoming[1], moved[1]),\n                            incoming[1] + moved[1],\n                            source, destination, victim_index,\n                        )\n                        exchanges.append((\n                            score, source, destination, incoming[3], moved[3]\n                        ))\n            if exchanges:\n                _, source, destination, source_bucket, destination_bucket = min(\n                    exchanges, key=lambda item: item[0]\n                )\n                buckets[source] = source_bucket\n                buckets[destination] = destination_bucket\n                changed = True\n            else:\n                retry.append(task)\n        remaining = retry\n    return buckets, remaining\n\n\ndef _pack(tasks, worker_starts, budgets, shed_access=SHED_ACCESS):\n    \"\"\"Pack mandatory work, then repair one greedy assignment if needed.\"\"\"\n    candidates = []\n    for hard_first in (False, True):\n        buckets, unassigned = _pack_once(\n            tasks, worker_starts, budgets, shed_access, hard_first=hard_first\n        )\n        candidates.append((buckets, unassigned))\n        if not unassigned and not hard_first:\n            return buckets, unassigned\n\n    best_buckets, best_unassigned = min(\n        candidates, key=lambda item: len(item[1])\n    )\n    if not best_unassigned or len(worker_starts) <= 1:\n        return best_buckets, best_unassigned\n\n    for buckets, unassigned in candidates:\n        repaired, remaining = _repair_single_swaps(\n            buckets, unassigned, worker_starts, budgets, shed_access\n        )\n        if len(remaining) < len(best_unassigned):\n            best_buckets, best_unassigned = repaired, remaining\n        if not best_unassigned:\n            break\n    return best_buckets, best_unassigned\n'''
          if old not in text:
              raise SystemExit('old pack block not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Find deterministic improvement
        run: |
          PYTHONPATH=. python - <<'PY'
          import random
          from agents.farm_tasks import Task
          from agents.scheduler import _pack, _pack_once

          def legacy(tasks, starts, budgets):
              buckets, unassigned = _pack_once(tasks, starts, budgets, ((4,4),(5,4),(4,5),(5,5)), False)
              if not unassigned or len(starts) <= 1:
                  return buckets, unassigned
              other_buckets, other_unassigned = _pack_once(tasks, starts, budgets, ((4,4),(5,4),(4,5),(5,5)), True)
              if len(other_unassigned) < len(unassigned):
                  return other_buckets, other_unassigned
              return buckets, unassigned

          rng = random.Random(20260912)
          found = None
          for case in range(1200):
              worker_count = rng.choice((2, 3))
              starts = [(4,4), (5,4), (4,5)][:worker_count]
              budgets = [rng.choice((10,11,12,13,14)) for _ in starts]
              tasks = []
              for _ in range(rng.randint(6, 11)):
                  p = (rng.randrange(5), rng.randrange(5))
                  n = rng.randint(1, 4)
                  tasks.append(Task(p, [['WATER']] * n, urgent=rng.random() < 0.35))
              _, old_missing = legacy(tasks, starts, budgets)
              _, new_missing = _pack(tasks, starts, budgets)
              if len(new_missing) < len(old_missing):
                  found = (case, starts, budgets, tasks, len(old_missing), len(new_missing))
                  break
          assert found is not None, 'one-swap repair found no improvement'
          case, starts, budgets, tasks, old_n, new_n = found
          print('CASE', case, 'starts=', starts, 'budgets=', budgets, 'old_missing=', old_n, 'new_missing=', new_n)
          for task in tasks:
              print('TASK', task.position, len(task.actions), 'urgent=', task.urgent)
          PY
      - name: Full route-sensitive regressions
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_agents_scheduler.py \
            tests/test_agents_capacity_guard.py \
            tests/test_agents_opening_cash_priority.py \
            tests/test_agents_opening_book.py \
            tests/test_survival_debt_regression.py \
            tests/test_agents_intraday.py \
            tests/test_agents_affordable_production.py \
            tests/test_agents_melon_opening.py
