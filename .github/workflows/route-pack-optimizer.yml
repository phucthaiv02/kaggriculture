name: Route pack optimizer
on:
  push:
    branches: [feat/planner-capacity-v4]
    paths: [.github/workflows/route-pack-optimizer.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install kaggle-environments==1.32.7 pytest
      - name: Apply one-shot bridge labor
        run: |
          python - <<'PY'
          from pathlib import Path

          agent = Path('agents/expansion_agent.py')
          text = agent.read_text()

          old_land = '''def _land_orders(obs, farm, pending_sales=()):\n    if not should_buy_land_on_schedule(obs, farm):\n        return []\n    shed = Counter(obs[\"private\"][\"shed\"])\n    sales = [order for order in pending_sales if order[0] == \"SELL\"]\n    for _op, item, quantity in sales:\n        shed[item] = max(0, shed.get(item, 0) - int(quantity))\n    carried = obs[\"private\"].get(\"inventories\", [])\n    if any(inv.get(item, 0) > 0 for inv in carried for item in SELLABLE if item != \"WHEAT\"):\n        return []\n    if any(shed.get(item, 0) > 0 for item in SELLABLE if item != \"WHEAT\"):\n        return []\n    price = LAND_PRICES[len(farm[\"unlocked_quadrants\"]) - 1]\n    cash = farm[\"money\"]\n    if cash < price and sales:\n        cash += _sale_revenue(obs, sales)\n    return [[\"BUY_LAND\"]] if cash >= price else []\n'''
          new_land = '''def _land_orders(obs, farm, pending_sales=()):\n    \"\"\"Buy scheduled land as soon as real cash can fund it.\n\n    Goods still carried by workers remain future revenue, but they are not a\n    prerequisite for an already-funded expansion. SELL orders earlier in this\n    same market pass may finish funding the purchase; unsold inventory does not\n    count as imaginary cash.\n    \"\"\"\n    if not should_buy_land_on_schedule(obs, farm):\n        return []\n    price = LAND_PRICES[len(farm[\"unlocked_quadrants\"]) - 1]\n    cash = farm[\"money\"]\n    sales = [order for order in pending_sales if order[0] == \"SELL\"]\n    if cash < price and sales:\n        cash += _sale_revenue(obs, sales)\n    return [[\"BUY_LAND\"]] if cash >= price else []\n'''
          if old_land not in text:
              raise SystemExit('land-order block not found')
          text = text.replace(old_land, new_land)

          floor = '''            if should_buy_land_on_schedule(obs, farm):\n                hand_count = max(hand_count, 10)\n'''
          if floor not in text:
              raise SystemExit('forced hand floor not found')
          text = text.replace(floor, '')

          state_old = '''        \"deferred_expansion_positions\": set(),\n        \"protective_debt_positions\": set(),\n    }'''
          state_new = '''        \"deferred_expansion_positions\": set(),\n        \"protective_debt_positions\": set(),\n        \"intraday_expansion_day\": -1,\n        \"intraday_expansion_positions\": set(),\n        \"intraday_bridge_complete_day\": -1,\n    }'''
          if state_old not in text:
              raise SystemExit('state block not found')
          text = text.replace(state_old, state_new)

          detect_old = '''        if hour > 0 and any(position not in targets for position in _active_positions(farm)):\n            positions = _active_positions(farm)\n            state[\"opening_active\"] = opening_governs(obs, targets, positions)\n            plan_targets(\n                obs, targets,\n                positions if not state[\"opening_active\"] else [p for p in positions if p not in targets],\n                effective_end, planner_version,\n            )\n'''
          detect_new = '''        if hour > 0 and any(position not in targets for position in _active_positions(farm)):\n            positions = _active_positions(farm)\n            new_positions = {position for position in positions if position not in targets}\n            if state[\"intraday_expansion_day\"] != day:\n                state[\"intraday_expansion_day\"] = day\n                state[\"intraday_expansion_positions\"] = set(new_positions)\n                state[\"intraday_bridge_complete_day\"] = -1\n            else:\n                state[\"intraday_expansion_positions\"].update(new_positions)\n            state[\"opening_active\"] = opening_governs(obs, targets, positions)\n            plan_targets(\n                obs, targets,\n                positions if not state[\"opening_active\"] else [p for p in positions if p not in targets],\n                effective_end, planner_version,\n            )\n'''
          if detect_old not in text:
              raise SystemExit('land detection block not found')
          text = text.replace(detect_old, detect_new)

          call_old = '''        purchase_targets, expansion_hires = schedule_open_tiles(\n            obs, targets, state[\"plans\"], _open_shed_access(farm), hire_costs,\n        )'''
          call_new = '''        bridge_pending = (\n            state[\"intraday_expansion_day\"] == day\n            and state[\"intraday_bridge_complete_day\"] != day\n        )\n        expansion_hire_costs = (\n            hire_costs\n            if state[\"intraday_expansion_day\"] != day or bridge_pending\n            else []\n        )\n        purchase_targets, expansion_hires = schedule_open_tiles(\n            obs, targets, state[\"plans\"], _open_shed_access(farm),\n            expansion_hire_costs, minimum_new_production=bridge_pending,\n        )\n        if bridge_pending and any(\n            position in purchase_targets\n            for position in state[\"intraday_expansion_positions\"]\n        ):\n            state[\"intraday_bridge_complete_day\"] = day'''
          if call_old not in text:
              raise SystemExit('schedule_open_tiles call not found')
          text = text.replace(call_old, call_new)
          agent.write_text(text)

          intraday = Path('agents/intraday.py')
          text = intraday.read_text()
          sig_old = '''def schedule_open_tiles(obs, targets, plans, shed_access, hire_costs=()):'''
          sig_new = '''def schedule_open_tiles(\n    obs, targets, plans, shed_access, hire_costs=(), minimum_new_production=False,\n):'''
          if sig_old not in text:
              raise SystemExit('schedule_open_tiles signature not found')
          text = text.replace(sig_old, sig_new)

          score_old = '''        score = len(funded) - len(unfitted)\n        if score > best_funded:\n            selected, hire_count, best_funded = candidate, count, score\n            rejected_funded = {id(task) for task in unfitted}\n            funded_positions = {task.position for task in funded if id(task) not in rejected_funded}\n        if not rejected:\n            break\n    eligible.update(selected)'''
          score_new = '''        score = len(funded) - len(unfitted)\n        if score > best_funded:\n            selected, hire_count, best_funded = candidate, count, score\n            rejected_funded = {id(task) for task in unfitted}\n            funded_positions = {task.position for task in funded if id(task) not in rejected_funded}\n        if minimum_new_production and score > 0:\n            # Counts are considered from zero upward. Stop at the first\n            # workforce that can fund and route at least one new producer,\n            # and purchase only inputs for production that actually fits.\n            selected = {position: candidate[position] for position in funded_positions}\n            hire_count = count\n            break\n        if not rejected:\n            break\n    if minimum_new_production and best_funded <= 0:\n        selected, hire_count = {}, 0\n    eligible.update(selected)'''
          if score_old not in text:
              raise SystemExit('funded-score block not found')
          intraday.write_text(text.replace(score_old, score_new))

          tests = Path('tests/test_agents_opening_book.py')
          text = tests.read_text()
          old_test = '''def test_land_waits_for_liquidation_and_cash():\n    from agents.expansion_agent import _land_orders\n    obs = make_obs(6)\n    farm = obs[\"farms\"][0]\n    farm[\"money\"] = 100000\n    obs[\"private\"] = {\"shed\": {\"WHEAT\": 100, \"MILK\": 1}, \"inventories\": [{}]}\n    assert _land_orders(obs, farm) == []\n    obs[\"private\"][\"shed\"].pop(\"MILK\")\n    obs[\"private\"][\"inventories\"] = [{\"FERTILIZER\": 1}]\n    assert _land_orders(obs, farm) == []\n    obs[\"private\"][\"inventories\"] = [{}]\n    assert _land_orders(obs, farm) == [[\"BUY_LAND\"]]\n    farm[\"money\"] = 0\n    assert _land_orders(obs, farm) == []\n'''
          new_test = '''def test_land_buys_once_funded_without_waiting_for_all_liquidation():\n    from agents.expansion_agent import _land_orders\n    obs = make_obs(6)\n    farm = obs[\"farms\"][0]\n    obs[\"private\"] = {\n        \"shed\": {\"WHEAT\": 100, \"MILK\": 1},\n        \"inventories\": [{\"FERTILIZER\": 1}],\n    }\n    farm[\"money\"] = 1000\n    assert _land_orders(obs, farm) == [[\"BUY_LAND\"]]\n    obs[\"market\"] = {\"inventory\": {\"FERTILIZER\": 10000}, \"params\": None}\n    farm[\"money\"] = 900\n    assert _land_orders(obs, farm, [[\"SELL\", \"FERTILIZER\", 2]]) == [[\"BUY_LAND\"]]\n    farm[\"money\"] = 0\n    assert _land_orders(obs, farm) == []\n'''
          if old_test not in text:
              raise SystemExit('old land regression not found')
          tests.write_text(text.replace(old_test, new_test))
          PY
      - name: Route and expansion regressions
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_agents_scheduler.py \
            tests/test_agents_capacity_guard.py \
            tests/test_agents_opening_cash_priority.py \
            tests/test_agents_opening_book.py \
            tests/test_survival_debt_regression.py \
            tests/test_agents_intraday.py \
            tests/test_agents_affordable_production.py \
            tests/test_agents_melon_opening.py
      - name: Verify one-shot bridge labor
        run: |
          PYTHONPATH=. python - <<'PY'
          from kaggle_environments import make
          from agents.expansion_agent import make_agent

          results = {}
          for version in ('classic', 'melon_v2'):
              env = make('kaggriculture', configuration={
                  'seed': 1, 'weedSpawnChance': 0.0, 'episodeSteps': 169,
              }, debug=False)
              agent = make_agent(opening_version=version)
              env.run([lambda obs: agent(obs), lambda obs: {'farmer': ['PASS'], 'market': []}])
              day6 = [frame[0] for frame in env.steps if frame[0].observation.day == 6]
              max_hands = max(len(frame.observation.farms[0].hands) for frame in day6)
              hire_hours = [
                  (frame.observation.hour, sum(order == ['HIRE'] for order in (frame.action or {}).get('market', [])))
                  for frame in day6
                  if any(order == ['HIRE'] for order in (frame.action or {}).get('market', []))
              ]
              buy_hours = [
                  frame.observation.hour for frame in day6
                  if any(order and order[0] == 'BUY_LAND' for order in (frame.action or {}).get('market', []))
              ]
              final = env.steps[-1][0].observation.farms[0]
              ne_prod = sum(
                  isinstance(final.tiles[y][x], dict)
                  and bool(final.tiles[y][x].get('crop') or final.tiles[y][x].get('animal'))
                  for y in range(5) for x in range(5, 10)
              )
              results[version] = (max_hands, buy_hours, ne_prod, hire_hours)
              print(version, 'max_day7_hands=', max_hands, 'buy_hours=', buy_hours,
                    'ne_prod=', ne_prod, 'hire_hours=', hire_hours)
              assert buy_hours and ne_prod > 0
          assert results['classic'][0] < 10, results['classic']
          print('classic_hands_saved_vs_old_floor=', 10 - results['classic'][0])
          PY
      - name: Commit validated bridge labor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agents/expansion_agent.py agents/intraday.py tests/test_agents_opening_book.py
          git commit -m 'optimize: hire minimum bridge labor for expansion'
          git push
