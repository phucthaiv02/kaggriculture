name: Concentration Penalty Sweep

on:
  workflow_dispatch:
  push:
    branches:
      - feat/planner-capacity-v4
    paths:
      - .github/workflows/concentration-penalty-sweep.yml
      - experiments/sweep_concentration.py
      - agents/planner.py
      - agents/expansion_agent.py
      - agents/scheduler.py

jobs:
  multi-seed-vs-a:
    name: seed-${{ matrix.seed }} penalty-${{ matrix.penalty }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        seed: [0, 1, 7, 42]
        penalty: [0, 0.0005, 0.001, 0.002]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7'
      - name: Run match vs A
        run: >-
          python -m experiments.sweep_concentration
          --opponent public/A.ipynb
          --seeds ${{ matrix.seed }}
          --penalties ${{ matrix.penalty }}
