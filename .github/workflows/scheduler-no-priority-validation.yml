name: Validate scheduler without action priorities

on:
  push:
    branches: [agent-v3]
    paths:
      - .github/workflows/scheduler-no-priority-validation.yml
      - experiments/_validate_scheduler_no_priority.py

permissions:
  contents: read

env:
  PATCH_BASE_COMMIT: 9c81e171a80ce495491776649ce8a2f755bfb3ca
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply no-priority scheduler in runner only
        run: |
          git show "$PATCH_BASE_COMMIT:agents/scheduler.py" > agents/scheduler.py
          python experiments/_validate_scheduler_no_priority.py
          python -m py_compile agents/scheduler.py
          git diff --check
          ! grep -q 'def _priority' agents/scheduler.py
          ! grep -q 'def _rescue_priority' agents/scheduler.py
          ! grep -q 'group_animal' agents/scheduler.py
          ! grep -q 'planting and harvest are not delayed' agents/scheduler.py
          git diff -- agents/scheduler.py
      - name: Install test/runtime dependencies
        run: python -m pip install pytest kaggle-environments
      - name: Run architecture-focused scheduler tests
        run: |
          pytest -q \
            tests/test_agents_scheduler.py::test_route_manhattan_step_counts \
            tests/test_agents_scheduler.py::test_tasks_are_actioned_near_to_far_even_if_far_task_is_given_first \
            tests/test_agents_scheduler.py::test_packing_counts_pickup_steps_and_uses_spare_hand_capacity \
            tests/test_agents_scheduler.py::test_hands_needed_scales_up_for_heavy_workload \
            tests/test_agents_scheduler.py::test_nearby_tasks_share_worker_to_reduce_total_travel \
            tests/test_agents_value_aware.py::test_optional_work_does_not_buy_an_expensive_hand \
            tests/test_agents_value_aware.py::test_mandatory_work_can_justify_cost_above_sale_value \
            tests/test_agents_value_aware.py::test_optional_values_are_combined_and_existing_workers_are_sunk_cost \
            tests/test_agents_value_aware.py::test_terminal_packing_prefers_valuable_recovery \
            tests/test_agents_value_aware.py::test_unreachable_mandatory_task_does_not_force_sixteen_hires
          python - <<'PY'
          from agents.farm_tasks import Task
          from agents.scheduler import build_queues, hands_needed

          # Mandatory is an inclusion constraint, not an execution priority.
          required = Task((0, 0), [['WATER']] * 14, mandatory=True)
          optional = Task((4, 4), [['HARVEST']] * 9, mandatory=False, value=999)
          plans, missing = build_queues([optional, required], (4, 4), 0)
          assert required not in missing
          assert optional in missing

          # Changing action labels must not create a hidden action-class order.
          near_feed = Task((4, 3), [['FEED']], mandatory=True)
          far_harvest = Task((0, 0), [['HARVEST']], mandatory=True, animal_harvest=True)
          plans, missing = build_queues([far_harvest, near_feed], (4, 4), 0)
          assert not missing
          assert plans[0].queue.index(['FEED']) < plans[0].queue.index(['HARVEST'])

          # Cheap extra labor is admitted only when optional value pays for it.
          full = Task((4, 4), [['WATER']] * 23, mandatory=True)
          extra = Task((4, 4), [['COLLECT_FERTILIZER']], mandatory=False, value=10)
          assert hands_needed([full, extra], (4, 4), max_hands=1, marginal_hire_costs=[9]) == (1, [])
          assert hands_needed([full, extra], (4, 4), max_hands=1, marginal_hire_costs=[11]) == (0, [extra])
          PY
      - name: Replay candidate and animal-fixed base against A
        run: |
          mkdir -p validation/candidate validation/base
          /usr/bin/time -f '%e' -o validation/candidate_seconds.txt \
            timeout 300s python -m experiments.play_match --opponent public/A.ipynb --seed 1 --output-dir validation/candidate
          git worktree add --detach "$RUNNER_TEMP/animal-base" "$PATCH_BASE_COMMIT"
          /usr/bin/time -f '%e' -o validation/base_seconds.txt \
            bash -lc 'cd "$0" && timeout 300s python -m experiments.play_match --opponent "$1/public/A.ipynb" --seed 1 --output-dir "$1/validation/base"' "$RUNNER_TEMP/animal-base" "$GITHUB_WORKSPACE"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('validation')
          cdir = sorted((root/'candidate').glob('current_vs_A_seed1_*'))[-1]
          bdir = sorted((root/'base').glob('current_vs_A_seed1_*'))[-1]
          C = json.loads((cdir/'result.json').read_text())
          B = json.loads((bdir/'result.json').read_text())
          out = {
              'candidate_cash': C['current_cash'],
              'base_cash': B['current_cash'],
              'delta': C['current_cash'] - B['current_cash'],
              'candidate_statuses': C['statuses'],
              'base_statuses': B['statuses'],
              'candidate_seconds': float((root/'candidate_seconds.txt').read_text()),
              'base_seconds': float((root/'base_seconds.txt').read_text()),
          }
          print(json.dumps(out, indent=2))
          (root/'comparison.json').write_text(json.dumps(out, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduler-no-priority-${{ github.sha }}
          path: validation
          if-no-files-found: warn
