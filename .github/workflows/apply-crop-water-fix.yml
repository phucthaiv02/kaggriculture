name: Apply Crop Water Priority Fix

on:
  push:
    branches: [feat/planner-capacity-v4]
    paths: [.github/workflows/apply-crop-water-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/planner-capacity-v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply crop protection priority
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('agents/scheduler.py')
          text = path.read_text()
          old = '''        key=lambda task: (\n            not task.urgent,\n            not task.animal_harvest,\n'''
          new = '''        key=lambda task: (\n            not task.urgent,\n            not any(action and action[0] == "WATER" for action in _mandatory_actions(task)),\n            not task.animal_harvest,\n'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''                priority = lambda queued: (\n                    not queued.urgent,\n                    not queued.animal_harvest,\n'''
          new = '''                priority = lambda queued: (\n                    not queued.urgent,\n                    not any(action and action[0] == "WATER" for action in _mandatory_actions(queued)),\n                    not queued.animal_harvest,\n'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('tests/test_agents_scheduler.py')
          text = path.read_text()
          marker = '\n\nif __name__ == "__main__":\n'
          assert marker in text
          test = '''\n\ndef test_urgent_crop_water_outranks_other_urgent_work_when_capacity_is_tight():\n    water = Task(SHED, [["WATER"]], urgent=True)\n    feed = Task(SHED, [["FEED"]], needs=Counter({"WHEAT": 1}), urgent=True)\n    plans, unassigned = build_queues(\n        [feed, water], farmer_start=SHED, hand_count=0, existing_hand_budget=1\n    )\n    assert plans[0].queue == [["WATER"]]\n    assert unassigned == [feed]\n'''
          text = text.replace(marker, test + marker, 1)
          path.write_text(text)
          Path('.github/workflows/apply-crop-water-fix.yml').unlink()
          PY
      - name: Install engine and tests
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7' pytest
      - name: Focused tests
        run: python -m pytest -q tests/test_agents_scheduler.py tests/test_agents_farm_tasks.py tests/test_agents_intraday.py tests/test_agents_harvest_priority.py tests/test_agents_planner_daily.py tests/test_agents_opening_book.py
      - name: Five-seed crop health
        run: |
          python - <<'PY'
          import json
          from kaggle_environments import make
          from agents.expansion_agent import make_agent
          from agents.farm_tasks import build_tasks
          from experiments.crop_schedules import pass_agent
          from experiments.play_match import configuration, END_DAY
          weeds_all, pending_all, rewards = [], [], []
          for seed in (1,2,3,4,5):
              agent = make_agent(END_DAY - 1, seed=seed)
              pending = [0]
              def monitored(obs):
                  action = agent(obs)
                  if int(obs.hour) == 23:
                      cells = dict(zip(agent.__code__.co_freevars, agent.__closure__ or ()))
                      targets = cells['targets'].cell_contents
                      tasks = build_tasks(dict(obs, _planning_end_day=END_DAY - 1), targets)
                      pending[0] += sum(any(op and op[0] == 'WATER' for op in t.actions) for t in tasks)
                  return action
              env = make('kaggriculture', configuration=configuration(seed), debug=False)
              env.run([monitored, pass_agent])
              tiles = env.steps[-1][0].observation.farms[0].tiles
              weeds = sum(isinstance(t, dict) and t.get('kind') == 'WEED' for row in tiles for t in row)
              reward = float(env.steps[-1][0].reward)
              weeds_all.append(weeds); pending_all.append(pending[0]); rewards.append(reward)
              print('CROP_HEALTH ' + json.dumps({'seed':seed,'weeds':weeds,'pending_h23':pending[0],'reward':reward}), flush=True)
          avg = sum(weeds_all)/5
          print('CROP_SUMMARY ' + json.dumps({'weeds':weeds_all,'mean_weeds':avg,'pending_h23':pending_all,'rewards':rewards}), flush=True)
          if avg >= 21.4:
              raise SystemExit(f'no improvement: mean weeds {avg}')
          PY
      - name: Commit proven fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agents/scheduler.py tests/test_agents_scheduler.py .github/workflows/apply-crop-water-fix.yml
          git commit -m 'fix: prioritize urgent crop watering under capacity'
          git push origin HEAD:feat/planner-capacity-v4
