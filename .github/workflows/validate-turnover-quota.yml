name: Validate turnover cohort planning

on:
  push:
    branches: [agent-v3-turnover-watering-fix]
    paths:
      - .github/workflows/validate-turnover-quota.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply cohort patch
        run: |
          python .ci/apply_turnover_quota_patch.py
          python -m py_compile agents/planner.py tests/test_agents_planner.py
          git diff --check
      - name: Install runtime
        run: python -m pip install --upgrade kaggle-environments pytest
      - name: Run planner regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q tests/test_agents_planner.py tests/test_agents_turnover_watering.py tests/test_agents_farm_tasks.py
      - name: Commit validated files to temp branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-turnover-quota.yml .ci/apply_turnover_quota_patch.py
          git add agents/planner.py tests/test_agents_planner.py
          git commit -m "fix: exempt due turnover from target batch cap"
          git push origin HEAD:agent-v3-turnover-watering-fix
