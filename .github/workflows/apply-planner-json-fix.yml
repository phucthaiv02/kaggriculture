name: Apply planner fertilizer JSON serialization fix

on:
  push:
    branches: [agent-v3]
    paths:
      - .github/workflows/apply-planner-json-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-v3
      - name: Patch play_match JSON serialization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('experiments/play_match.py')
          text = path.read_text()

          old = 'from agents.expansion_agent import make_agent\n'
          new = 'from agents.expansion_agent import make_agent\nfrom agents.fertilizer import FertilizerPlan, plan_json\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          marker = 'def _planner_report(decisions):\n'
          helper = '''def _planner_json_default(value):\n    \"\"\"Serialize planner-only value objects without weakening JSON errors.\"\"\"\n    if isinstance(value, FertilizerPlan):\n        return plan_json(value)\n    raise TypeError(\n        f\"Object of type {value.__class__.__name__} is not JSON serializable\"\n    )\n\n\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, helper + marker, 1)

          old_report = 'payload = json.dumps(decisions, ensure_ascii=False).replace("</", "<\\\\/")'
          new_report = 'payload = json.dumps(\n        decisions, ensure_ascii=False, default=_planner_json_default\n    ).replace("</", "<\\\\/")'
          assert text.count(old_report) == 1
          text = text.replace(old_report, new_report, 1)

          old_log = 'json.dumps(planner_decisions, indent=2), encoding="utf-8",'
          new_log = 'json.dumps(\n            planner_decisions, indent=2, default=_planner_json_default\n        ), encoding="utf-8",'
          assert text.count(old_log) == 1
          text = text.replace(old_log, new_log, 1)

          path.write_text(text)
          PY
          python -m py_compile experiments/play_match.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/play_match.py
          git commit -m "fix: serialize fertilizer plans in planner replay logs"
          git push origin HEAD:agent-v3
