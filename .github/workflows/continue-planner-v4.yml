name: Continue Planner Capacity V4
on:
  push:
    branches: [feat/planner-capacity-v4]
permissions:
  contents: write
jobs:
  land-fix:
    if: github.event.head_commit.message != 'fix: finish day-seven land expansion'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7' pytest
      - name: Apply validated fix
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('agents/expansion_agent.py')
          s = p.read_text()
          old = '''def _land_orders(obs, farm):
              if not should_buy_land_on_schedule(obs, farm):
                  return []
              inventories = [obs["private"]["shed"], *obs["private"].get("inventories", [])]
              if any(inv.get(item, 0) > 0 for inv in inventories for item in SELLABLE if item != "WHEAT"):
                  return []
              price = LAND_PRICES[len(farm["unlocked_quadrants"]) - 1]
              return [["BUY_LAND"]] if farm["money"] >= price else []
          '''
          new = '''def _land_orders(obs, farm, pending_sales=()):
              if not should_buy_land_on_schedule(obs, farm):
                  return []
              shed = Counter(obs["private"]["shed"])
              sales = [order for order in pending_sales if order[0] == "SELL"]
              for _op, item, quantity in sales:
                  shed[item] = max(0, shed.get(item, 0) - int(quantity))
              carried = obs["private"].get("inventories", [])
              if any(inv.get(item, 0) > 0 for inv in carried for item in SELLABLE if item != "WHEAT"):
                  return []
              if any(shed.get(item, 0) > 0 for item in SELLABLE if item != "WHEAT"):
                  return []
              price = LAND_PRICES[len(farm["unlocked_quadrants"]) - 1]
              cash = farm["money"]
              if cash < price and sales:
                  cash += _sale_revenue(obs, sales)
              return [["BUY_LAND"]] if cash >= price else []
          '''
          if old in s:
              s = s.replace(old, new)
          assert 'def _land_orders(obs, farm, pending_sales=()):' in s
          s = s.replace(
              'orders = _land_orders(obs, farm) + feed + hire_orders',
              'orders = _land_orders(obs, farm, pending_sales) + feed + hire_orders',
          )
          s = s.replace(
              '                + _land_orders(obs, farm)\n',
              '                + _land_orders(obs, farm, sales)\n',
          )
          needle = '            missing_hands = max(0, hand_count - len(existing_hands))\n'
          boost = '            if should_buy_land_on_schedule(obs, farm):\n                hand_count = max(hand_count, 10)\n'
          if boost not in s:
              assert needle in s
              s = s.replace(needle, boost + needle, 1)
          p.write_text(s)

          p = Path('tests/test_survival_debt_regression.py')
          s = p.read_text()
          old = '''    # Earlier in the day the conservative reserve may still be built, after
              # morning labor sizing/hiring has already claimed its cash.
              earlier = _obs(day=7, hour=22, tiles=tiles, shed={"WHEAT": 4})
              assert feed_wheat_order(earlier, targets, list(positions))
          '''
          new = '''    # Future feed is never stockpiled; buy only feed due today.
              earlier = _obs(day=7, hour=22, tiles=tiles, shed={"WHEAT": 4})
              assert feed_wheat_order(earlier, targets, list(positions)) == []
          '''
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Focused regression suite
        run: python -m pytest -q tests/test_agents_opening_book.py tests/test_agents_opening_cash_priority.py tests/test_agents_affordable_production.py tests/test_agents_melon_opening.py tests/test_survival_debt_regression.py
      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agents/expansion_agent.py tests/test_survival_debt_regression.py
          git commit -m 'fix: finish day-seven land expansion'
          git push origin HEAD:feat/planner-capacity-v4
