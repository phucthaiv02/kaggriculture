name: Profile replay day24 planner

on:
  push:
    branches: [agent-v3-timeout-fix-v2]
    paths:
      - .github/workflows/profile-replay-day24.yml

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Profile actual replay observation
        run: |
          python -m pip install -q 'kaggle-environments==1.32.7'
          git fetch origin agent-v3
          git checkout --detach origin/agent-v3
          python - <<'PY'
          import base64, cProfile, gzip, io, json, pstats, time
          from agents import planner
          from agents.forecast import MarketForecast, _cached_production_snapshot

          PAYLOAD = ''
          obs = json.loads(gzip.decompress(base64.b64decode(PAYLOAD)))
          farm = obs['farms'][obs['player']]
          active, targets = [], {}
          physical = empty = 0
          for y, row in enumerate(farm['tiles']):
              for x, tile in enumerate(row):
                  if tile == 'LOCKED':
                      continue
                  pos = (x, y)
                  active.append(pos)
                  if isinstance(tile, dict):
                      name = tile.get('animal') or (tile.get('crop') if tile.get('kind') == 'PLANT' else None)
                      if name:
                          targets[pos] = (name, False)
                          physical += 1
                      elif tile.get('kind') not in ('COOP', 'PASTURE'):
                          empty += 1
                  elif tile is None:
                      empty += 1

          original_mv = MarketForecast.marginal_value
          mv_calls = 0
          mv_seconds = 0.0
          def timed_mv(self, *args, **kwargs):
              global mv_calls, mv_seconds
              t0 = time.perf_counter()
              try:
                  return original_mv(self, *args, **kwargs)
              finally:
                  mv_calls += 1
                  mv_seconds += time.perf_counter() - t0
          MarketForecast.marginal_value = timed_mv

          def run(max_positions, prof=False):
              global mv_calls, mv_seconds
              local_targets = dict(targets)
              mv_calls = 0
              mv_seconds = 0.0
              _cached_production_snapshot.cache_clear()
              p = cProfile.Profile()
              t0 = time.perf_counter()
              if prof:
                  p.enable()
              pending = planner.plan_targets(
                  obs, local_targets, active, 29,
                  max_positions=max_positions,
                  replan_positions=set(active),
              )
              if prof:
                  p.disable()
              elapsed = time.perf_counter() - t0
              print(f'RUN max_positions={max_positions} elapsed={elapsed:.6f}s mv_calls={mv_calls} mv_seconds={mv_seconds:.6f}s pending={len(pending)} cache={_cached_production_snapshot.cache_info()}')
              if prof:
                  s = io.StringIO()
                  pstats.Stats(p, stream=s).strip_dirs().sort_stats('cumtime').print_stats(45)
                  print(s.getvalue())
              return elapsed

          print(f"OBS day={obs['day']} hour={obs['hour']} active={len(active)} physical={physical} empty={empty}")
          run(0)
          run(1)
          run(10, prof=True)
          PY
