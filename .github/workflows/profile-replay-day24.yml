name: Profile full agent runtime

on:
  push:
    branches: [agent-v3-timeout-fix-v2]
    paths:
      - .github/workflows/profile-replay-day24.yml

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run timed full matches
        run: |
          python -m pip install -q 'kaggle-environments==1.32.7'
          git fetch origin agent-v3
          git checkout --detach origin/agent-v3
          python - <<'PY'
          import statistics
          import time
          from kaggle_environments import make
          from agents.expansion_agent import make_agent
          from experiments.crop_schedules import pass_agent
          from experiments.play_match import configuration

          all_morning = []
          for seed in (1, 2, 3):
              agent = make_agent(30, seed=seed)
              records = []
              def timed(obs):
                  start = time.perf_counter()
                  action = agent(obs)
                  elapsed = time.perf_counter() - start
                  records.append((int(obs['day']), int(obs['hour']), elapsed))
                  return action

              env = make('kaggriculture', configuration=configuration(seed), debug=False)
              env.run([timed, pass_agent])
              morning = [(day, elapsed) for day, hour, elapsed in records if hour == 0]
              all_morning.extend((seed, day, elapsed) for day, elapsed in morning)
              top = sorted(morning, key=lambda row: row[1], reverse=True)[:8]
              p95 = sorted(elapsed for _, elapsed in morning)[max(0, int(len(morning) * 0.95) - 1)]
              print(f'SEED {seed}: calls={len(records)} morning={len(morning)} max={max(e for _,e in morning):.6f}s p95={p95:.6f}s mean={statistics.mean(e for _,e in morning):.6f}s')
              print('  top morning:', ', '.join(f'd{day}={elapsed:.6f}s' for day, elapsed in top))
              slow_all = [(day, hour, elapsed) for day, hour, elapsed in records if elapsed >= 0.5]
              print(f'  calls>=0.5s: {slow_all}')

          top = sorted(all_morning, key=lambda row: row[2], reverse=True)[:15]
          print('GLOBAL TOP:', ', '.join(f's{seed}/d{day}={elapsed:.6f}s' for seed, day, elapsed in top))
          print(f'GLOBAL morning >=0.8s: {sum(e >= 0.8 for _,_,e in all_morning)}; >=1.0s: {sum(e >= 1.0 for _,_,e in all_morning)}')
          PY
