name: Profile replay day24 planner

on:
  push:
    branches: [agent-v3-timeout-fix-v2]
    paths:
      - .github/workflows/profile-replay-day24.yml

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Profile actual replay observation
        run: |
          python -m pip install -q 'kaggle-environments==1.32.7'
          git fetch origin agent-v3
          git checkout --detach origin/agent-v3
          python - <<'PY'
          import base64, cProfile, gzip, io, json, pstats, time
          from agents import planner
          import agents.expansion_agent as ea
          from agents.forecast import MarketForecast, _cached_production_snapshot
          from agents.scheduler import MAX_HANDS, hands_needed

          PAYLOAD = ''
          obs = json.loads(gzip.decompress(base64.b64decode(PAYLOAD)))
          farm = obs['farms'][obs['player']]
          active, targets = [], {}
          for y, row in enumerate(farm['tiles']):
              for x, tile in enumerate(row):
                  if tile == 'LOCKED':
                      continue
                  pos = (x, y)
                  active.append(pos)
                  if isinstance(tile, dict):
                      name = tile.get('animal') or (tile.get('crop') if tile.get('kind') == 'PLANT' else None)
                      if name:
                          targets[pos] = (name, False)

          _cached_production_snapshot.cache_clear()
          t0 = time.perf_counter()
          pending = planner.plan_targets(
              obs, targets, active, 29,
              max_positions=10,
              replan_positions=set(active),
          )
          print(f'plan_targets={time.perf_counter()-t0:.6f}s pending={len(pending)} targets={sum(v is not None for v in targets.values())}')

          # Approximate the morning admission state conservatively: include all
          # physical producers plus every choice just made for an empty tile.
          daily_targets = {p: t for p, t in targets.items() if t is not None}
          t0 = time.perf_counter()
          tasks = ea.build_tasks(
              obs, daily_targets,
              assume_crop_seeds=True,
              assume_animal_inputs=True,
              prioritize_fertilizer_drop=False,
          )
          build_time = time.perf_counter() - t0
          mandatory = [task for task in tasks if task.mandatory is not False]
          optional = [task for task in tasks if task.mandatory is False]
          print(f'build_tasks={build_time:.6f}s tasks={len(tasks)} mandatory={len(mandatory)} optional={len(optional)} actions={sum(len(t.actions) for t in tasks)}')

          starts = tuple(map(tuple, farm['hands']))
          shed = ea._open_shed_access(farm)
          marginal = [
              ea._hire_costs(farm, n + 1) - ea._hire_costs(farm, n)
              for n in range(MAX_HANDS - len(farm['hands']))
          ]

          def profile_hands(label, work, costs):
              p = cProfile.Profile()
              t0 = time.perf_counter()
              p.enable()
              result = hands_needed(
                  work, tuple(farm['farmer']), starts, shed,
                  marginal_hire_costs=costs,
              )
              p.disable()
              elapsed = time.perf_counter() - t0
              print(f'{label}={elapsed:.6f}s hand_target={result[0]} rejected={len(result[1])}')
              s = io.StringIO()
              pstats.Stats(p, stream=s).strip_dirs().sort_stats('cumtime').print_stats(35)
              print(s.getvalue())
              return result

          hand_target, rejected = profile_hands('hands_needed_all', tasks, marginal)
          if len(mandatory) != len(tasks):
              profile_hands('hands_needed_mandatory', mandatory, None)
          PY
