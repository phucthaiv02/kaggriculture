name: Validate scheduler feasibility pruning

on:
  push:
    branches: [agent-v3-timeout-fix-v2]
    paths:
      - .github/workflows/profile-replay-day24.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Differential test, replay benchmark, and push
        run: |
          python -m pip install -q 'kaggle-environments==1.32.7' pytest
          cp .ci/apply_scheduler_feasibility_bound.py /tmp/apply_scheduler_feasibility_bound.py
          cp .ci/validate_scheduler_feasibility_bound.py /tmp/validate_scheduler_feasibility_bound.py
          git fetch origin agent-v3
          EXPECTED=$(git rev-parse origin/agent-v3)
          git checkout -B scheduler-bound origin/agent-v3
          cp agents/scheduler.py /tmp/scheduler_old.py
          python /tmp/apply_scheduler_feasibility_bound.py
          python -m py_compile agents/scheduler.py
          git diff --check
          python /tmp/validate_scheduler_feasibility_bound.py
          python -m pytest -q tests/test_agents_scheduler.py tests/test_agents_planner.py tests/test_agents_forecast.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agents/scheduler.py
          git commit -m 'perf: prune provably impossible scheduler variants'
          git push --force-with-lease=agent-v3:${EXPECTED} origin HEAD:agent-v3
