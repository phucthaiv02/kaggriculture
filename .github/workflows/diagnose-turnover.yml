name: Diagnose turnover on agent-v3 head

on:
  push:
    branches: [agent-v3-timeout-fix-v2]
    paths:
      - .github/workflows/diagnose-turnover.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Trace day26 delayed successor against A
        run: |
          python -m pip install -q 'kaggle-environments==1.32.7'
          git fetch origin agent-v3
          git checkout --detach origin/agent-v3
          python - <<'PY'
          import agents.expansion_agent as module
          from kaggle_environments import make
          from experiments.play_match import configuration, resolve_opponent

          POS=(5,0)
          original_build_tasks=module.build_tasks
          def traced_build_tasks(obs, targets, *args, **kwargs):
              tasks=original_build_tasks(obs, targets, *args, **kwargs)
              if int(obs.get('day',-1))==26:
                  matches=[t for t in tasks if t.position==POS]
                  tile=obs['farms'][obs['player']]['tiles'][POS[1]][POS[0]]
                  print('BUILD_TASKS',{
                      'hour':int(obs.get('hour',-1)),
                      'target':repr(targets.get(POS)),
                      'pending':POS in obs.get('_pending_targets',()),
                      'seed_carrot':obs['private']['seeds'].get('CARROT',0),
                      'tile':repr(tile),
                      'tasks':[(t.actions,dict(t.needs),t.mandatory,t.ends_cycle) for t in matches],
                  })
              return tasks
          module.build_tasks=traced_build_tasks

          agent=module.make_agent(29,seed=1)
          cells=dict(zip(agent.__code__.co_freevars,(c.cell_contents for c in agent.__closure__)))
          state=cells['state']; targets=cells['targets']
          opponent,_,_=resolve_opponent('public/A.ipynb')

          def traced_agent(obs, config=None):
              day=int(obs['day']); hour=int(obs['hour'])
              if day==26 and (hour==0 or hour>=17):
                  farm=obs['farms'][obs['player']]
                  print('BEFORE',{
                      'hour':hour,
                      'tile':repr(farm['tiles'][0][5]),
                      'seed_carrot':obs['private']['seeds'].get('CARROT',0),
                      'target':repr(targets.get(POS)),
                      'daily_target':repr(state.get('daily_targets',{}).get(POS)),
                      'frozen':POS in state.get('frozen_positions',set()),
                      'pending':POS in state.get('pending_targets',set()),
                      'plan_frozen':state.get('plan_frozen'),
                      'unassigned':[(t.position,t.actions,t.mandatory) for t in state.get('unassigned',[]) if getattr(t,'position',None)==POS],
                      'workers':[tuple(farm['farmer']),*map(tuple,farm['hands'])],
                      'queues':[p.queue[:] for p in state.get('plans',[])],
                  })
              action=agent(obs,config)
              if day==26 and (hour==0 or hour>=17):
                  print('AFTER',{
                      'hour':hour,
                      'action':action,
                      'target':repr(targets.get(POS)),
                      'daily_target':repr(state.get('daily_targets',{}).get(POS)),
                      'frozen':POS in state.get('frozen_positions',set()),
                      'pending':POS in state.get('pending_targets',set()),
                      'plan_frozen':state.get('plan_frozen'),
                      'emergency_hires':state.get('emergency_hires'),
                      'unassigned':[(t.position,t.actions,t.mandatory) for t in state.get('unassigned',[]) if getattr(t,'position',None)==POS],
                      'queues':[p.queue[:] for p in state.get('plans',[])],
                  })
              return action

          env=make('kaggriculture',configuration=configuration(1),debug=False)
          env.run([traced_agent,opponent])
          print('STATUS',[s.status for s in env.state],'REWARD',[s.reward for s in env.state])
          PY
