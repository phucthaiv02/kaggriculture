name: Diagnose turnover on agent-v3 head

on:
  push:
    branches: [agent-v3-timeout-fix-v2]
    paths:
      - .github/workflows/diagnose-turnover.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run current agent-v3 on seeds 1 and 2
        run: |
          python -m pip install -q 'kaggle-environments==1.32.7'
          git fetch origin agent-v3
          git checkout --detach origin/agent-v3
          python - <<'PY'
          from collections import Counter, defaultdict
          from kaggle_environments import make
          from agents.expansion_agent import make_agent
          from experiments.crop_schedules import pass_agent
          from experiments.play_match import configuration

          def name(tile):
              if not isinstance(tile, dict):
                  return None
              return tile.get('crop') or tile.get('animal')

          def analyze(seed):
              env = make('kaggriculture', configuration=configuration(seed), debug=False)
              env.run([make_agent(29, seed=seed), pass_agent])
              print('SEED', seed, 'STATUS', [s.status for s in env.state], 'REWARD', [s.reward for s in env.state])
              hist=[]
              for step_idx, step in enumerate(env.steps):
                  ob=step[0]['observation']
                  hist.append((step_idx,int(ob['day']),int(ob['hour']),ob['farms'][0]['tiles'],step[0].get('action')))

              turnover=[]
              weeds=[]
              water=Counter()
              plant=Counter()
              for i in range(1,len(hist)):
                  step,day,hour,tiles,action=hist[i]
                  _,pday,phour,prev,_=hist[i-1]
                  if isinstance(action, dict):
                      for ops in [action.get('farmer',[]), *action.get('hands',[])]:
                          for op in ops:
                              if op and op[0]=='WATER': water[day]+=1
                              if op and op[0]=='PLANT': plant[day]+=1
                  for y in range(10):
                      for x in range(10):
                          a,b=prev[y][x],tiles[y][x]
                          if isinstance(a,dict) and a.get('kind')=='PLANT' and b is None:
                              successor=None
                              for j in range(i+1,min(len(hist),i+50)):
                                  nn=name(hist[j][3][y][x])
                                  if nn:
                                      successor=(hist[j][0]-step, nn, hist[j][1], hist[j][2])
                                      break
                              turnover.append((day,hour,(x,y),a.get('crop'),successor))
                          if isinstance(a,dict) and a.get('kind')=='PLANT' and isinstance(b,dict) and b.get('kind')=='WEED':
                              weeds.append((day,hour,(x,y),a.get('crop'),a.get('planted_day'),a.get('yield_units'),a.get('consecutive_unwatered'),a.get('watered_today')))

              pre28=[r for r in turnover if r[0] < 28]
              immediate=[r for r in pre28 if r[4] and r[4][0] <= 2]
              delayed=[r for r in pre28 if r[4] and r[4][0] > 2]
              never=[r for r in pre28 if r[4] is None]
              print('SEED',seed,'TURNOVER pre28',len(pre28),'immediate<=2',len(immediate),'delayed',len(delayed),'never',len(never))
              print('SEED',seed,'DELAYED',delayed[:80])
              print('SEED',seed,'NEVER',never[:80])
              print('SEED',seed,'WEEDS',len(weeds),weeds[:120])
              print('SEED',seed,'WATER_BY_DAY',sorted(water.items()))
              print('SEED',seed,'PLANT_BY_DAY',sorted(plant.items()))

              for day in range(8,30):
                  candidates=[row for row in hist if row[1]==day]
                  if not candidates: continue
                  _,_,_,tiles,_=candidates[-1]
                  c=Counter()
                  for row in tiles:
                      for t in row:
                          if t is None: c['EMPTY']+=1
                          elif isinstance(t,dict):
                              if t.get('kind')=='WEED': c['WEED']+=1
                              elif t.get('kind')=='PLANT': c['PLANT']+=1
                              elif t.get('animal'): c['ANIMAL']+=1
                  print('SEED',seed,'EOD',day,dict(c))

          for seed in (1,2):
              analyze(seed)
          PY
