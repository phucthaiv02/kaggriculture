name: Diagnose turnover on agent-v3 head

on:
  push:
    branches: [agent-v3-timeout-fix-v2]
    paths:
      - .github/workflows/diagnose-turnover.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run current agent-v3 against A and correlate turnover
        run: |
          python -m pip install -q 'kaggle-environments==1.32.7'
          git fetch origin agent-v3
          git checkout --detach origin/agent-v3
          rm -rf /tmp/turnover-a && mkdir -p /tmp/turnover-a
          timeout 300s python -m experiments.play_match --opponent public/A.ipynb --seed 1 --output-dir /tmp/turnover-a
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          root=Path('/tmp/turnover-a')
          match=sorted(root.glob('current_vs_A_seed1_*'))[-1]
          replay=json.loads((match/'replay.json').read_text())
          decisions=json.loads((match/'planner_decisions.json').read_text())
          result=json.loads((match/'result.json').read_text())
          print('RESULT',result)

          obs=[step[0]['observation'] for step in replay['steps']]
          decision_map=defaultdict(list)
          for d in decisions:
              decision_map[(int(d['day']),tuple(d['position']))].append(d)

          def producer(tile):
              if not isinstance(tile,dict): return None
              return tile.get('crop') or tile.get('animal')

          rows=[]
          for i in range(len(obs)-1):
              a,b=obs[i],obs[i+1]
              ta,tb=a['farms'][0]['tiles'],b['farms'][0]['tiles']
              day=int(b['day']); hour=int(b['hour'])
              for y in range(10):
                  for x in range(10):
                      before,after=ta[y][x],tb[y][x]
                      if not (isinstance(before,dict) and before.get('kind')=='PLANT' and after is None):
                          continue
                      if day < 8 or day >= 28:
                          continue
                      first_nonempty=None
                      first_producer=None
                      for j in range(i+1,min(len(obs),i+1+72)):
                          tile=obs[j]['farms'][0]['tiles'][y][x]
                          if first_nonempty is None and tile is not None:
                              first_nonempty=(j-(i+1),int(obs[j]['day']),int(obs[j]['hour']),tile.get('kind') if isinstance(tile,dict) else type(tile).__name__)
                          p=producer(tile)
                          if p:
                              first_producer=(j-(i+1),int(obs[j]['day']),int(obs[j]['hour']),p)
                              break
                      ds=decision_map.get((day,(x,y)),[])
                      latest=ds[-1] if ds else None
                      selected=None if not latest else latest.get('selected')
                      reason=None if not latest else latest.get('reason')
                      rows.append({
                          'day':day,'hour':hour,'pos':(x,y),'crop':before.get('crop'),
                          'decision_selected':selected,'decision_reason':reason,
                          'first_nonempty':first_nonempty,'first_producer':first_producer,
                      })

          same=0; delayed=0; never=0
          for r in rows:
              fp=r['first_producer']
              if fp and fp[1]==r['day']:
                  same+=1
              elif fp:
                  delayed+=1
              else:
                  never+=1
          print('SUMMARY','freed',len(rows),'same_day_producer',same,'later_producer',delayed,'no_producer_72',never)
          print('NON_SAME_DAY')
          for r in rows:
              fp=r['first_producer']
              if not fp or fp[1]!=r['day']:
                  print(r)

          print('DAY10_DECISIONS')
          for d in decisions:
              if int(d['day'])==10:
                  print({'pos':d['position'],'current':d.get('current'),'selected':d.get('selected'),'reason':d.get('reason')})
          PY
