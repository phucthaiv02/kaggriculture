name: tmp-benchmark
on:
  push:
    branches:
      - tmp/benchmark-v5-seeds1-5
permissions:
  contents: read
jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine
        run: python -m pip install --disable-pip-version-check 'kaggle-environments==1.32.7'
      - name: Reconstruct exact opponent
        run: |
          mkdir -p public
          cat .tmp/opp.part0 .tmp/opp.part1 .tmp/opp.part2 | base64 -d | gzip -d > public/A.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          digest = hashlib.sha256(Path('public/A.py').read_bytes()).hexdigest()
          print('OPPONENT_SHA256=' + digest)
          assert digest == 'ccf2aefdadd600d3e6fcaad2879a310eb15bbd14183fc2deeff9bb2525697b9a'
          PY
      - name: Measure V5 runtime on seed 5
        run: |
          python - <<'PY'
          import json
          import time
          import agents
          from kaggle_environments import make
          import agents.expansion_agent as expansion
          from experiments.play_match import configuration, resolve_opponent

          seed = 5
          planner_times = []
          original_plan_targets = expansion.plan_targets
          def timed_plan_targets(*args, **kwargs):
              started = time.perf_counter()
              try:
                  return original_plan_targets(*args, **kwargs)
              finally:
                  planner_times.append(time.perf_counter() - started)
          expansion.plan_targets = timed_plan_targets

          current = expansion.make_agent(29, seed=seed)
          agent_times = []
          def timed_agent(obs, config):
              started = time.perf_counter()
              try:
                  return current(obs, config)
              finally:
                  agent_times.append(time.perf_counter() - started)

          opponent, _, _ = resolve_opponent('public/A.py')
          env = make('kaggriculture', configuration=configuration(seed), debug=False)
          env.run([timed_agent, opponent])

          def stats(values):
              ordered = sorted(values)
              def percentile(p):
                  if not ordered:
                      return None
                  idx = min(len(ordered) - 1, max(0, int((len(ordered) - 1) * p)))
                  return ordered[idx]
              return {
                  'count': len(ordered),
                  'mean_s': sum(ordered) / len(ordered) if ordered else None,
                  'p50_s': percentile(0.50),
                  'p95_s': percentile(0.95),
                  'p99_s': percentile(0.99),
                  'max_s': max(ordered) if ordered else None,
                  'over_0_5s': sum(v > 0.5 for v in ordered),
                  'over_0_4s': sum(v > 0.4 for v in ordered),
              }

          final = env.steps[-1]
          result = {
              'seed': seed,
              'current_cash': float(final[0].reward),
              'opponent_cash': float(final[1].reward),
              'agent_callback': stats(agent_times),
              'plan_targets': stats(planner_times),
          }
          print('PERF_JSON=' + json.dumps(result, separators=(',', ':')))
          PY
