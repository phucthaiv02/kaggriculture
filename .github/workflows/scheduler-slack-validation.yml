name: Scheduler priority ablation

on:
  push:
    branches: [agent-v3]
    paths:
      - .github/workflows/scheduler-slack-validation.yml
      - experiments/_validate_scheduler_ablation.py

permissions:
  contents: read

env:
  PATCH_BASE_COMMIT: 9c81e171a80ce495491776649ce8a2f755bfb3ca
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  ablation:
    strategy:
      fail-fast: false
      matrix:
        variant:
          - no_animal_rescue
          - no_timesensitive_cost
          - no_route_priority
          - no_feed_order
          - all_minimal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply one scheduler ablation in runner only
        env:
          SCHEDULER_ABLATION: ${{ matrix.variant }}
        run: |
          git show "$PATCH_BASE_COMMIT:agents/scheduler.py" > agents/scheduler.py
          git show "$PATCH_BASE_COMMIT:agents/expansion_agent.py" > agents/expansion_agent.py
          python experiments/_validate_scheduler_ablation.py
          python -m py_compile agents/scheduler.py agents/scheduler_post.py agents/expansion_agent.py
          git diff --check
      - name: Install runtime
        run: python -m pip install kaggle-environments
      - name: Replay against A
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p "validation/$VARIANT"
          /usr/bin/time -f '%e' -o "validation/$VARIANT/seconds.txt" \
            timeout 300s python -m experiments.play_match \
              --opponent public/A.ipynb --seed 1 --output-dir "validation/$VARIANT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          variant = os.environ['VARIANT']
          root = Path('validation') / variant
          out_dir = sorted(root.glob('current_vs_A_seed1_*'))[-1]
          result = json.loads((out_dir / 'result.json').read_text())
          summary = {
              'variant': variant,
              'cash': result['current_cash'],
              'margin': result['margin'],
              'statuses': result['statuses'],
              'seconds': float((root / 'seconds.txt').read_text()),
              'delta_vs_animal_fixed_91362': result['current_cash'] - 91362.0,
          }
          print(json.dumps(summary, indent=2))
          (root / 'summary.json').write_text(json.dumps(summary, indent=2))
          if result['statuses'] != ['DONE', 'DONE']:
              raise SystemExit(summary)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduler-ablation-${{ matrix.variant }}-${{ github.sha }}
          path: validation/${{ matrix.variant }}
          if-no-files-found: warn
