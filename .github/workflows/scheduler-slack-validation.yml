name: Validate generic global packing retry

on:
  push:
    branches: [agent-v3]
    paths:
      - .github/workflows/scheduler-slack-validation.yml
      - experiments/_validate_scheduler_generic_retry.py

permissions:
  contents: read

env:
  PATCH_BASE_COMMIT: 9c81e171a80ce495491776649ce8a2f755bfb3ca
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply generic global packing candidate in runner only
        run: |
          git show "$PATCH_BASE_COMMIT:agents/scheduler.py" > agents/scheduler.py
          git show "$PATCH_BASE_COMMIT:agents/expansion_agent.py" > agents/expansion_agent.py
          python experiments/_validate_scheduler_generic_retry.py
          python -m py_compile agents/scheduler.py agents/scheduler_post.py agents/expansion_agent.py
          git diff --check
      - name: Install runtime
        run: python -m pip install kaggle-environments
      - name: Replay against A
        run: |
          mkdir -p validation/generic_retry
          /usr/bin/time -f '%e' -o validation/generic_retry/seconds.txt \
            timeout 300s python -m experiments.play_match \
              --opponent public/A.ipynb --seed 1 --output-dir validation/generic_retry
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('validation/generic_retry')
          out_dir = sorted(root.glob('current_vs_A_seed1_*'))[-1]
          result = json.loads((out_dir / 'result.json').read_text())
          summary = {
              'cash': result['current_cash'],
              'margin': result['margin'],
              'statuses': result['statuses'],
              'seconds': float((root / 'seconds.txt').read_text()),
              'delta_vs_animal_fixed_91362': result['current_cash'] - 91362.0,
          }
          print(json.dumps(summary, indent=2))
          (root / 'summary.json').write_text(json.dumps(summary, indent=2))
          if result['statuses'] != ['DONE', 'DONE']:
              raise SystemExit(summary)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduler-generic-retry-${{ github.sha }}
          path: validation/generic_retry
          if-no-files-found: warn
