name: Validate day-locked no-priority routing

on:
  push:
    branches: [agent-v3]
    paths:
      - .github/workflows/scheduler-slack-validation.yml
      - experiments/_validate_scheduler_resource_safe_daylock.py
      - experiments/_validate_scheduler_resource_safe.py
      - experiments/_validate_scheduler_generic_retry.py

permissions:
  contents: read

env:
  PATCH_BASE_COMMIT: 9c81e171a80ce495491776649ce8a2f755bfb3ca
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply candidate in runner only
        run: |
          git show "$PATCH_BASE_COMMIT:agents/scheduler.py" > agents/scheduler.py
          git show "$PATCH_BASE_COMMIT:agents/expansion_agent.py" > agents/expansion_agent.py
          git show "$PATCH_BASE_COMMIT:agents/farm_tasks.py" > agents/farm_tasks.py
          python experiments/_validate_scheduler_resource_safe_daylock.py
          python -m py_compile agents/scheduler.py agents/scheduler_post.py agents/expansion_agent.py agents/farm_tasks.py
          git diff --check

      - name: Install runtime
        run: python -m pip install pytest kaggle-environments

      - name: Check route and regime invariants
        run: |
          python - <<'PY'
          from agents.farm_tasks import Task
          from agents.scheduler_post import build_queues

          # Final post-opening route order is not constrained by task class.
          near_optional = Task((4, 3), [['FEED']], mandatory=False, value=100)
          far_required = Task((0, 0), [['HARVEST']], mandatory=True)
          plans, missing = build_queues([far_required, near_optional], (4, 4), 0)
          assert not missing
          assert plans[0].queue.index(['FEED']) < plans[0].queue.index(['HARVEST']), plans[0].queue
          PY

      - name: Replay candidate and stable base against A
        run: |
          mkdir -p validation/candidate validation/base
          /usr/bin/time -f '%e' -o validation/candidate_seconds.txt \
            timeout 300s python -m experiments.play_match \
              --opponent public/A.ipynb --seed 1 --output-dir validation/candidate
          git worktree add --detach "$RUNNER_TEMP/base" "$PATCH_BASE_COMMIT"
          /usr/bin/time -f '%e' -o validation/base_seconds.txt \
            bash -lc 'cd "$0" && PYTHONPATH="$0" timeout 300s python -m experiments.play_match --opponent "$1/public/A.ipynb" --seed 1 --output-dir "$1/validation/base"' "$RUNNER_TEMP/base" "$GITHUB_WORKSPACE"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('validation')
          cdir = sorted((root/'candidate').glob('current_vs_A_seed1_*'))[-1]
          bdir = sorted((root/'base').glob('current_vs_A_seed1_*'))[-1]
          C = json.loads((cdir/'result.json').read_text())
          B = json.loads((bdir/'result.json').read_text())
          cr = json.loads((cdir/'replay.json').read_text())
          br = json.loads((bdir/'replay.json').read_text())

          def opening_days(replay):
              days = set()
              for step in replay['steps']:
                  obs = step[0]['observation']
                  if obs['hour'] != 0:
                      continue
                  farm = obs['farms'][obs['player']]
                  if len(farm['unlocked_quadrants']) == 1:
                      days.add(obs['day'])
              return days

          candidate_opening = opening_days(cr)
          base_opening = opening_days(br)
          first = None
          candidate_post_wheat = 0
          base_post_wheat = 0
          for index, (cs, bs) in enumerate(zip(cr['steps'], br['steps'])):
              co, bo = cs[0]['observation'], bs[0]['observation']
              ca, ba = cs[0].get('action') or {}, bs[0].get('action') or {}
              if first is None and ca != ba:
                  first = {
                      'index': index, 'day': bo['day'], 'hour': bo['hour'],
                      'base': ba, 'candidate': ca,
                  }
              if co['day'] not in candidate_opening and co['hour'] > 1:
                  candidate_post_wheat += sum(
                      int(order[2]) for order in ca.get('market', [])
                      if order[0] == 'BUY_PRODUCT' and order[1] == 'WHEAT'
                  )
              if bo['day'] not in base_opening and bo['hour'] > 1:
                  base_post_wheat += sum(
                      int(order[2]) for order in ba.get('market', [])
                      if order[0] == 'BUY_PRODUCT' and order[1] == 'WHEAT'
                  )

          def empty_structures(replay):
              obs = replay['steps'][-1][0]['observation']
              farm = obs['farms'][obs['player']]
              return sum(
                  1 for row in farm['tiles'] for tile in row
                  if isinstance(tile, dict)
                  and tile.get('kind') in ('COOP', 'PASTURE')
                  and not tile.get('animal')
              )

          out = {
              'candidate_cash': C['current_cash'],
              'base_cash': B['current_cash'],
              'delta': C['current_cash'] - B['current_cash'],
              'candidate_statuses': C['statuses'],
              'base_statuses': B['statuses'],
              'candidate_seconds': float((root/'candidate_seconds.txt').read_text()),
              'base_seconds': float((root/'base_seconds.txt').read_text()),
              'candidate_opening_days': sorted(candidate_opening),
              'candidate_post_hour2plus_wheat': candidate_post_wheat,
              'base_post_hour2plus_wheat': base_post_wheat,
              'candidate_empty_structures': empty_structures(cr),
              'base_empty_structures': empty_structures(br),
              'first_divergence': first,
          }
          print(json.dumps(out, indent=2))
          (root/'comparison.json').write_text(json.dumps(out, indent=2))
          if C['statuses'] != ['DONE', 'DONE']:
              raise SystemExit(out)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduler-daylock-${{ github.sha }}
          path: validation
          if-no-files-found: warn
