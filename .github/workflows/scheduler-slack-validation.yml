name: Validate admission-route separation

on:
  push:
    branches: [agent-v3]
    paths:
      - .github/workflows/scheduler-slack-validation.yml
      - experiments/_validate_scheduler_fixed_admission_route.py
      - experiments/_validate_scheduler_generic_retry.py

permissions:
  contents: read

env:
  PATCH_BASE_COMMIT: 9c81e171a80ce495491776649ce8a2f755bfb3ca
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply admission-route split in runner only
        run: |
          git show "$PATCH_BASE_COMMIT:agents/scheduler.py" > agents/scheduler.py
          git show "$PATCH_BASE_COMMIT:agents/expansion_agent.py" > agents/expansion_agent.py
          python experiments/_validate_scheduler_fixed_admission_route.py
          python -m py_compile agents/scheduler.py agents/scheduler_post.py agents/expansion_agent.py
          git diff --check
      - name: Install runtime
        run: python -m pip install kaggle-environments
      - name: Check fixed workload routes ignore task class
        run: |
          python - <<'PY'
          from agents.farm_tasks import Task
          from agents.scheduler_post import build_queues

          near_optional = Task((4, 3), [['FEED']], mandatory=False, value=100)
          far_required = Task((0, 0), [['HARVEST']], mandatory=True)
          plans, missing = build_queues([far_required, near_optional], (4, 4), 0)
          assert not missing
          assert plans[0].queue.index(['FEED']) < plans[0].queue.index(['HARVEST']), plans[0].queue
          PY
      - name: Replay against A
        run: |
          mkdir -p validation/fixed_admission_route
          /usr/bin/time -f '%e' -o validation/fixed_admission_route/seconds.txt \
            timeout 300s python -m experiments.play_match \
              --opponent public/A.ipynb --seed 1 --output-dir validation/fixed_admission_route
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('validation/fixed_admission_route')
          out_dir = sorted(root.glob('current_vs_A_seed1_*'))[-1]
          result = json.loads((out_dir / 'result.json').read_text())
          summary = {
              'cash': result['current_cash'],
              'margin': result['margin'],
              'statuses': result['statuses'],
              'seconds': float((root / 'seconds.txt').read_text()),
              'delta_vs_animal_fixed_91362': result['current_cash'] - 91362.0,
          }
          print(json.dumps(summary, indent=2))
          (root / 'summary.json').write_text(json.dumps(summary, indent=2))
          if result['statuses'] != ['DONE', 'DONE']:
              raise SystemExit(summary)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduler-fixed-admission-route-${{ github.sha }}
          path: validation/fixed_admission_route
          if-no-files-found: warn
