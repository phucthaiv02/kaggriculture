[model]
d_model = 416
board_blocks = 6
transformer_layers = 6
attention_heads = 8
ff_multiplier = 4
dropout = 0.05

[train]
algorithm = "awr"
awr_temperature = 0.10
awr_max_weight = 20.0
train_dir = "data/shards/train"
validation_dir = "data/shards/validation"
output = "checkpoints/agent_h100.pt"
run_dir = "runs/agent_awr_h100"
epochs = 10
batch_size = 256
gradient_accumulation = 2
learning_rate = 0.00005
min_learning_rate = 0.000005
weight_decay = 0.01
warmup_steps = 500
max_steps = 0
workers = 12
prefetch_factor = 4
log_interval = 20
validation_interval = 1000
checkpoint_interval = 2000
seed = 43
compile = true
bf16 = true
gradient_checkpointing = true
max_grad_norm = 1.0
