[model]
d_model = 416
board_blocks = 6
transformer_layers = 6
attention_heads = 8
ff_multiplier = 4
dropout = 0.05

[train]
train_dir = "data/shards/train"
validation_dir = "data/shards/validation"
output = "checkpoints/agent_h100.pt"
run_dir = "runs/agent_bc_h100"
epochs = 30
batch_size = 256
gradient_accumulation = 2
learning_rate = 0.0003
min_learning_rate = 0.00001
weight_decay = 0.01
warmup_steps = 2000
max_steps = 0
workers = 12
prefetch_factor = 4
log_interval = 20
validation_interval = 1000
checkpoint_interval = 2000
seed = 42
compile = true
bf16 = true
gradient_checkpointing = true
max_grad_norm = 1.0
